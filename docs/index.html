// Rafraîchit les <option> du select rôle sans perdre la saisie en cours
function refreshRoleSelect(selectedValue) {
  const sel = document.getElementById("f-role");
  if (!sel) return;
  sel.innerHTML = getRoles().map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("");
  if (selectedValue && getRoles().includes(selectedValue)) sel.value = selectedValue;
}
function addRoleUI() {
  const name = prompt("Nom du nouveau rôle :");
  if (!name || !name.trim()) return;
  addRole(name.trim());
  refreshRoleSelect(name.trim());
  toast("Rôle ajouté");
}
function removeRoleUI() {
  const sel = document.getElementById("f-role");
  if (!sel || !sel.value) return;
  if (getRoles().length <= 1) { alert("Impossible de supprimer le dernier rôle."); return; }
  if (!confirm(`Supprimer le rôle « ${sel.value} » de la liste ?`)) return;
  removeRole(sel.value);
  refreshRoleSelect();
  toast("Rôle supprimé");
}

/* ============================================================
   VUE : GESTION DES DROITS (TL uniquement)
   ============================================================ */
const ACCESS_ROLE_LABELS = {admin:"Admin", tl:"TL", mentor:"Mentor", newcomer:"Newcomer", observateur:"Observateur"};
function renderDroits() {
  DEMO_CONTEXT = false;
  if (!hasPerm("manage_rights")) { go(""); return; } // réservé aux détenteurs du droit
  const s = getStructure();
  const logins = {...(s.logins || {})}; // copie pour affichage (on peut y ajouter les newcomers sans polluer la base)
  const overrides = s.accessRoles || {};

  // Liste des personnes connues = connexions + défauts codés + overrides + emails des newcomers créés
  const known = {};
  Object.keys(logins).forEach(lp => { known[lp] = true; });
  (ACCESS_DEFAULTS.admin || []).forEach(lp => known[lp] = true);
  ACCESS_DEFAULTS.tl.forEach(lp => known[lp] = true);
  ACCESS_DEFAULTS.mentor.forEach(lp => known[lp] = true);
  Object.keys(overrides).forEach(lp => known[lp] = true);
  // Newcomers créés (même jamais connectés) : on les ajoute via le local part de leur email
  loadData().newcomers.forEach(nc => {
    const lp = emailLocalPart(nc.email);
    if (lp && !known[lp]) known[lp] = true;
    if (lp && !logins[lp]) logins[lp] = {name: nc.name}; // pour afficher leur nom (statut "Jamais connecté")
  });

  const rows = Object.keys(known).sort().map(lp => {
    const info = logins[lp] || {};
    const role = roleForEmail(lp + "@pennylane.com");
    const last = info.last ? (() => { const d=new Date(info.last); return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); })() : "—";
    const name = info.name || lp;
    const sel = ["admin","tl","mentor","newcomer","observateur"].map(r => `<option value="${r}" ${role===r?"selected":""}>${ACCESS_ROLE_LABELS[r]}</option>`).join("");
    const previewBtn = canImpersonateRole(role) ? `<button class="btn btn-sm btn-outline" title="Voir l'app comme cette personne" onclick="startImpersonate('${lp}@pennylane.com')">👁 Prévisualiser</button>` : "";
    return `<tr style="border-top:1px solid var(--border);">
      <td style="padding:8px 10px;"><div style="font-weight:600; color:var(--teal-dark); font-size:0.85rem;">${esc(name)}</div><div style="font-size:0.75rem; color:var(--text-muted);">${esc(lp)}@pennylane.com</div></td>
      <td style="padding:8px 10px; font-size:0.8rem; color:var(--text-muted);">${info.last?"Connecté":"Jamais connecté"}</td>
      <td style="padding:8px 10px; font-size:0.8rem; color:var(--text-muted);">${last}</td>
      <td style="padding:8px 10px;"><select onchange="changeAccessRole('${lp}', this.value)" style="font-size:0.8rem; padding:4px 8px;">${sel}</select></td>
      <td style="padding:8px 10px; text-align:center;">${previewBtn}</td>
    </tr>`;
  }).join("");

  const header = `
    <div style="margin-bottom:20px;"><a style="color:var(--text-muted); font-size:0.875rem; font-weight:600;" onclick="go('')">← Dashboard</a></div>
    <div style="margin-bottom:20px;">
      <h1 style="font-size:1.6rem; font-weight:800; color:var(--teal-dark); letter-spacing:-0.4px;">Gestion des droits</h1>
    </div>`;
  document.getElementById("app").innerHTML = header + `
    <div class="card" style="padding:16px 20px; margin-bottom:16px; background:var(--teal-light); border-color:var(--green-dark);">
      <p style="font-size:0.82rem; color:var(--teal-dark); font-weight:600;">Gestion des droits d'accès. Par défaut, toute connexion @pennylane.com = <strong>Newcomer</strong>. Modifie un rôle via le menu déroulant.</p>
    </div>
    ${renderPermsTable()}
    <div class="card" style="padding:0; overflow:hidden;">
      <div class="phase-title" style="padding:14px 20px; margin:0;">Personnes (${Object.keys(known).length})</div>
      <table style="width:100%; border-collapse:collapse;">
        <thead><tr style="background:var(--teal-light); font-size:0.72rem; color:var(--teal-mid); text-transform:uppercase; letter-spacing:.5px;">
          <th style="padding:10px; text-align:left;">Personne</th><th style="padding:10px; text-align:left;">Statut</th><th style="padding:10px; text-align:left;">Dernière connexion</th><th style="padding:10px; text-align:left;">Rôle</th><th style="padding:10px; text-align:center;">Prévisualiser</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}
// Tableau "Droits par rôle" — éditable par l'Admin (cases on/off), lecture seule sinon.
function renderPermsTable() {
  const editable = isAdmin();
  const cell = (perm, role) => {
    const on = roleHasPerm(role, perm.key);
    if (editable) {
      // L'admin garde toujours ses droits (cases admin verrouillées sur ✅)
      const locked = (role === "admin");
      return `<td style="padding:7px 10px; text-align:center;">
        <input type="checkbox" ${on?"checked":""} ${locked?"disabled":""}
          onchange="togglePerm('${perm.key}','${role}',this.checked)"
          style="width:16px; height:16px; cursor:${locked?"not-allowed":"pointer"};" title="${locked?"L'Admin conserve toujours ce droit":""}">
      </td>`;
    }
    return `<td style="padding:7px 10px; text-align:center;">${on?"✅":"❌"}</td>`;
  };
  const section = (title, cat) => {
    const permRows = PERMISSIONS.filter(p => p.cat === cat).map(p =>
      `<tr style="border-top:1px solid var(--border);">
        <td style="padding:7px 10px;">${p.label}</td>
        ${PERM_ROLES.map(r => cell(p, r)).join("")}
      </tr>`).join("");
    return `<tr><td colspan="${PERM_ROLES.length+1}" style="padding:12px 10px 4px; font-weight:800; color:var(--teal-mid); text-transform:uppercase; font-size:0.72rem; letter-spacing:.5px;">${title}</td></tr>${permRows}`;
  };
  return `<div class="card">
    <div class="phase-title">Droits par rôle${editable ? ` <span style="font-weight:600; text-transform:none; letter-spacing:0; color:var(--text-muted); font-size:0.75rem;">— cases modifiables, enregistrées pour tous</span>` : ""}</div>
    <table style="width:100%; border-collapse:collapse; font-size:0.82rem;">
      <thead><tr style="color:var(--teal-mid); text-transform:uppercase; font-size:0.72rem; letter-spacing:.4px;">
        <th style="padding:8px 10px; text-align:left;">Droit</th>
        ${PERM_ROLES.map(r => `<th style="padding:8px 10px; text-align:center;">${ACCESS_ROLE_LABELS[r]}</th>`).join("")}
      </tr></thead>
      <tbody>
        ${section("Actions", "action")}
        ${section("Accès (onglets)", "access")}
      </tbody>
    </table>
    ${editable ? `<div style="margin-top:12px; text-align:right;"><button class="btn btn-sm btn-outline" onclick="resetPerms()">↺ Réinitialiser les droits par défaut</button></div>` : ""}
  </div>`;
}
function togglePerm(permKey, role, val) {
  if (!isAdmin()) return;
  if (role === "admin") return; // l'Admin garde ses droits
  setPerm(permKey, role, val);
  toast("Droit mis à jour");
  renderDroits();
}
function resetPerms() {
  if (!isAdmin()) return;
  saveStructure(s => { s.perms = {}; });
  toast("Droits réinitialisés");
  renderDroits();
}
function changeAccessRole(lp, role) {
  // "newcomer" = valeur par défaut → si c'est aussi le défaut codé, on retire l'override pour rester propre
  const isDefaultTL = ACCESS_DEFAULTS.tl.includes(lp);
  const isDefaultMentor = ACCESS_DEFAULTS.mentor.includes(lp);
  const naturalDefault = isDefaultTL ? "tl" : (isDefaultMentor ? "mentor" : "newcomer");
  setAccessRole(lp, role === naturalDefault ? null : role);
  toast("Rôle mis à jour");
  renderDroits();
}
// Prévisualiser l'app comme une autre personne (impersonation, réservé à l'Admin)
function startImpersonate(email) {
  if (!canImpersonateRole(roleForEmail(email))) { toast("Tu ne peux prévisualiser qu'un rôle moins doté que le tien"); return; }
  setImpersonate(email);
  toast("Prévisualisation : " + email);
  go(""); // repart du dashboard dans la vue impersonée
}

/* ============================================================
   VUE : DÉTAIL
   ============================================================ */
function detailHeader(n, tabKey) {
  const tabStyle = active => active
    ? "padding:9px 16px; border:none; border-bottom:3px solid var(--green); background:none; font-weight:800; color:var(--teal-dark); cursor:pointer; font-family:'Manrope',sans-serif; font-size:0.875rem; white-space:nowrap;"
    : "padding:9px 16px; border:none; border-bottom:3px solid transparent; background:none; font-weight:600; color:var(--text-muted); cursor:pointer; font-family:'Manrope',sans-serif; font-size:0.875rem; white-space:nowrap;";
  const withTiers = showAccessTiers();
  // Regroupement par palier d'accès : ligne 1 = Admin, puis TL, puis Mentors ; ligne 2 = Newcomers.
  // TAB_ACCESS_TIERS va du plus large (newcomer) au plus restreint (admin), on trie à l'envers.
  // NB : c'est un ordre d'AFFICHAGE. L'ordre de TABS reste le parcours logique, et c'est lui qui
  // détermine l'onglet par défaut (curTabKey / firstAllowedTabKey) — ne pas les confondre.
  const tierRank = t => {
    const x = tabAccessTier(t);
    return x ? TAB_ACCESS_TIERS.findIndex(y => y.role === x.role) : 0;
  };
  const visibleTabs = TABS.filter(t => canAccessTab(t)).slice().sort((a, b) => tierRank(b) - tierRank(a));
  const firstNewcomerIdx = visibleTabs.findIndex(t => tierRank(t) === 0);
  // Saut de ligne forcé avant le bloc Newcomers, sauf s'il n'y a rien au-dessus (cas du newcomer)
  const breakAt = firstNewcomerIdx > 0 ? firstNewcomerIdx : -1;
  const tabsHtml = visibleTabs.map((t, i) => {
    const brk = i === breakAt ? `<div style="flex-basis:100%; height:0;"></div>` : "";
    const c = countTab(n, t);
    const counter = c.total ? ` <span style="font-weight:600; color:var(--text-muted); font-size:0.78rem;">${c.done}/${c.total}</span>` : "";
    // Pastille de droits (TL/Admin seulement) : couleur = audience la plus large de l'onglet
    const tier = withTiers ? tabAccessTier(t) : null;
    const dot = tier
      ? `<span title="Visible : ${esc(tier.label)}" style="display:inline-block; width:7px; height:7px; border-radius:50%; background:${tier.color}; margin-right:6px; vertical-align:middle;"></span>`
      : "";
    return `${brk}<button style="${tabStyle(tabKey===t.key)}" onclick="go('newcomer/${n.id}/${t.key}')">${dot}${esc(t.label)}${counter}</button>`;
  }).join("");
  const tiersLegend = withTiers ? `<div style="display:flex; gap:14px; flex-wrap:wrap; margin:-16px 0 20px; font-size:0.7rem; color:var(--text-muted); font-weight:600;">
      <span>Visible par :</span>
      ${TAB_ACCESS_TIERS.map(t => `<span style="display:inline-flex; align-items:center; gap:5px;">
        <span style="display:inline-block; width:7px; height:7px; border-radius:50%; background:${t.color};"></span>${esc(t.label)}
      </span>`).join("")}
    </div>` : "";
  return `
    <div style="margin-bottom:20px;"><a style="color:var(--text-muted); font-size:0.875rem; font-weight:600;" onclick="go('')">← Dashboard</a></div>
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px; flex-wrap:wrap; gap:16px;">
      <div>
        <h1 style="font-size:1.6rem; font-weight:800; color:var(--teal-dark); letter-spacing:-0.4px;">${esc(n.name)}${n.archived?' <span class="badge badge-pending" style="vertical-align:middle;">Archivé</span>':''}${n.demo?' <span style="vertical-align:middle; font-size:0.7rem; font-weight:800; letter-spacing:.6px; text-transform:uppercase; background:#8B5CF6; color:#fff; border-radius:999px; padding:3px 10px;">Démo</span>':''}</h1>
        <div style="color:var(--text-muted); font-size:0.875rem; margin-top:6px; display:flex; gap:16px; flex-wrap:wrap; font-weight:500;">
          <span>${esc(n.email)}</span>
          ${n.slack_handle?`<span>· ${esc(n.slack_handle)}</span>`:""}
          ${n.role?`<span>· ${esc(n.role)}</span>`:""}
          ${n.arrival_date?`<span>· Arrivée : <strong style="color:var(--teal-dark);">${esc(n.arrival_date)}</strong></span>`:""}
          ${n.tl?`<span>· TL : <strong style="color:var(--teal-dark);">${esc(n.tl)}</strong></span>`:""}
          ${referentsLabel(n)?`<span>· Référent : <strong style="color:var(--teal-dark);">${esc(referentsLabel(n))}</strong></span>`:""}
        </div>
      </div>
      ${hasPerm("edit_newcomer") ? `<button class="btn btn-sm btn-outline" onclick="openEditNewcomer(${n.id})">✏️ Modifier</button>` : ""}
    </div>
    <div class="tabbar" style="display:flex; flex-wrap:wrap; gap:4px 2px; border-bottom:1px solid var(--border); margin-bottom:24px;">
      ${tabsHtml}
    </div>
    ${tiersLegend}`;
}

// Modale d'édition d'un newcomer (nom, email, handle, rôle, date, notes)
function openEditNewcomer(id) {
  if (!requirePerm("edit_newcomer")) return;
  const n = getNewcomer(id);
  if (!n) return;
  const roleOpts = getRoles().map(r => `<option value="${esc(r)}" ${n.role===r?"selected":""}>${esc(r)}</option>`).join("");
  const body = `
    <div style="display:grid; gap:14px;">
      <div><label>Nom complet *</label><input id="edit-name" value="${esc(n.name)}"></div>
      <div><label>Email</label><input id="edit-email" type="email" value="${esc(n.email)}"></div>
      <div><label>Handle Slack</label><input id="edit-slack" value="${esc(n.slack_handle||"")}"></div>
      <div><label>Rôle</label><select id="edit-role">${roleOpts}</select></div>
      <div><label>Date d'arrivée</label><input id="edit-date" type="date" value="${esc(n.arrival_date||"")}"></div>
      <div><label>TL</label>${tlSelectHtml("edit-tl", n.tl || "")}</div>
      <div><label>Référent(s)</label>${referentsPickerHtml("edit-referent", referentsOf(n))}</div>
      <label style="display:flex; align-items:center; gap:9px; font-size:0.82rem; color:var(--teal-dark); cursor:pointer;">
        <input type="checkbox" id="edit-demo" ${n.demo?"checked":""} style="width:16px; height:16px; cursor:pointer;">
        Fiche démo : ouverte à toute l'équipe, qui peut y cocher librement pour découvrir l'outil
      </label>
      <div style="display:flex; justify-content:flex-end; gap:10px;">
        <button class="btn btn-sm btn-outline" onclick="closeModal()">Annuler</button>
        <button class="btn btn-sm btn-primary" onclick="saveEditNewcomer(${id})">Enregistrer</button>
      </div>
    </div>`;
  document.getElementById("modal-title").textContent = "Modifier le newcomer";
  document.getElementById("modal-body").innerHTML = body;
  document.getElementById("modal").classList.add("open");
}
function saveEditNewcomer(id) {
  if (!requirePerm("edit_newcomer")) return;
  const name = document.getElementById("edit-name").value.trim();
  const email = document.getElementById("edit-email").value.trim();
  if (!name || !email) { alert("Nom et email obligatoires."); return; }
  const patch = {
    name, email,
    slack_handle: document.getElementById("edit-slack").value.trim(),
    role: document.getElementById("edit-role").value,
    arrival_date: document.getElementById("edit-date").value,
    tl: document.getElementById("edit-tl").value,
    referent: readReferentsPicker("edit-referent"),
    mentors: null,   // champ éphémère retiré : absorbé dans referent par referentsOf
    demo: document.getElementById("edit-demo").checked,
  };
  // 1) Fermer la modale AVANT tout (garanti, même si un render échoue ensuite)
  document.getElementById("modal").classList.remove("open");
  // 2) Sauvegarder puis rafraîchir (protégé)
  try {
    updateNewcomer(id, patch);
    renderUserBadge();   // la case « fiche démo » a pu changer
    renderDetail(id, curTabKey());
    toast("Newcomer mis à jour");
  } catch (e) {
    console.warn("Erreur maj newcomer :", e.message);
  }
}

// Rend un cadre (checklist) : items base + custom (global), avec ajout/suppression + drag&drop
function frameCard(n, frameKey, tabKey) {
  const f = frameDef(frameKey);
  if (!f) return "";
  const tl = hasPerm("edit_structure"); // outils d'édition de structure (réorg, ajout/suppr)
  const allItems = frameItems(frameKey);
  const noCheck = !!f.noCheck;
  const editNotes = !!f.editableNotes;
  const editDesc = !!f.editableDesc && hasPerm("edit_desc"); // édition des descriptions
  const isCustomFrame = !!f.custom;
  const editLabel = !!f.editableLabel && hasPerm("edit_desc"); // même droit que les descriptions
  const cols = frameColsFor(frameKey); // colonnes du cadre (3 rôles, checklist, ou null)
  const countItems = allItems.filter(it => !it.heading); // exclut les sous-titres
  const done = cols
    ? countItems.filter(it => cols.every(rc => itemRoleDone(n, it.key, rc.key))).length
    : countItems.filter(it => itemDone(n, it.key)).length;

  // Bloc note éditable "ce qu'on doit montrer" (cadres editableNotes)
  const noteBlock = it => {
    if (!editNotes) return "";
    const note = getItemNote(n, it.key);
    return `<div style="margin-top:6px; margin-left:32px;">
      <textarea id="note-${it.key}" placeholder="Ce qu'on doit montrer… (cliquer pour éditer)"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';"
        onblur="saveItemNoteFromUI(${n.id}, '${it.key}', this.value)"
        style="width:100%; min-height:34px; font-size:0.8rem; color:var(--teal-dark); border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-family:'Manrope',sans-serif; resize:none; background:${note?'#FFFFFF':'#FAFDFD'};">${esc(note)}</textarea>
    </div>`;
  };

  const handle = tl ? `<span class="drag-handle" title="Glisser pour réordonner" style="cursor:grab; color:#B8C4C4; font-size:0.95rem; padding:0 2px; user-select:none;">⠿</span>` : "";

  let rows = allItems.map(it => {
    // Sous-titre de section (non cochable, non compté) : sépare les groupes de lignes dans un cadre fusionné
    if (it.heading) {
      const delH = tl ? `<button class="btn btn-sm btn-danger-ghost" title="Supprimer ce sous-titre" style="margin-left:auto;" onclick="deleteLine('${frameKey}', '${it.key}', ${it.custom?1:0})">✕</button>` : "";
      return `<div class="dr-row" draggable="true" data-item="${it.key}" data-frame="${frameKey}">
        <div class="task-row" style="border-bottom:none; padding-top:14px; padding-bottom:2px; align-items:center;">
          ${tl ? `<span class="drag-handle" title="Glisser pour réordonner" style="cursor:grab; color:#B8C4C4; font-size:0.95rem; padding:0 2px; user-select:none;">⠿</span>` : ""}
          <div style="font-size:0.8rem; font-weight:800; color:var(--teal-mid); text-transform:uppercase; letter-spacing:.5px;">${esc(it.label)}</div>
          ${delH}
        </div>
      </div>`;
    }
    const st = itemDone(n, it.key);
    let right = "";
    if (it.link) right += `<a href="${it.link}" target="_blank" class="task-link btn btn-sm btn-outline" style="white-space:nowrap;">${esc(it.linkLabel || "Ouvrir")}</a>`;
    if (Array.isArray(it.links)) it.links.forEach(l => {
      if (l.url) right += `<a href="${l.url}" target="_blank" class="task-link btn btn-sm btn-outline" style="white-space:nowrap;">${esc(l.label || "Ouvrir")}</a>`;
      else right += `<span class="btn btn-sm" style="white-space:nowrap; background:#EEF2F2; color:var(--text-muted); cursor:default;" title="Lien à venir">${esc(l.label || "")} (à venir)</span>`;
    });
    if (it.action) {
      const labels = {slack:"Préparer Slack", jira_connect:"Ticket Jira", jira_chift:"Ticket Jira", jira_metabase:"Ticket Jira", jira_tresorit:"Ticket Jira", swan:"Préparer DM Vincent", braga:"Préparer msg Braga", ops_chili:"Ticket OPS", ops_modjo:"Ticket OPS", ops_intercom:"Ticket OPS"};
      right += `<button class="btn btn-sm btn-slack" style="white-space:nowrap;" onclick="openAction('${it.action}', ${n.id})">${labels[it.action]}</button>`;
    }
    if (tl) right += `<button class="btn btn-sm btn-danger-ghost" title="Supprimer cette ligne" onclick="deleteLine('${frameKey}', '${it.key}', ${it.custom?1:0})">✕</button>`;
    // Cadre "noCheck" : pas de case à cocher, juste une puce statique
    if (noCheck) {
      const ncLabel = editLabel ? getLabel(it) : (it.label || "");
      const ncDesc = editDesc ? getDesc(it) : (it.desc || "");
      const ncEditBtn = editLabel
        ? `<button class="btn btn-sm btn-outline" title="Modifier l'intitulé" style="white-space:nowrap;" onclick="editLabelUI('${it.key}')">✎</button>`
        : (editDesc ? `<button class="btn btn-sm btn-outline" title="Modifier la description" style="white-space:nowrap;" onclick="editDescUI('${it.key}')">✎</button>` : "");
      const ncLabelEditor = editLabel ? `<div id="label-edit-${it.key}" style="display:none; margin-top:6px; margin-left:24px;">
          <textarea id="label-ta-${it.key}" style="width:100%; min-height:38px; font-size:0.875rem; font-weight:500; color:var(--teal-dark); border:1px solid var(--teal-mid); border-radius:8px; padding:6px 9px; font-family:'Manrope',sans-serif; resize:vertical;">${esc(ncLabel)}</textarea>
          <div style="text-align:right; margin-top:6px;">
            <button class="btn btn-sm btn-outline" onclick="cancelLabelUI('${it.key}')">Annuler</button>
            <button class="btn btn-sm btn-primary" style="margin-left:6px;" onclick="saveLabelUI('${it.key}')">Enregistrer</button>
          </div>
        </div>` : "";
      const ncEditor = editDesc ? `<div id="desc-edit-${it.key}" style="display:none; margin-top:6px; margin-left:24px;">
          <textarea id="desc-ta-${it.key}" style="width:100%; min-height:48px; font-size:0.8rem; color:var(--teal-dark); border:1px solid var(--teal-mid); border-radius:8px; padding:6px 9px; font-family:'Manrope',sans-serif; resize:vertical;">${esc(ncDesc)}</textarea>
          <div style="text-align:right; margin-top:6px;">
            <button class="btn btn-sm btn-outline" onclick="cancelDescUI('${it.key}')">Annuler</button>
            <button class="btn btn-sm btn-primary" style="margin-left:6px;" onclick="saveDescUI('${it.key}')">Enregistrer</button>
          </div>
        </div>` : "";
      return `<div class="dr-row" draggable="true" data-item="${it.key}" data-frame="${frameKey}">
        <div class="task-row">
        ${handle}
        <div style="width:16px; flex-shrink:0; color:var(--teal-mid); font-weight:800; text-align:center;">›</div>
        <div style="flex:1;">
          <div class="task-label" id="label-view-${it.key}">${esc(ncLabel)}</div>
          ${ncLabelEditor}
          ${ncDesc?`<div id="desc-view-${it.key}" style="font-size:0.77rem; color:#8AABAB; margin-top:2px; white-space:pre-wrap;">${esc(ncDesc)}</div>`:`<div id="desc-view-${it.key}" style="font-size:0.77rem; color:#B8C4C4; margin-top:2px; font-style:italic;">${editDesc?"(pas de description — cliquer ✎ pour ajouter)":""}</div>`}
          ${ncEditor}
        </div>
        ${ncEditBtn}
        ${right}
        </div>
      </div>`;
    }
    const useRoles = !!cols;
    const allRolesDone = useRoles && cols.every(rc => itemRoleDone(n, it.key, rc.key));
    const itLabel = editLabel ? getLabel(it) : (it.label || "");
    const descTxt = editDesc ? getDesc(it) : (it.desc || "");
    // Bouton ✎ : édition d'intitulé (prioritaire) ou de description selon le cadre
    const editBtn = editLabel
      ? `<button class="btn btn-sm btn-outline" title="Modifier l'intitulé" style="white-space:nowrap;" onclick="editLabelUI('${it.key}')">✎</button>`
      : (editDesc ? `<button class="btn btn-sm btn-outline" title="Modifier la description" style="white-space:nowrap;" onclick="editDescUI('${it.key}')">✎</button>` : "");
    const labelEditor = editLabel ? `<div id="label-edit-${it.key}" style="display:none; margin-top:6px; margin-left:32px;">
        <textarea id="label-ta-${it.key}" style="width:100%; min-height:38px; font-size:0.875rem; font-weight:500; color:var(--teal-dark); border:1px solid var(--teal-mid); border-radius:8px; padding:6px 9px; font-family:'Manrope',sans-serif; resize:vertical;">${esc(itLabel)}</textarea>
        <div style="text-align:right; margin-top:6px;">
          <button class="btn btn-sm btn-outline" onclick="cancelLabelUI('${it.key}')">Annuler</button>
          <button class="btn btn-sm btn-primary" style="margin-left:6px;" onclick="saveLabelUI('${it.key}')">Enregistrer</button>
        </div>
      </div>` : "";
    const descEditor = editDesc ? `<div id="desc-edit-${it.key}" style="display:none; margin-top:6px; margin-left:32px;">
        <textarea id="desc-ta-${it.key}" style="width:100%; min-height:48px; font-size:0.8rem; color:var(--teal-dark); border:1px solid var(--teal-mid); border-radius:8px; padding:6px 9px; font-family:'Manrope',sans-serif; resize:vertical;">${esc(descTxt)}</textarea>
        <div style="text-align:right; margin-top:6px;">
          <button class="btn btn-sm btn-outline" onclick="cancelDescUI('${it.key}')">Annuler</button>
          <button class="btn btn-sm btn-primary" style="margin-left:6px;" onclick="saveDescUI('${it.key}')">Enregistrer</button>
        </div>
      </div>` : "";
    // Cadres à colonnes : Formation Pennylane (3 rôles) ou checklist de contrôle (TL/Newcomer).
    // Ailleurs : case à cocher unique (comportement d'origine).
    const roleCols = useRoles ? `<div class="role-cols">
      ${cols.map(rc => {
        const done = itemRoleDone(n, it.key, rc.key);
        const stamp = done ? itemRoleStamp(n, it.key, rc.key) : null;
        const stampHtml = stamp ? `<div class="role-stamp" title="${esc(stamp.by ? stamp.by+" le "+stamp.date : stamp.date)}">${esc(stamp.date)}${stamp.by ? "<br>"+esc(stamp.by) : ""}</div>` : "";
        return `<div class="role-col">
          <div class="role-check ${done?'done':''}" onclick="toggleRoleItem(${n.id}, '${it.key}', '${rc.key}')" title="${esc(rc.label)}">${done?'✓':''}</div>
          ${stampHtml}
        </div>`;
      }).join("")}
    </div>` : "";
    const singleCheck = useRoles ? "" : `<div class="task-check ${st?'done':''}" onclick="toggleItem(${n.id}, '${it.key}')">${st?'✓':''}</div>`;
    const singleStamp = !useRoles ? itemStamp(n, it.key) : null;
    const singleStampHtml = singleStamp ? `<div style="font-size:0.72rem; color:var(--green-dark); font-weight:600; margin-top:2px;">✓ fait le ${esc(singleStamp.date)}${singleStamp.by ? " par " + esc(singleStamp.by) : ""}</div>` : "";
    const labelDone = useRoles ? allRolesDone : st;
    return `<div class="dr-row" draggable="true" data-item="${it.key}" data-frame="${frameKey}">
      <div class="task-row" style="border-bottom:none;">
        ${handle}
        ${singleCheck}
        <div style="flex:1;">
          <div class="task-label ${labelDone?'done':''}" id="label-view-${it.key}">${esc(itLabel)}</div>
          ${labelEditor}
          ${descTxt?`<div id="desc-view-${it.key}" style="font-size:0.77rem; color:#8AABAB; margin-top:2px; white-space:pre-wrap;">${esc(descTxt)}</div>`:`<div id="desc-view-${it.key}" style="font-size:0.77rem; color:#B8C4C4; margin-top:2px; font-style:italic;">${editDesc?"(pas de description — cliquer ✎ pour ajouter)":""}</div>`}
          ${singleStampHtml}
        </div>
        ${editBtn}
        ${right}
        ${roleCols}
      </div>
      ${descEditor}
      ${noteBlock(it)}
    </div>`;
  }).join("");

  const counter = noCheck ? "" : `<span style="font-size:0.78rem; font-weight:600; color:var(--text-muted); margin-left:auto;">${done}/${countItems.length}</span>`;
  const collapsed = isCollapsed(frameKey);
  const chevron = `<span style="display:inline-block; width:16px; transition:transform .15s; transform:rotate(${collapsed?-90:0}deg); color:var(--teal-mid);">▾</span>`;
  const delFrameBtn = isCustomFrame ? `<button class="btn btn-sm btn-danger-ghost" title="Supprimer ce cadre" style="margin-left:6px;" onclick="event.stopPropagation(); deleteCustomFrame('${tabKey}','${frameKey}')">✕</button>` : "";
  const headerRightHtml = noCheck ? counter : `<span style="font-size:0.78rem; font-weight:600; color:var(--text-muted); ${cols?'':'margin-left:auto;'}">${done}/${countItems.length}</span>
    ${cols ? `<div class="role-cols-header">
      ${cols.map(rc=>`<div class="role-col-head">${esc(rc.label)}</div>`).join("")}
    </div>` : ""}`;

  const compactStyle = f.compact ? "font-size:0.8rem;" : "";
  const addLineHtml = tl ? `<div style="margin-top:12px; padding-top:12px; border-top:1px dashed var(--border);">
      <a style="font-size:0.8rem; font-weight:700; color:var(--teal-mid); cursor:pointer;" onclick="addCustomItem('${frameKey}')">+ Ajouter une ligne</a>
    </div>` : "";
  // Commentaire TL de fin de cadre (ex. checklist de contrôle OB blanc) — stocké comme note d'item réservée
  const tlCommentHtml = (f.tlComment && !collapsed) ? (() => {
    const ckey = frameKey + "__tlcomment";
    const val = getItemNote(n, ckey);
    return `<div style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--border);">
      <div style="font-size:0.78rem; font-weight:800; color:var(--teal-mid); text-transform:uppercase; letter-spacing:.4px; margin-bottom:6px;">Commentaire TL</div>
      <textarea id="note-${ckey}" placeholder="Bilan du contrôle : réussi / à retravailler, points forts, axes de progrès…"
        oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';"
        onblur="saveItemNoteFromUI(${n.id}, '${ckey}', this.value)"
        style="width:100%; min-height:60px; font-size:0.85rem; color:var(--teal-dark); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-family:'Manrope',sans-serif; resize:vertical; background:${val?'#FFFFFF':'#FAFDFD'};">${esc(val)}</textarea>
    </div>`;
  })() : "";
  const bodyHtml = collapsed ? "" : `<div class="dr-rows${f.compact?' compact-frame':''}" data-frame="${frameKey}" style="${compactStyle}">${rows}</div>${addLineHtml}${tlCommentHtml}`;
  const frameHandle = tl ? `<span class="frame-drag-handle" title="Glisser pour déplacer le cadre" style="cursor:grab; color:#B8C4C4; user-select:none;">⠿</span>` : "";
  return `<div class="dr-frame card" draggable="true" data-frameroot="${frameKey}" data-tab="${tabKey}">
    <div class="phase-title" style="margin-bottom:${collapsed?'0':'14px'}; padding-bottom:${collapsed?'0':'10px'}; border-bottom:${collapsed?'none':'2px solid var(--teal-light)'}; display:flex; align-items:center; gap:8px;">
      ${frameHandle}
      <span style="cursor:pointer; display:flex; align-items:center; gap:8px; flex:1;" onclick="toggleCollapse('${frameKey}')">${chevron}<span>${esc(f.title)}</span></span>
      ${headerRightHtml}
      ${delFrameBtn}
    </div>
    ${bodyHtml}
  </div>`;
}

/* --- CODE COULEUR DES ONGLETS SELON LES DROITS ---
   Un onglet est visible par plusieurs rôles à la fois : la couleur suit donc le rôle
   le plus BAS qui y a accès, c.-à-d. l'audience la plus large. Vert = tout le monde
   y compris les newcomers ; bleu = à partir des mentors ; ambre = à partir des TL ;
   violet = Admin seul. Dynamique : suit les overrides de l'Admin, pas les défauts. */
const TAB_ACCESS_TIERS = [
  {role:"newcomer", label:"Newcomers",  color:"#12B76A"},
  {role:"mentor",   label:"Mentors",    color:"#2783DE"},
  {role:"tl",       label:"TL",         color:"#E09B2D"},
  {role:"admin",    label:"Admin seul", color:"#9B8CE3"},
];
// Même logique que canAccessTab, mais pour un rôle donné au lieu du rôle courant.
function tabVisibleToRole(tab, role) {
  if (tab.adminOnly) return role === "admin";
  if (tab.droits) return roleHasPerm(role, "manage_rights");
  const permKey = "access_" + tab.key;
  if (PERM_BY_KEY[permKey]) return roleHasPerm(role, permKey);
  return true;
}
function tabAccessTier(tab) {
  return TAB_ACCESS_TIERS.find(t => tabVisibleToRole(tab, t.role)) || null;
}
// Le code couleur n'a de sens que pour qui voit plusieurs paliers : Admin, TL et Mentors.
// Un mentor voit 2 paliers (Formation outils lui est réservé, le reste est ouvert aux newcomers),
// donc les pastilles lui servent. Seul le newcomer ne verrait que du vert : on le lui masque.
function showAccessTiers() { return isTL() || isMentor(); }

/* Bandeau d'introduction d'un onglet (tab.intro), même présentation que ceux des onglets à
   rendu custom comme Acquis. C'est une propriété de l'ONGLET, pas un cadre : pas de poignée
   de déplacement, pas de ✕, pas de « + Ajouter une ligne » sur un bloc purement informatif. */
// Bandeau de la fiche démo : dit que c'est un bac à sable et ce qu'on ne peut PAS y faire
function demoBannerHtml(n) {
  if (!n || !n.demo) return "";
  return `<div class="card" style="padding:14px 18px; margin-bottom:16px; background:#F5F1FE; border-color:#8B5CF6;">
      <p style="font-size:0.82rem; color:#4C1D95; font-weight:700; margin-bottom:6px;">Fiche démo — bac à sable</p>
      <p style="font-size:0.8rem; color:#5B21B6;">Coche, évalue, remplis le Livret : ici c'est sans conséquence, rien de ce que tu fais sur cette fiche ne touche un vrai newcomer. Réorganiser les cadres et renommer les intitulés reste réservé aux TL, parce que ces éléments sont partagés par toutes les fiches.</p>
    </div>`;
}

function tabIntroHtml(tab) {
  const i = tab && tab.intro;
  if (!i) return "";
  const note = i.note ? `<p style="font-size:0.8rem; color:var(--teal-dark); margin-bottom:${(i.points||[]).length?"8px":"0"}; padding:8px 10px; background:#FFFFFF; border-radius:8px; border:1px solid var(--green-dark);">${esc(i.note)}</p>` : "";
  const pts = (i.points || []).length
    ? `<ul style="font-size:0.78rem; color:var(--teal-dark); margin:0; padding-left:20px; line-height:1.6;">${i.points.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`
    : "";
  return `<div class="card" style="padding:16px 20px; margin-bottom:16px; background:var(--teal-light); border-color:var(--green-dark);">
      <p style="font-size:0.82rem; color:var(--teal-dark); font-weight:600; margin-bottom:8px;">${esc(i.text)}</p>
      ${note}${pts}
    </div>`;
}

// Un onglet est-il accessible au rôle courant ?
function canAccessTab(tab) {
  if (tab.adminOnly) return isAdmin();               // onglet réservé Admin (ex. Méthode OB brouillon)
  if (tab.droits) return hasPerm("manage_rights");   // onglet Gestion des droits
  const permKey = "access_" + tab.key;               // access_demarrage, access_acces, …
  if (PERM_BY_KEY[permKey]) return hasPerm(permKey);
  return true;
}
function firstAllowedTabKey() {
  const t = TABS.find(t => canAccessTab(t) && !t.droits);
  return t ? t.key : "livret";
}

function renderDetail(id, tabKey) {
  const n = getNewcomer(id);
  if (!n) { go(""); return; }
  DEMO_CONTEXT = !!n.demo;   // doit être posé AVANT toute lecture de permission
  // Un newcomer ne peut consulter QUE sa propre fiche
  if (!canViewNewcomer(n)) {
    const own = ownNewcomer();
    if (own && own.id !== id) { go("newcomer/" + own.id + "/" + firstAllowedTabKey()); return; }
    document.getElementById("app").innerHTML = `<div class="card" style="text-align:center; padding:60px; color:var(--text-muted);">
      <div style="font-size:1.4rem; margin-bottom:12px;">🔒</div>
      <p style="font-size:1rem; font-weight:600; color:var(--teal-dark);">Accès restreint</p>
      <p style="font-size:0.875rem; margin-top:6px;">Tu ne peux consulter que ta propre fiche d'onboarding.</p>
    </div>`;
    return;
  }
  let tab = TABS.find(t => t.key === tabKey) || TABS[0];
  // Garde d'accès : si le rôle n'a pas le droit, on redirige vers le 1er onglet autorisé
  if (!canAccessTab(tab)) { go("newcomer/" + id + "/" + firstAllowedTabKey()); return; }

  if (tab.planning) { renderPlanning(n); return; }
  if (tab.autoformation) { renderAutoformation(n); return; }
  if (tab.livret) { renderLivret(n); return; }

  const c = countTab(n, tab);
  const pct = c.total ? Math.round(c.done/c.total*100) : 0;

  const framesHtml = `<div class="dr-frames" data-tab="${tab.key}">` +
    tabFrameKeys(tab).map(fk => frameCard(n, fk, tab.key)).join("") + `</div>` +
    (hasPerm("edit_structure") ? `<div style="margin:4px 0 20px;"><a style="font-size:0.85rem; font-weight:700; color:var(--teal-mid); cursor:pointer;" onclick="addCustomFrame('${tab.key}')">+ Ajouter un cadre</a></div>` : "");

  // Cartes additionnelles seulement sur l'onglet Démarrage
  const extra = tab.key === "demarrage" ? `
    <div class="card">
      <div class="phase-title">Notes</div>
      <textarea id="notes-area" rows="4">${esc(n.notes)}</textarea>
      <div style="text-align:right; margin-top:10px;"><button class="btn btn-sm btn-primary" onclick="saveNotes(${id})">Sauvegarder</button></div>
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:8px;">
      ${hasPerm("archive_newcomer") ? (n.archived
        ? `<button class="btn btn-sm btn-outline" onclick="unarchive(${id});go('newcomer/${id}')">Désarchiver</button>`
        : `<button class="btn btn-sm btn-outline" onclick="archive(${id});go('newcomer/${id}')">Archiver</button>`) : ""}
      ${hasPerm("delete_newcomer") ? `<button class="btn btn-sm btn-danger-ghost" onclick="confirmDelete(${id})">Supprimer ce newcomer</button>` : ""}
    </div>` : "";

  const progressHtml = c.total ? `
    <div class="card" style="padding:20px; margin-bottom:20px; background:var(--teal-dark); border-color:var(--teal-mid);">
      <div style="display:flex; align-items:center; gap:16px;">
        <span style="font-size:0.85rem; font-weight:700; white-space:nowrap; color:var(--teal-light);">${esc(tab.label)}</span>
        <div class="progress-bar-wrap" style="background:var(--teal-mid);"><div class="progress-bar-fill" style="width:${pct}%; background:var(--green);"></div></div>
        <span style="font-size:0.875rem; font-weight:800; white-space:nowrap; color:var(--green);">${c.done}/${c.total}</span>
      </div>
    </div>` : "";

  document.getElementById("app").innerHTML = detailHeader(n, tab.key) + demoBannerHtml(n) + tabIntroHtml(tab) + progressHtml + `
    ${framesHtml}
    ${extra}
  `;
  setupDnD(id, tab.key);
}

/* ============================================================
   DRAG & DROP — réordonner cadres (dans l'onglet) et lignes (dans un cadre)
   Ordre stocké globalement (partagé). Réordonnancement de lignes = même cadre.
   ============================================================ */
function setupDnD(id, tabKey) {
  const tab = TABS.find(t => t.key === tabKey);
  if (!tab || !tab.frames) return;

  // --- Cadres --- (drag seulement depuis la poignée du cadre)
  const framesWrap = document.querySelector('.dr-frames[data-tab="'+tabKey+'"]');
  if (framesWrap) {
    let dragFrame = null;
    framesWrap.querySelectorAll('.dr-frame').forEach(el => {
      el.setAttribute('draggable', 'false');
      const h = el.querySelector('.frame-drag-handle');
      if (h) {
        h.addEventListener('mousedown', () => el.setAttribute('draggable', 'true'));
        document.addEventListener('mouseup', () => el.setAttribute('draggable', 'false'));
      }
      el.addEventListener('dragstart', e => { dragFrame = el; el.style.opacity = '0.5'; });
      el.addEventListener('dragend', () => { if (dragFrame) dragFrame.style.opacity=''; dragFrame=null; el.setAttribute('draggable','false'); });
      el.addEventListener('dragover', e => {
        if (!dragFrame || dragFrame===el) return;
        e.preventDefault();
        const rect = el.getBoundingClientRect();
        const after = (e.clientY - rect.top) > rect.height/2;
        if (after) el.after(dragFrame); else el.before(dragFrame);
      });
      el.addEventListener('drop', e => {
        e.preventDefault();
        const order = [...framesWrap.querySelectorAll('.dr-frame')].map(x => x.dataset.frameroot);
        saveFrameOrder(tabKey, order);
      });
    });
  }

  // --- Lignes (dans chaque cadre) --- (drag seulement depuis la poignée de ligne)
  document.querySelectorAll('.dr-rows').forEach(rowsWrap => {
    const frameKey = rowsWrap.dataset.frame;
    let dragRow = null;
    rowsWrap.querySelectorAll('.dr-row').forEach(el => {
      el.setAttribute('draggable', 'false');
      const h = el.querySelector('.drag-handle');
      if (h) {
        h.addEventListener('mousedown', () => el.setAttribute('draggable', 'true'));
        document.addEventListener('mouseup', () => el.setAttribute('draggable', 'false'));
      }
      el.addEventListener('dragstart', e => { e.stopPropagation(); dragRow = el; el.style.opacity='0.5'; });
      el.addEventListener('dragend', e => { e.stopPropagation(); if (dragRow) dragRow.style.opacity=''; dragRow=null; el.setAttribute('draggable','false'); });
      el.addEventListener('dragover', e => {
        if (!dragRow || dragRow===el || el.dataset.frame!==frameKey) return;
        e.preventDefault(); e.stopPropagation();
        const rect = el.getBoundingClientRect();
        const after = (e.clientY - rect.top) > rect.height/2;
        if (after) el.after(dragRow); else el.before(dragRow);
      });
      el.addEventListener('drop', e => {
        e.preventDefault(); e.stopPropagation();
        const order = [...rowsWrap.querySelectorAll('.dr-row')].map(x => x.dataset.item);
        saveItemOrder(frameKey, order);
      });
    });
  });
}

function saveFrameOrder(tabKey, order) {
  saveStructure(s => { s.frameOrder[tabKey] = order; });
}
function saveItemOrder(frameKey, order) {
  saveStructure(s => { s.itemOrder[frameKey] = order; });
}

/* ============================================================
   VUE : PLANNING SEMAINE 1 (agenda 5 jours, échelle horaire commune)
   Modifiable et partagé, un planning par MOIS D'ARRIVÉE (voir la section suivante).
   ============================================================ */
/* --- PLANNING PAR MOIS D'ARRIVÉE (cohorte) ---
   Un planning par mois : la clé est le mois d'arrivée du newcomer (YYYY-MM), donc tous ceux
   arrivés le même mois partagent le même planning, et modifier celui de septembre ne touche
   pas celui d'octobre. Stocké dans structure.plannings → partagé via Firebase.
   PLANNING_S1 ne sert plus que de MODÈLE, proposé quand le mois n'a pas encore son planning. */
const MOIS_FR = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOIS_ABBR = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS_FR = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
// Dates manipulées en UTC uniquement : en heure locale, un décalage suffit à faire basculer
// un lundi sur le dimanche précédent.
function isoToUTC(d) {
  const m = String(d).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])) : null;
}
function addDaysISO(d, n) {
  const dt = isoToUTC(d); if (!dt) return "";
  dt.setUTCDate(dt.getUTCDate() + n);
  return dt.toISOString().slice(0, 10);
}
function mondayOfISO(d) {
  const dt = isoToUTC(d); if (!dt) return "";
  const wd = dt.getUTCDay();                    // 0 = dimanche
  dt.setUTCDate(dt.getUTCDate() - (wd === 0 ? 6 : wd - 1));
  return dt.toISOString().slice(0, 10);
}
function dayLabelISO(d) {                       // "lundi 14"
  const dt = isoToUTC(d); if (!dt) return "";
  return JOURS_FR[dt.getUTCDay()] + " " + dt.getUTCDate();
}
function dateShortISO(d) {                      // "14 sept."
  const dt = isoToUTC(d); if (!dt) return "";
  return dt.getUTCDate() + " " + MOIS_ABBR[dt.getUTCMonth()];
}

// Nombre de semaines d'onboarding prévues par cohorte. Les semaines au-delà de la 1ère peuvent
// rester vides tant que le programme n'est pas arrêté.
const PLANNING_WEEKS = 3;
// Clés des semaines d'un newcomer : le lundi de sa semaine d'arrivée, puis +7 et +14 jours.
function planningWeekKeys(n) {
  const m = mondayOfISO((n && n.arrival_date) || "");
  if (!m) return [];
  return Array.from({length: PLANNING_WEEKS}, (_, i) => addDaysISO(m, i * 7));
}
// "14 → 17 sept." d'après les jours réellement enregistrés (une semaine peut faire 4 jours)
function weekRangeLabel(key) {
  const days = savedPlanning(key);
  const has = days && days.length && days[0].date;
  const first = has ? days[0].date : key;
  const last = has ? days[days.length - 1].date : addDaysISO(key, 4);
  return dateShortISO(first) + " → " + dateShortISO(last);
}
function getPlannings() { const s = getStructure(); if (!s.plannings) s.plannings = {}; return s.plannings; }
// Ne considère que les clés au format date (lundi). Les anciennes clés de MOIS (YYYY-MM), créées
// le 27/08/2026 avant le passage à la semaine, sont ignorées plutôt que supprimées.
/* Firebase ne stocke NI tableau vide NI objet vide : il supprime la clé. Une semaine créée sans
   créneau repart donc avec `events: []` et revient avec `events` ABSENT — le rendu plantait alors
   sur day.events.map, la vue restait bloquée sur la semaine précédente et les onglets de semaine
   semblaient morts. Firebase transforme aussi un tableau à trous en objet indexé (même piège que
   `newcomersById`). On normalise donc à la LECTURE, seul endroit qui couvre tous les appelants. */
function normalizePlanningDays(days) {
  const arr = Array.isArray(days) ? days : Object.values(days || {});
  return arr.filter(Boolean).map(d => ({
    date: d.date || "",
    theme: d.theme || "",
    events: (Array.isArray(d.events) ? d.events : Object.values(d.events || {})).filter(Boolean),
  }));
}
function savedPlanning(key) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(key))) return null;
  const raw = getPlannings()[key];
  if (!raw) return null;
  const days = normalizePlanningDays(raw);
  return days.length ? days : null;   // semaine devenue vide = semaine à (re)créer
}
function planningDays(key) { return savedPlanning(key) || PLANNING_S1; }
function savePlanning(key, days) {
  saveStructure(s => { if (!s.plannings) s.plannings = {}; s.plannings[key] = days; });
}
// Copie profonde, RE-DATÉE sur la semaine cible : un planning copié depuis une autre semaine
// doit porter les dates de sa propre semaine. On ne mute jamais PLANNING_S1 (le modèle).
function clonePlanningDays(days, mondayKey) {
  return days.map((d, i) => ({
    date: mondayKey ? addDaysISO(mondayKey, i) : (d.date || ""),
    theme: d.theme || "",
    events: (d.events || []).map(e => ({...e})),
  }));
}
// Horaire valide au format "9h45" et compris dans l'échelle de la journée
function planValidTime(t) {
  if (!/^\d{1,2}h\d{2}$/.test(String(t))) return false;
  const v = planMin(t);
  return v >= 0 && v <= planMin(PLANNING_END);
}

let PLANNING_EDIT = false;    // mode édition (préférence d'affichage, non persistée)
let PLANNING_WEEK_IDX = 0;    // semaine sélectionnée dans l'onglet

function togglePlanningEdit(id) {
  if (!requirePerm("edit_structure")) return;
  PLANNING_EDIT = !PLANNING_EDIT;
  renderPlanning(getNewcomer(id));
}
function selectPlanningWeek(id, idx) {
  PLANNING_WEEK_IDX = idx;
  renderPlanning(getNewcomer(id));
}
// Crée le planning d'une semaine : depuis le modèle par défaut, depuis une autre semaine, ou vide
function initPlanningWeek(id, key, fromKey) {
  if (!requirePerm("edit_structure")) return;
  if (!key) { toast("Renseigne d'abord la date d'arrivée du newcomer"); return; }
  const source = fromKey === "__vide__"
    ? [0,1,2,3,4].map(() => ({theme:"", events:[]}))
    : (fromKey ? planningDays(fromKey) : PLANNING_S1);
  savePlanning(key, clonePlanningDays(source, key));
  PLANNING_EDIT = true;
  renderPlanning(getNewcomer(id));
  toast("Semaine du " + dateShortISO(key) + " créée");
}
function resetPlanningWeek(id, key) {
  if (!requirePerm("edit_structure")) return;
  if (!confirm("Remettre la semaine du " + dateShortISO(key) + " au modèle par défaut ? Les modifications de cette semaine seront perdues.")) return;
  savePlanning(key, clonePlanningDays(PLANNING_S1, key));
  renderPlanning(getNewcomer(id));
  toast("Semaine réinitialisée");
}
// Jours : une semaine peut faire 4 jours (ex. 14 au 17 septembre) ou déborder sur le samedi
function addPlanningDay(id, key) {
  if (!requirePerm("edit_structure")) return;
  const days = clonePlanningDays(planningDays(key), null);
  const last = days.length ? days[days.length - 1].date : "";
  days.push({date: last ? addDaysISO(last, 1) : key, theme:"", events:[]});
  savePlanning(key, days);
  renderPlanning(getNewcomer(id));
}
function deletePlanningDay(id, key, dayIdx) {
  if (!requirePerm("edit_structure")) return;
  const days = clonePlanningDays(planningDays(key), null);
  const d = days[dayIdx]; if (!d) return;
  if ((d.events || []).length && !confirm("Supprimer " + (dayLabelISO(d.date) || "ce jour") + " et ses " + d.events.length + " créneau(x) ?")) return;
  days.splice(dayIdx, 1);
  savePlanning(key, days);
  renderPlanning(getNewcomer(id));
}
// Écriture d'un champ SANS re-render : préserve le focus pendant la frappe (même parti pris
// que saveItemNoteFromUI). Les horaires invalides sont refusés pour ne pas casser la grille.
function savePlanningField(id, key, dayIdx, evIdx, field, value) {
  const days = clonePlanningDays(planningDays(key), null);
  const day = days[dayIdx]; if (!day) return;
  if (evIdx < 0) {
    if (field === "date" && !/^\d{4}-\d{2}-\d{2}$/.test(value)) {
      toast("Date attendue au format 2026-09-14");
      renderPlanning(getNewcomer(id));
      return;
    }
    day[field] = value;
    if (field === "date") { savePlanning(key, days); renderPlanning(getNewcomer(id)); return; }
  }
  else {
    const ev = day.events[evIdx]; if (!ev) return;
    if ((field === "from" || field === "to") && !planValidTime(value)) {
      toast("Horaire attendu au format 9h45, entre " + PLANNING_START + " et " + PLANNING_END);
      renderPlanning(getNewcomer(id));
      return;
    }
    ev[field] = value;
  }
  savePlanning(key, days);
}
// Le type change la couleur du créneau → on re-render
function savePlanningType(id, key, dayIdx, evIdx, value) {
  const days = clonePlanningDays(planningDays(key), null);
  if (!days[dayIdx] || !days[dayIdx].events[evIdx]) return;
  days[dayIdx].events[evIdx].type = value;
  savePlanning(key, days);
  renderPlanning(getNewcomer(id));
}
function addPlanningEvent(id, key, dayIdx) {
  if (!requirePerm("edit_structure")) return;
  const days = clonePlanningDays(planningDays(key), null);
  if (!days[dayIdx]) return;
  days[dayIdx].events.push({from:"9h00", to:"10h00", type:"present", title:"Nouveau créneau", desc:""});
  savePlanning(key, days);
  renderPlanning(getNewcomer(id));
}
function deletePlanningEvent(id, key, dayIdx, evIdx) {
  if (!requirePerm("edit_structure")) return;
  const days = clonePlanningDays(planningDays(key), null);
  if (!days[dayIdx]) return;
  days[dayIdx].events.splice(evIdx, 1);
  savePlanning(key, days);
  renderPlanning(getNewcomer(id));
}

const PLAN_PX_H = 58; // pixels par heure
function planMin(t) {                                   // "9h45" → minutes depuis PLANNING_START
  const m = String(t).match(/^(\d{1,2})h(\d{2})$/);
  if (!m) return 0;
  const abs = parseInt(m[1],10) * 60 + parseInt(m[2],10);
  const ref = String(PLANNING_START).match(/^(\d{1,2})h(\d{2})$/);
  return abs - (parseInt(ref[1],10) * 60 + parseInt(ref[2],10));
}
function planTop(t) { return planMin(t) / 60 * PLAN_PX_H; }

function renderPlanning(n) {
  const weekKeys = planningWeekKeys(n);
  if (PLANNING_WEEK_IDX >= weekKeys.length) PLANNING_WEEK_IDX = 0;
  const monthKey = weekKeys[PLANNING_WEEK_IDX] || "";   // clé de la semaine affichée
  const saved = savedPlanning(monthKey);
  const days = planningDays(monthKey);
  const canEdit = hasPerm("edit_structure");
  const editing = PLANNING_EDIT && canEdit && !!saved;
  const totalMin = planMin(PLANNING_END);
  const gridH = totalMin / 60 * PLAN_PX_H;
  const h0 = parseInt(String(PLANNING_START).match(/^(\d{1,2})h/)[1], 10);
  const h1 = parseInt(String(PLANNING_END).match(/^(\d{1,2})h/)[1], 10);

  // Colonne des heures (gouttière de gauche)
  let hoursHtml = "";
  for (let h = h0; h <= h1; h++) {
    const top = (h - h0) * PLAN_PX_H;
    hoursHtml += `<div style="position:absolute; top:${top - 7}px; right:8px; font-size:0.68rem; font-weight:700; color:var(--text-muted);">${h}h</div>`;
  }
  // Lignes horizontales de repère, communes à toutes les colonnes
  let gridLinesHtml = "";
  for (let h = h0; h <= h1; h++) {
    const top = (h - h0) * PLAN_PX_H;
    gridLinesHtml += `<div style="position:absolute; left:0; right:0; top:${top}px; border-top:1px solid #EEF4F4;"></div>`;
  }

  const legendHtml = Object.keys(PLANNING_TYPES).map(k => {
    const t = PLANNING_TYPES[k];
    return `<span style="display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:#FFFFFF; border-radius:999px; padding:5px 10px; font-size:0.75rem; font-weight:600; color:var(--text-muted);">
      <span style="width:10px; height:10px; border-radius:50%; background:${t.line};"></span>${t.icon} ${esc(t.label)}
    </span>`;
  }).join("");

  // En-tête d'un jour (réutilisé en gabarit invisible pour aligner la gouttière des heures)
  const dayHead = (name, theme) => `<div style="text-align:center; background:#F1F0EE; border-radius:8px; padding:7px 6px; margin-bottom:10px;">
        <div style="font-size:0.85rem; font-weight:800; color:var(--green-dark); text-transform:uppercase; letter-spacing:.4px;">${esc(name)}</div>
        <div style="font-size:0.68rem; font-style:italic; color:var(--text-muted); margin-top:3px;">${esc(theme)}</div>
      </div>`;
  // Nom du jour : dérivé de sa date quand elle existe, sinon l'ancien libellé du modèle
  const dayName = d => d.date ? dayLabelISO(d.date) : (d.name || "");

  const daysHtml = days.map(day => {
    const events = day.events.map(ev => {
      const t = PLANNING_TYPES[ev.type] || PLANNING_TYPES.pause;
      const top = planTop(ev.from);
      const h = Math.max(planTop(ev.to) - top, 13);
      const dur = planMin(ev.to) - planMin(ev.from);
      const short = dur < 30;                 // créneau très court : titre compacté
      const noDesc = dur < 45;                // trop court pour une 2e ligne → description en infobulle
      const descHtml = (ev.desc && !noDesc)
        ? `<span style="display:block; margin-top:2px; font-size:0.68rem; color:#6E6A65; font-weight:500;">${esc(ev.desc)}</span>` : "";
      return `<div title="${esc(ev.from + " – " + ev.to + " · " + ev.title + (ev.desc ? " — " + ev.desc : ""))}"
        style="position:absolute; left:0; right:0; top:${top}px; height:${h}px; overflow:hidden;
               background:${t.bg}; border-left:4px solid ${t.line}; border-radius:0 6px 6px 0;
               padding:${short ? "1px 6px" : "5px 7px"}; font-size:0.72rem; line-height:1.15; color:#56524E;">
        <strong style="font-weight:800; color:#4A4744;">${t.icon} ${esc(ev.from)}-${esc(ev.to)}</strong>
        <span style="font-weight:700;"> · ${esc(ev.title)}</span>
        ${descHtml}
      </div>`;
    }).join("");
    return `<div>
      ${dayHead(dayName(day), day.theme)}
      <div style="position:relative; height:${gridH}px; border-left:2px dashed #C9C5BE; padding-left:6px;">
        ${gridLinesHtml}
        ${events}
      </div>
    </div>`;
  }).join("");

  // --- Vue d'édition : une carte par jour, un tableau de créneaux ---
  const typeOpts = ev => Object.keys(PLANNING_TYPES).map(k =>
    `<option value="${k}" ${ev.type===k?"selected":""}>${PLANNING_TYPES[k].icon} ${esc(PLANNING_TYPES[k].label)}</option>`).join("");
  const inp = (dayIdx, evIdx, field, value, ph) =>
    `<input value="${esc(value||"")}" placeholder="${esc(ph)}" style="width:100%; font-size:0.8rem; padding:5px 7px; border:1px solid var(--border); border-radius:7px; font-family:'Manrope',sans-serif;"
      onblur="savePlanningField(${n.id}, '${monthKey}', ${dayIdx}, ${evIdx}, '${field}', this.value)">`;
  // Une ligne = un créneau, en grille pour que tout tienne sur une seule ligne
  const evCols = "grid-template-columns:66px 12px 66px 178px minmax(150px,1fr) minmax(150px,1.2fr) 30px";
  const editHtml = days.map((day, di) => `
    <div style="border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px;">
      <div style="display:grid; grid-template-columns:132px minmax(200px,1fr) 30px; gap:10px; align-items:center; margin-bottom:10px;">
        <div>
          ${inp(di, -1, "date", day.date, "2026-09-14")}
          <div style="font-size:0.68rem; font-weight:800; color:var(--green-dark); text-transform:uppercase; margin-top:3px;">${esc(dayName(day))}</div>
        </div>
        ${inp(di, -1, "theme", day.theme, "Thème de la journée")}
        <button class="btn btn-sm btn-danger-ghost" title="Supprimer ce jour" onclick="deletePlanningDay(${n.id}, '${monthKey}', ${di})">✕</button>
      </div>
      <div style="display:grid; ${evCols}; gap:8px; padding-bottom:4px; font-size:0.68rem; font-weight:800; color:var(--teal-mid); text-transform:uppercase; letter-spacing:.4px;">
        <span>Début</span><span></span><span>Fin</span><span>Type</span><span>Intitulé</span><span>Détail</span><span></span>
      </div>
      ${day.events.map((ev, ei) => `
        <div style="display:grid; ${evCols}; gap:8px; align-items:center; padding:6px 0; border-top:1px solid #EEF4F4;">
          ${inp(di, ei, "from", ev.from, "9h00")}
          <span style="color:var(--text-muted); font-size:0.8rem; text-align:center;">→</span>
          ${inp(di, ei, "to", ev.to, "10h00")}
          <select style="width:100%; font-size:0.8rem; padding:5px 7px; border:1px solid var(--border); border-radius:7px; font-family:'Manrope',sans-serif;"
            onchange="savePlanningType(${n.id}, '${monthKey}', ${di}, ${ei}, this.value)">${typeOpts(ev)}</select>
          ${inp(di, ei, "title", ev.title, "Intitulé")}
          ${inp(di, ei, "desc", ev.desc, "Détail, intervenant…")}
          <button class="btn btn-sm btn-danger-ghost" title="Supprimer ce créneau" onclick="deletePlanningEvent(${n.id}, '${monthKey}', ${di}, ${ei})">✕</button>
        </div>`).join("")}
      <div style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);">
        <a style="font-size:0.8rem; font-weight:700; color:var(--teal-mid); cursor:pointer;" onclick="addPlanningEvent(${n.id}, '${monthKey}', ${di})">+ Ajouter un créneau</a>
      </div>
    </div>`).join("")
    + `<div style="margin-bottom:12px;"><a style="font-size:0.82rem; font-weight:700; color:var(--teal-mid); cursor:pointer;" onclick="addPlanningDay(${n.id}, '${monthKey}')">+ Ajouter un jour</a></div>`;

  // --- Sélecteur de semaines : S1 = semaine d'arrivée, puis les suivantes ---
  const weekTabs = weekKeys.map((k, i) => {
    const on = i === PLANNING_WEEK_IDX;
    const vide = !savedPlanning(k);
    return `<button onclick="selectPlanningWeek(${n.id}, ${i})"
      style="padding:7px 12px; border:1px solid ${on?'var(--green-dark)':'var(--border)'}; background:${on?'var(--teal-light)':'#FFFFFF'};
             border-radius:9px; cursor:pointer; font-family:'Manrope',sans-serif; font-size:0.78rem;
             font-weight:${on?800:600}; color:${on?'var(--teal-dark)':'var(--text-muted)'}; white-space:nowrap;">
      Semaine ${i+1} <span style="font-weight:600;">· ${esc(weekRangeLabel(k))}</span>${vide?' <span style="color:#C8A24A;">· à remplir</span>':''}
    </button>`;
  }).join("");

  // --- Bandeau : quelle semaine, et son état ---
  let bandeau;
  if (!monthKey) {
    bandeau = `<p style="font-size:0.82rem; color:var(--teal-dark); font-weight:600;">Ce planning est le <strong>modèle par défaut</strong>. Renseigne la <strong>date d'arrivée</strong> du newcomer : c'est elle qui détermine sa semaine 1 et les suivantes.</p>`;
  } else if (!saved) {
    const autres = Object.keys(getPlannings()).filter(k => k !== monthKey && /^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
    const copyOpts = autres.map(k => `<option value="${k}">semaine du ${esc(dateShortISO(k))}</option>`).join("");
    bandeau = `<p style="font-size:0.82rem; color:var(--teal-dark); font-weight:600; margin-bottom:${canEdit?"10px":"0"};">La <strong>semaine ${PLANNING_WEEK_IDX+1}</strong> (${esc(weekRangeLabel(monthKey))}) n'a pas encore de planning : c'est le <strong>modèle par défaut</strong> qui s'affiche.${canEdit ? " Crée-la pour pouvoir l'adapter." : ""}</p>
      ${canEdit ? `<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <button class="btn btn-sm btn-accent" onclick="initPlanningWeek(${n.id}, '${monthKey}', '')">Créer depuis le modèle</button>
        <button class="btn btn-sm btn-outline" onclick="initPlanningWeek(${n.id}, '${monthKey}', '__vide__')">Créer une semaine vide</button>
        ${autres.length ? `<span style="font-size:0.78rem; color:var(--teal-dark);">ou copier depuis</span>
          <select id="plan-copy-from" style="font-size:0.8rem; padding:5px 7px; border:1px solid var(--border); border-radius:7px;">${copyOpts}</select>
          <button class="btn btn-sm btn-outline" onclick="initPlanningWeek(${n.id}, '${monthKey}', document.getElementById('plan-copy-from').value)">Copier</button>` : ""}
      </div>` : ""}`;
  } else {
    bandeau = `<p style="font-size:0.82rem; color:var(--teal-dark); font-weight:600;"><strong>Semaine ${PLANNING_WEEK_IDX+1}</strong> du ${esc(weekRangeLabel(monthKey))}, ${days.length} jour${days.length>1?'s':''}. Partagée par tous les newcomers arrivés cette semaine-là ; les autres semaines ne sont pas touchées.${editing ? " <strong>Mode édition :</strong> chaque champ s'enregistre en quittant la case." : ""}</p>`;
  }

  document.getElementById("app").innerHTML = detailHeader(n, "planning") + `
    ${weekKeys.length ? `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">${weekTabs}</div>` : ""}
    <div class="card" style="padding:16px 20px; margin-bottom:16px; background:var(--teal-light); border-color:var(--green-dark);">
      ${bandeau}
      <p style="font-size:0.78rem; color:var(--teal-dark); margin-top:8px;">Échelle horaire commune ${esc(PLANNING_START)} → ${esc(PLANNING_END)}.</p>
    </div>
    <div class="card">
      <div class="phase-title" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span style="flex:1;">${monthKey ? `Semaine ${PLANNING_WEEK_IDX+1} · ${esc(weekRangeLabel(monthKey))}` : "Planning semaine 1"}</span>
        ${editing ? `<button class="btn btn-sm btn-danger-ghost" style="white-space:nowrap; text-transform:none; letter-spacing:0;" onclick="resetPlanningWeek(${n.id}, '${monthKey}')">Réinitialiser au modèle</button>` : ""}
        ${saved && canEdit ? `<button class="btn btn-sm ${editing?'btn-primary':'btn-outline'}" style="white-space:nowrap; text-transform:none; letter-spacing:0;" onclick="togglePlanningEdit(${n.id})">${editing ? "Terminer l'édition" : "✎ Modifier"}</button>` : ""}
        <a href="ressources/planning_semaine1.html" target="_blank" class="btn btn-sm btn-outline" style="white-space:nowrap; text-transform:none; letter-spacing:0;">Version imprimable</a>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">${legendHtml}</div>
      ${editing ? `<div style="overflow-x:auto;"><div style="min-width:900px;">${editHtml}</div></div>` : `<div style="overflow-x:auto;">
        <div style="display:grid; grid-template-columns:34px repeat(${days.length}, minmax(170px, 1fr)); gap:10px; min-width:940px;">
          <div><div style="visibility:hidden;">${dayHead("&nbsp;", "&nbsp;")}</div><div style="position:relative; height:${gridH + 10}px;">${hoursHtml}</div></div>
          ${daysHtml}
        </div>
      </div>`}
    </div>`;
}

/* ============================================================
   VUE : VALIDATION DES JOURNÉES D'AUTOFORMATION
   Même grille que le Livret, une seule colonne (auto-évaluation).
   Une journée = un cadre dépliant, replié par défaut : on ouvre celle qu'on valide.
   ============================================================ */
function autoRadioCol(n, itemKey, who) {
  const rows = AUTO_NIVEAUX.map(lvl => {
    const sel = getAutoNiveau(n, itemKey, who) === lvl.val;
    const box = sel
      ? `<span style="display:inline-flex; width:16px; height:16px; border-radius:4px; background:var(--green-dark); color:#fff; align-items:center; justify-content:center; font-size:11px; font-weight:700;">✓</span>`
      : `<span style="display:inline-block; width:16px; height:16px; border-radius:4px; border:2px solid var(--border);"></span>`;
    return `<div style="display:flex; align-items:center; gap:7px; padding:3px 0; cursor:pointer;"
      onclick="toggleAuto(${n.id}, '${itemKey}', '${who}', '${lvl.val}')">
      ${box}<span style="font-size:0.8rem; ${sel?'font-weight:700; color:var(--teal-dark);':'color:var(--text-muted);'}">${lvl.label}</span>
    </div>`;
  }).join("");
  const stamp = getAutoStamp(n, itemKey, who);
  const stampHtml = stamp ? `<div style="font-size:0.68rem; color:var(--green-dark); font-weight:600; margin-top:3px;">✓ ${esc(stamp)}</div>` : "";
  return rows + stampHtml;
}

function renderAutoformation(n) {
  const id = n.id;
  const total = AUTOFORMATION_TOTAL;

  const daysHtml = AUTOFORMATION.map(day => {
    const collapsed = isCollapsed(day.key);
    const chevron = `<span style="display:inline-block; width:16px; transition:transform .15s; transform:rotate(${collapsed?-90:0}deg); color:var(--teal-mid);">▾</span>`;
    const badge = `<span style="display:inline-grid; place-items:center; min-width:30px; height:30px; border-radius:9px; background:var(--teal-light); color:var(--teal-dark); font-size:0.8rem; font-weight:800;">${esc(day.badge)}</span>`;
    const dayCounts = `${autoDayDone(n, day, "auto")}/${day.items.length}`;

    const rows = day.items.map(it => {
      // Champ de suivi, visible seulement quand le point est « À reprendre »
      const aReprendre = getAutoNiveau(n, it.key, "auto") === "non_maitrise";
      const sc = esc(getAutoItemComment(n, it.key));
      const suiviHtml = aReprendre ? `
        <div style="margin-top:8px; padding:8px 10px; border-left:3px solid #E09B2D; background:#FFFCF5; border-radius:0 8px 8px 0;">
          <label style="font-size:0.7rem; color:#8A6D2F; font-weight:800; text-transform:uppercase; letter-spacing:.4px;">Suivi du point</label>
          <textarea id="afic-${it.key}" placeholder="Ex. revu le 24/09 avec le mentor, c'est ok"
            oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';"
            onblur="saveAutoItemCommentUI(${n.id}, '${it.key}', this.value)"
            style="width:100%; min-height:32px; margin-top:4px; font-size:0.78rem; color:var(--teal-dark); border:1px solid var(--border); border-radius:7px; padding:6px 8px; font-family:'Manrope',sans-serif; resize:none; background:#FFFFFF;">${sc}</textarea>
        </div>` : "";
      return `
      <div style="padding:11px 0; border-bottom:1px solid #EEF4F4;">
        <div style="display:grid; grid-template-columns:1fr 170px; gap:14px; align-items:center;">
          <div class="task-label">${esc(it.label)}</div>
          ${AUTO_PASSES.map(p => `<div>${autoRadioCol(n, it.key, p.key)}</div>`).join("")}
        </div>
        ${suiviHtml}
      </div>`;
    }).join("");

    const cVal = esc(getAutoComment(n, day.key));
    const cLabel = day.commentLabel || "Questions ou points à clarifier";
    const commentHtml = `<div style="margin-top:16px;">
      <label style="font-size:0.72rem;">${esc(cLabel)}</label>
      <textarea id="afc-${day.key}" placeholder="Ce qui reste flou, à reprendre avec le mentor ou le formateur…"
        onblur="saveAutoCommentUI(${id}, '${day.key}', this.value)"
        style="width:100%; min-height:60px; font-size:0.8rem; color:var(--teal-dark); border:1px solid var(--border); border-radius:8px; padding:8px; font-family:'Manrope',sans-serif; resize:vertical; background:${cVal?'#FFFFFF':'#FAFDFD'};">${cVal}</textarea>
    </div>`;

    const body = collapsed ? "" : `
      <p style="font-size:0.8rem; color:var(--text-muted); font-weight:600; margin-bottom:10px;">${esc(day.intro)}</p>
      <div style="display:grid; grid-template-columns:1fr 170px; gap:14px; padding-bottom:8px; border-bottom:2px solid var(--teal-light); font-size:0.72rem; font-weight:800; color:var(--teal-mid); text-transform:uppercase; letter-spacing:.4px;">
        <span>Point de la journée</span>${AUTO_PASSES.map(p => `<span>${esc(p.label)}</span>`).join("")}
      </div>
      ${rows}
      ${commentHtml}`;

    return `<div class="card">
      <div class="phase-title" style="margin-bottom:${collapsed?'0':'14px'}; padding-bottom:${collapsed?'0':'10px'}; border-bottom:${collapsed?'none':'2px solid var(--teal-light)'}; display:flex; align-items:center; gap:10px;">
        <span style="cursor:pointer; display:flex; align-items:center; gap:10px; flex:1;" onclick="toggleCollapse('${day.key}')">
          ${chevron}${badge}<span>${esc(day.title)}</span>
        </span>
        <span style="font-size:0.78rem; font-weight:600; color:var(--text-muted); text-transform:none; letter-spacing:0;">${esc(dayCounts)}</span>
      </div>
      ${body}
    </div>`;
  }).join("");

  const usageHtml = AUTOFORMATION_USAGE.map(u => `<li>${esc(u)}</li>`).join("");
  // Une barre par passe : on voit d'un coup où en est la semaine 1 et le jalon des 3 semaines
  const barsHtml = AUTO_PASSES.map(p => {
    const d = autoPassDone(n, p.key);
    const pct = total ? Math.round(d / total * 100) : 0;
    return `<div style="display:flex; align-items:center; gap:16px;">
      <span style="font-size:0.85rem; font-weight:700; white-space:nowrap; color:var(--teal-light); min-width:104px;">${esc(p.label)}</span>
      <div class="progress-bar-wrap" style="background:var(--teal-mid);"><div class="progress-bar-fill" style="width:${pct}%; background:var(--green);"></div></div>
      <span style="font-size:0.875rem; font-weight:800; white-space:nowrap; color:var(--green);">${d}/${total}</span>
    </div>`;
  }).join(`<div style="height:10px;"></div>`);

  document.getElementById("app").innerHTML = detailHeader(n, "autoformation") + `
    <div class="card" style="padding:16px 20px; margin-bottom:16px; background:var(--teal-light); border-color:var(--green-dark);">
      <p style="font-size:0.82rem; color:var(--teal-dark); font-weight:600; margin-bottom:8px;">Acquis de fin de journée, sur les 40 points du programme de la semaine 1. Niveaux : Acquis / En cours / À reprendre. Ce ne sont pas ceux du Livret, parce qu'on ne mesure pas la même chose : ici la compréhension d'une journée, là-bas la maîtrise professionnelle au jalon.</p>
      <p style="font-size:0.8rem; color:var(--teal-dark); margin-bottom:8px; padding:8px 10px; background:#FFFFFF; border-radius:8px; border:1px solid var(--green-dark);">
        <strong>Cette saisie ne compte pas dans l'évaluation du newcomer.</strong> Elle sert à repérer ce qui reste flou et à préparer les débriefs. Elle est visible du mentor et du TL, qui s'en servent pour cadrer l'accompagnement. L'évaluation, elle, se fait dans le Livret d'intégration.
      </p>
      <ul style="font-size:0.78rem; color:var(--teal-dark); margin:0; padding-left:20px; line-height:1.6;">${usageHtml}</ul>
    </div>
    <div class="card" style="padding:20px; margin-bottom:20px; background:var(--teal-dark); border-color:var(--teal-mid);">
      ${barsHtml}
    </div>
    ${daysHtml}`;
}

function toggleAuto(id, itemKey, who, val) {
  if (!requirePerm("check_items")) return;
  setAutoNiveau(id, itemKey, who, val);
  renderAutoformation(getNewcomer(id));
}
function saveAutoCommentUI(id, dayKey, text) { saveAutoComment(id, dayKey, text); }
function saveAutoItemCommentUI(id, itemKey, text) { saveAutoItemComment(id, itemKey, text); }

/* ============================================================
   VUE : LIVRET D'INTÉGRATION (grille auto + mentor, 3 niveaux)
   ============================================================ */
function livretRadioCol(n, itemKey, who) {
  const locked = isLivretLocked(n);
  const rows = LIVRET_NIVEAUX.map(lvl => {
    const sel = getLivretNiveau(n, itemKey, who) === lvl.val;
    const box = sel
      ? `<span style="display:inline-flex; width:16px; height:16px; border-radius:4px; background:var(--green-dark); color:#fff; align-items:center; justify-content:center; font-size:11px; font-weight:700;">✓</span>`
      : `<span style="display:inline-block; width:16px; height:16px; border-radius:4px; border:2px solid var(--border);"></span>`;
    const click = locked ? "" : `onclick="toggleLivret(${n.id}, '${itemKey}', '${who}', '${lvl.val}')"`;
    return `<div style="display:flex; align-items:center; gap:7px; padding:3px 0; cursor:${locked?'default':'pointer'};" ${click}>
      ${box}<span style="font-size:0.8rem; ${sel?'font-weight:700; color:var(--teal-dark);':'color:var(--text-muted);'}">${lvl.label}</span>
    </div>`;
  }).join("");
  const stamp = getLivretStamp(n, itemKey, who);
  const stampHtml = stamp ? `<div style="font-size:0.68rem; color:var(--green-dark); font-weight:600; margin-top:3px;">✓ ${esc(stamp)}</div>` : "";
  return rows + stampHtml;
}

function renderLivret(n) {
  const id = n.id;
  const sectionsHtml = LIVRET.map(sec => {
    const locked = isLivretLocked(n);
    const rows = sec.items.map(it => {
      const ic = esc(getLivretItemComment(n, it.key));
      const descTxt = getDesc(it);
      const editBtn = locked ? "" : `<button class="btn btn-sm btn-outline" title="Modifier la description" style="white-space:nowrap;" onclick="editDescUI('${it.key}')">✎</button>`;
      const descEditor = `<div id="desc-edit-${it.key}" style="display:none; margin-top:6px;">
          <textarea id="desc-ta-${it.key}" style="width:100%; min-height:48px; font-size:0.8rem; color:var(--teal-dark); border:1px solid var(--teal-mid); border-radius:8px; padding:6px 9px; font-family:'Manrope',sans-serif; resize:vertical;">${esc(descTxt)}</textarea>

      </div>`;
    }).join("");

    const cNc = esc(getLivretComment(n, sec.key, 'newcomer'));

        </div>
        <div>
          <label style="font-size:0.72rem;">Commentaires du TL${suffix}</label>
          <textarea id="lvc-${sec.key}-tl" onblur="saveLivretCommentUI(${id}, '${sec.key}', 'tl', this.value)"

      </div>`
    : `<div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <span style="font-size:0.82rem; color:var(--text-muted);">Une fois l'évaluation finalisée, verrouille-la pour figer les coches, commentaires et signatures.</span>
        <button class="btn btn-accent" onclick="lockLivret(${id})">Valider et verrouiller</button>
      </div>`;
