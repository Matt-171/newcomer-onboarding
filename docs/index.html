}
function savePlanningSlot(id, key, dayIdx, evIdx) {
  if (!requirePerm("edit_structure")) return;
  const from = document.getElementById("ps-from").value.trim();
  const to = document.getElementById("ps-to").value.trim();
  if (!planValidTime(from) || !planValidTime(to)) {
    toast("Horaire attendu au format 9h45, entre " + PLANNING_START + " et " + PLANNING_END); return;
  }
  if (planMin(to) <= planMin(from)) { toast("La fin doit être après le début"); return; }
  const links = [...document.querySelectorAll(".ps-link-row")].map(r => ({
    label: r.querySelector(".ps-link-label").value.trim(),
    url: r.querySelector(".ps-link-url").value.trim(),
  })).filter(l => l.url);
  const days = clonePlanningDays(planningDays(key), null);
  const ev = days[dayIdx] && days[dayIdx].events[evIdx];
  if (!ev) return;
  ev.from = from; ev.to = to;
  ev.type = document.getElementById("ps-type").value;
  ev.title = document.getElementById("ps-title").value.trim();
  ev.desc = document.getElementById("ps-desc").value.trim();
  ev.links = links;
  savePlanning(key, days);
  document.getElementById("modal").classList.remove("open");
  renderPlanning(getNewcomer(id));
  toast("Créneau mis à jour");
}
function deletePlanningSlot(id, key, dayIdx, evIdx) {
  if (!requirePerm("edit_structure")) return;
  const ev = planningSlotOf(key, dayIdx, evIdx);
  if (!confirm("Supprimer le créneau « " + ((ev && ev.title) || "") + " » ?")) return;
  document.getElementById("modal").classList.remove("open");
  deletePlanningEvent(id, key, dayIdx, evIdx);
}

const PLAN_PX_H = 58; // pixels par heure
function planMin(t) {                                   // "9h45" → minutes depuis PLANNING_START
  const m = String(t).match(/^(\d{1,2})h(\d{2})$/);
  if (!m) return 0;
  const abs = parseInt(m[1],10) * 60 + parseInt(m[2],10);
  const ref = String(PLANNING_START).match(/^(\d{1,2})h(\d{2})$/);
  return abs - (parseInt(ref[1],10) * 60 + parseInt(ref[2],10));
}
function planTop(t) { return planMin(t) / 60 * PLAN_PX_H; }
// Inverse de planMin : minutes depuis PLANNING_START → "9h45". Sert au glisser-déposer, qui
// travaille en pixels puis en minutes et doit réécrire des horaires au format de l'app.
function minToPlan(min) {
  const ref = String(PLANNING_START).match(/^(\d{1,2})h(\d{2})$/);
  const abs = parseInt(ref[1],10) * 60 + parseInt(ref[2],10) + Math.round(min);
  return Math.floor(abs / 60) + "h" + String(abs % 60).padStart(2, "0");
}
/* GLISSER-DÉPOSER DES CRÉNEAUX (01/09/2026)
   Deux gestes : déplacer (vertical = horaire, horizontal = changement de jour) et redimensionner
   en tirant le bord bas. Arrondi au quart d'heure.
   Choix techniques, et pourquoi :
   - **pointer events** et pas le drag&drop natif HTML5 utilisé pour les cadres et les lignes :
     le natif se comporte mal sur des éléments en position absolue et n'a pas de support tactile.
     Ne pas mélanger les deux mécanismes.
   - écriture Firebase au RELÂCHEMENT seulement. Écrire pendant le mouvement ferait un aller-retour
     réseau par pixel et l'écho du listener re-rendrait la grille sous le doigt.
   - un seuil de 4 px sépare le clic du glissement, sinon toute tentative de déplacement ouvrirait
     la fiche du créneau.
   - **les chevauchements sont AUTORISÉS** (décision de Matt le 01/09) : aucun contrôle de collision.
   - actif seulement sur une semaine ENREGISTRÉE et avec `edit_structure` : sur l'aperçu d'un modèle
     il n'y aurait rien où écrire. */
const PLAN_SNAP = 15;         // minutes
const PLAN_DRAG_SEUIL = 4;    // pixels avant de considérer que c'est un glissement
let PLAN_DRAG = null;
function movePlanningSlot(id, key, dayIdx, evIdx, from, to, newDayIdx) {
  if (!requirePerm("edit_structure")) return;
  const days = clonePlanningDays(planningDays(key, getNewcomer(id)), null);
  const day = days[dayIdx]; if (!day) return;
  const ev = day.events[evIdx]; if (!ev) return;
  ev.from = from; ev.to = to;
  if (newDayIdx != null && newDayIdx !== dayIdx && days[newDayIdx]) {
    day.events.splice(evIdx, 1);
    days[newDayIdx].events.push(ev);
  }
  savePlanning(key, days);
  renderPlanning(getNewcomer(id));
}
// Un seul écouteur sur la grille (délégation) : réattaché à chaque rendu, donc rien à détacher.
function bindPlanningDrag(id, key, totalMin) {
  const grid = document.getElementById("plan-grid");
  if (!grid) return;
  const colonnes = () => [...grid.querySelectorAll("[data-daycol]")];
  grid.addEventListener("pointerdown", e => {
    const el = e.target.closest("[data-slot]");
    if (!el || e.button !== 0) return;
    const resize = !!e.target.closest("[data-resize]");
    const from = parseInt(el.dataset.from, 10), to = parseInt(el.dataset.to, 10);
    PLAN_DRAG = {
      el, resize, from, to, duree: to - from,
      dayIdx: parseInt(el.dataset.day, 10), evIdx: parseInt(el.dataset.ev, 10),
      x0: e.clientX, y0: e.clientY, bouge: false, nvFrom: from, nvTo: to, nvDay: null,
    };
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  grid.addEventListener("pointermove", e => {
    const d = PLAN_DRAG; if (!d) return;
    const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
    if (!d.bouge && Math.abs(dx) < PLAN_DRAG_SEUIL && Math.abs(dy) < PLAN_DRAG_SEUIL) return;
    d.bouge = true;
    const dMin = Math.round(dy / PLAN_PX_H * 60 / PLAN_SNAP) * PLAN_SNAP;
    if (d.resize) {
      d.nvFrom = d.from;
      d.nvTo = Math.min(totalMin, Math.max(d.from + PLAN_SNAP, d.to + dMin));
    } else {
      d.nvFrom = Math.max(0, Math.min(totalMin - d.duree, d.from + dMin));
      d.nvTo = d.nvFrom + d.duree;
      // Changement de jour : colonne dont la bande horizontale contient le pointeur.
      const cible = colonnes().find(c => {
        const r = c.getBoundingClientRect();
        return e.clientX >= r.left && e.clientX <= r.right;
      });
      if (cible) {
        const idx = parseInt(cible.dataset.daycol, 10);
        if (idx !== d.dayIdx) { d.nvDay = idx; if (d.el.parentElement !== cible) cible.appendChild(d.el); }
        else { d.nvDay = null; }
      }
    }
    d.el.style.top = (d.nvFrom / 60 * PLAN_PX_H) + "px";
    d.el.style.height = Math.max((d.nvTo - d.nvFrom) / 60 * PLAN_PX_H, 13) + "px";
    d.el.style.opacity = "0.85";
    const h = d.el.querySelector("[data-heure]");
    if (h) h.textContent = minToPlan(d.nvFrom) + "-" + minToPlan(d.nvTo);
  });
  const fin = e => {
    const d = PLAN_DRAG; if (!d) return;
    PLAN_DRAG = null;
    d.el.style.opacity = "";
    if (!d.bouge) { openPlanningSlot(id, key, d.dayIdx, d.evIdx); return; }
    if (d.nvFrom === d.from && d.nvTo === d.to && d.nvDay == null) { renderPlanning(getNewcomer(id)); return; }
    movePlanningSlot(id, key, d.dayIdx, d.evIdx, minToPlan(d.nvFrom), minToPlan(d.nvTo), d.nvDay);
  };
  grid.addEventListener("pointerup", fin);
  grid.addEventListener("pointercancel", fin);
}

function renderPlanning(n) {
  const weekKeys = planningWeekKeys(n);
  if (PLANNING_WEEK_IDX >= weekKeys.length) PLANNING_WEEK_IDX = 0;
  const monthKey = weekKeys[PLANNING_WEEK_IDX] || "";   // clé de la semaine affichée
  const saved = savedPlanning(monthKey);
  const modele = planningModeleFor(n, monthKey);
  const days = planningDays(monthKey, n);
  const canEdit = hasPerm("edit_structure");
  // Glisser-déposer : il faut une semaine ENREGISTRÉE (sinon rien où écrire) et le droit.
  const dragOn = canEdit && !!saved;
  const editing = PLANNING_EDIT && canEdit && !!saved;
  const totalMin = planMin(PLANNING_END);
  const gridH = totalMin / 60 * PLAN_PX_H;
  const h0 = parseInt(String(PLANNING_START).match(/^(\d{1,2})h/)[1], 10);
  const h1 = parseInt(String(PLANNING_END).match(/^(\d{1,2})h/)[1], 10);

  // Colonne des heures (gouttière de gauche)
  let hoursHtml = "";
  for (let h = h0; h <= h1; h++) {
    const top = (h - h0) * PLAN_PX_H;
    hoursHtml += `<div style="position:absolute; top:${top - 7}px; right:8px; font-size:0.68rem; font-weight:700; color:var(--text-muted);">${h}h</div>`;
  }
  // Lignes horizontales de repère, communes à toutes les colonnes
  let gridLinesHtml = "";
  for (let h = h0; h <= h1; h++) {
    const top = (h - h0) * PLAN_PX_H;
    gridLinesHtml += `<div style="position:absolute; left:0; right:0; top:${top}px; border-top:1px solid #EEF4F4;"></div>`;
  }

  const ancrage = obStartDiffers(n)
    ? `<p style="font-size:0.78rem; color:var(--teal-dark); margin-top:8px;">Arrivée chez Pennylane le <strong>${esc(n.arrival_date)}</strong>, mais la formation SME démarre la <strong>semaine du ${esc(dateShortISO(mondayOfISO(n.onboarding_start)))}</strong> : c'est elle qui fait la semaine 1 ci-dessus.</p>`
    : "";
  const legendHtml = Object.keys(PLANNING_TYPES).map(k => {
    const t = PLANNING_TYPES[k];
    return `<span style="display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border); background:#FFFFFF; border-radius:999px; padding:5px 10px; font-size:0.75rem; font-weight:600; color:var(--text-muted);">
      <span style="width:10px; height:10px; border-radius:50%; background:${t.line};"></span>${t.icon} ${esc(t.label)}
    </span>`;
  }).join("");

  // En-tête d'un jour (réutilisé en gabarit invisible pour aligner la gouttière des heures)
  // Lien vers le bloc de ressources du jour, DANS l'en-tête de colonne : il est ainsi visible
  // depuis la page planning sans avoir à ouvrir un créneau. `di` non fourni = colonne des heures.
  const resTab = TABS.find(t => t.key === "ressources");
  const canSeeRes = !!resTab && canAccessTab(resTab);
  const resChip = di => {
    const fk = (di === undefined || !canSeeRes) ? null : resFrameForDay(di);
    if (!fk) return "";
    return `<div style="margin-top:5px;"><a onclick="goToResFrame(${n.id}, '${fk}')"
      title="Ouvrir « ${esc(FRAMES[fk].title)} » dans l'onglet Ressources"
      style="display:inline-block; cursor:pointer; font-size:0.66rem; font-weight:800; color:var(--teal-dark);
             background:#FFFFFF; border:1px solid var(--green-dark); border-radius:999px; padding:2px 8px;">
      📚 Ressources jour ${di + 1}</a></div>`;
  };
  const dayHead = (name, theme, di) => `<div style="text-align:center; background:#F1F0EE; border-radius:8px; padding:7px 6px; margin-bottom:10px;">
        <div style="font-size:0.85rem; font-weight:800; color:var(--green-dark); text-transform:uppercase; letter-spacing:.4px;">${esc(name)}</div>
        <div style="font-size:0.68rem; font-style:italic; color:var(--text-muted); margin-top:3px;">${esc(theme)}</div>
        ${resChip(di)}
      </div>`;
  // Nom du jour : dérivé de sa date quand elle existe, sinon l'ancien libellé du modèle
  const dayName = d => d.date ? dayLabelISO(d.date) : (d.name || "");

  const daysHtml = days.map((day, di) => {
    const events = day.events.map((ev, ei) => {
      const t = PLANNING_TYPES[ev.type] || PLANNING_TYPES.pause;
      const top = planTop(ev.from);
      const h = Math.max(planTop(ev.to) - top, 13);
      const dur = planMin(ev.to) - planMin(ev.from);
      const short = dur < 30;                 // créneau très court : titre compacté
      const noDesc = dur < 45;                // trop court pour une 2e ligne → description en infobulle
      const descHtml = (ev.desc && !noDesc)
        ? `<span style="display:block; margin-top:2px; font-size:0.68rem; color:#6E6A65; font-weight:500;">${esc(ev.desc)}</span>` : "";
      const nbLiens = (ev.links || []).length;
      const marqueur = nbLiens ? `<span style="display:inline-block; margin-left:4px; padding:0 5px; border-radius:999px; background:#FFFFFFAA; font-weight:800; font-size:0.66rem;">🔗 ${nbLiens}</span>` : "";
      // La poignée de redimensionnement n'apparaît que si le créneau est assez haut pour
      // qu'elle ne mange pas tout : sur 13 px de haut, 6 px de poignée rendraient le
      // déplacement impossible.
      const poignee = (dragOn && h >= 24)
        ? `<div data-resize="1" style="position:absolute; left:0; right:0; bottom:0; height:6px; cursor:ns-resize;"></div>` : "";
      const infobulle = ev.from + " – " + ev.to + " · " + ev.title
        + (ev.desc ? " — " + ev.desc : "") + (nbLiens ? " · " + nbLiens + " lien(s)" : "")
        + (dragOn ? " — cliquer pour ouvrir, glisser pour déplacer, tirer le bas pour la durée" : " — cliquer pour ouvrir");
      return `<div ${dragOn ? `data-slot="1" data-day="${di}" data-ev="${ei}" data-from="${planMin(ev.from)}" data-to="${planMin(ev.to)}"`
                           : `onclick="openPlanningSlot(${n.id}, '${monthKey}', ${di}, ${ei})"`}
        title="${esc(infobulle)}"
        style="position:absolute; left:0; right:0; top:${top}px; height:${h}px; overflow:hidden; cursor:${dragOn ? "grab" : "pointer"};
               background:${t.bg}; border-left:4px solid ${t.line}; border-radius:0 6px 6px 0; touch-action:none;
               padding:${short ? "1px 6px" : "5px 7px"}; font-size:0.72rem; line-height:1.15; color:#56524E;">
        <strong style="font-weight:800; color:#4A4744;">${t.icon} <span data-heure="1">${esc(ev.from)}-${esc(ev.to)}</span></strong>
        <span style="font-weight:700;"> · ${esc(ev.title)}</span>${marqueur}
        ${descHtml}
        ${poignee}
      </div>`;
    }).join("");
    return `<div>
      ${dayHead(dayName(day), day.theme, di)}
      <div data-daycol="${di}" style="position:relative; height:${gridH}px; border-left:2px dashed #C9C5BE; padding-left:6px;">
        ${gridLinesHtml}
        ${events}
      </div>
    </div>`;
  }).join("");

  // [atelier RS] Addendum Reseller — DÉCLENCHÉ PAR LE PROFIL : n'apparaît que pour un reseller.
  const rsAddendumHtml = (profilOf(n) === "RS") ? `
    <div class="card" style="border-left:4px solid #7C3AED;">
      <div class="phase-title" style="display:flex; align-items:center; gap:10px;">
        ${profilTag(PLANNING_S1_RS_ADDENDUM)}<span>Spécificités Reseller</span>
      </div>
      <p style="font-size:0.78rem; color:var(--text-muted); font-weight:600; margin-bottom:12px;">${esc(PLANNING_S1_RS_ADDENDUM.note)}</p>
      ${PLANNING_S1_RS_ADDENDUM.items.map(it => `
        <div style="padding:10px 0; border-bottom:1px solid #EEF4F4;">
          <div class="task-label">${itemDiffMarker(it)}${esc(it.label)}</div>
          ${it.desc ? `<div style="font-size:0.77rem; color:#8AABAB; margin-top:2px;">${esc(it.desc)}</div>` : ""}
        </div>`).join("")}
    </div>` : "";

  // --- Vue d'édition : une carte par jour, un tableau de créneaux ---
  const typeOpts = ev => Object.keys(PLANNING_TYPES).map(k =>
    `<option value="${k}" ${ev.type===k?"selected":""}>${PLANNING_TYPES[k].icon} ${esc(PLANNING_TYPES[k].label)}</option>`).join("");
  const inp = (dayIdx, evIdx, field, value, ph) =>
    `<input value="${esc(value||"")}" placeholder="${esc(ph)}" style="width:100%; font-size:0.8rem; padding:5px 7px; border:1px solid var(--border); border-radius:7px; font-family:'Manrope',sans-serif;"
      onblur="savePlanningField(${n.id}, '${monthKey}', ${dayIdx}, ${evIdx}, '${field}', this.value)">`;
  // Une ligne = un créneau, en grille pour que tout tienne sur une seule ligne
  const evCols = "grid-template-columns:66px 12px 66px 178px minmax(150px,1fr) minmax(150px,1.2fr) 30px";
  // Une seule date à changer pour toute la semaine : le reste suit. Le bouton d'alignement
  // n'apparaît que si les jours ont dérivé du lundi de la semaine.
  const firstDate = (days[0] && days[0].date) || monthKey;
  const alignedOnMonday = days.every((d, i) => d.date === addDaysISO(monthKey, i));
  const dateBar = `
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 12px; margin-bottom:14px;
                background:var(--teal-light); border:1px solid var(--green-dark); border-radius:10px;">
      <span style="font-size:0.78rem; font-weight:800; color:var(--teal-dark);">La semaine démarre le</span>
      <input type="date" value="${esc(firstDate)}"
        style="flex:none; width:150px; font-size:0.8rem; padding:5px 7px; border:1px solid var(--border); border-radius:7px; font-family:'Manrope',sans-serif;"
        onchange="shiftPlanningWeek(${n.id}, '${monthKey}', this.value)">
      <span style="flex:1; min-width:200px; font-size:0.76rem; color:var(--teal-dark);">les autres jours se décalent d'autant, pas besoin de les reprendre un par un</span>
      ${alignedOnMonday ? "" : `<button class="btn btn-sm btn-outline" style="white-space:nowrap; text-transform:none; letter-spacing:0;"
        onclick="alignPlanningWeek(${n.id}, '${monthKey}')">Aligner sur lundi ${esc(dateShortISO(monthKey))}</button>`}
    </div>`;
  const editHtml = dateBar + days.map((day, di) => `
    <div style="border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:12px;">
      <div style="display:grid; grid-template-columns:132px minmax(200px,1fr) 30px; gap:10px; align-items:center; margin-bottom:10px;">
        <div>
          ${inp(di, -1, "date", day.date, "2026-09-14")}
          <div style="font-size:0.68rem; font-weight:800; color:var(--green-dark); text-transform:uppercase; margin-top:3px;">${esc(dayName(day))}</div>
        </div>
        ${inp(di, -1, "theme", day.theme, "Thème de la journée")}
        <button class="btn btn-sm btn-danger-ghost" title="Supprimer ce jour" onclick="deletePlanningDay(${n.id}, '${monthKey}', ${di})">✕</button>
      </div>
      <div style="display:grid; ${evCols}; gap:8px; padding-bottom:4px; font-size:0.68rem; font-weight:800; color:var(--teal-mid); text-transform:uppercase; letter-spacing:.4px;">
        <span>Début</span><span></span><span>Fin</span><span>Type</span><span>Intitulé</span><span>Détail</span><span></span>
      </div>
      ${day.events.map((ev, ei) => `
        <div style="display:grid; ${evCols}; gap:8px; align-items:center; padding:6px 0; border-top:1px solid #EEF4F4;">
          ${inp(di, ei, "from", ev.from, "9h00")}
          <span style="color:var(--text-muted); font-size:0.8rem; text-align:center;">→</span>
          ${inp(di, ei, "to", ev.to, "10h00")}
          <select style="width:100%; font-size:0.8rem; padding:5px 7px; border:1px solid var(--border); border-radius:7px; font-family:'Manrope',sans-serif;"
            onchange="savePlanningType(${n.id}, '${monthKey}', ${di}, ${ei}, this.value)">${typeOpts(ev)}</select>
          ${inp(di, ei, "title", ev.title, "Intitulé")}
          ${inp(di, ei, "desc", ev.desc, "Détail, intervenant…")}
          <button class="btn btn-sm btn-danger-ghost" title="Supprimer ce créneau" onclick="deletePlanningEvent(${n.id}, '${monthKey}', ${di}, ${ei})">✕</button>
        </div>`).join("")}
      <div style="margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);">
        <a style="font-size:0.8rem; font-weight:700; color:var(--teal-mid); cursor:pointer;" onclick="addPlanningEvent(${n.id}, '${monthKey}', ${di})">+ Ajouter un créneau</a>
      </div>
    </div>`).join("")
    + `<div style="margin-bottom:12px;"><a style="font-size:0.82rem; font-weight:700; color:var(--teal-mid); cursor:pointer;" onclick="addPlanningDay(${n.id}, '${monthKey}')">+ Ajouter un jour</a></div>`;

  // --- Sélecteur de semaines : S1 = semaine d'arrivée, puis les suivantes ---
  const weekTabs = weekKeys.map((k, i) => {
    const on = i === PLANNING_WEEK_IDX;
    const vide = !savedPlanning(k);
    return `<button onclick="selectPlanningWeek(${n.id}, ${i})"
      style="padding:7px 12px; border:1px solid ${on?'var(--green-dark)':'var(--border)'}; background:${on?'var(--teal-light)':'#FFFFFF'};
             border-radius:9px; cursor:pointer; font-family:'Manrope',sans-serif; font-size:0.78rem;
             font-weight:${on?800:600}; color:${on?'var(--teal-dark)':'var(--text-muted)'}; white-space:nowrap;">
      Semaine ${i+1} <span style="font-weight:600;">· ${esc(weekRangeLabel(k))}</span>${vide?' <span style="color:#C8A24A;">· à remplir</span>':''}
    </button>`;
  }).join("");

  // --- Bandeau : quelle semaine, et son état ---
  let bandeau;
  if (!monthKey) {
    bandeau = `<p style="font-size:0.82rem; color:var(--teal-dark); font-weight:600;">Ce planning est le <strong>modèle par défaut</strong>. Renseigne la <strong>date d'arrivée</strong> du newcomer, ou son <strong>début d'onboarding SME</strong> si la formation ne démarre pas la semaine de son arrivée : c'est ce qui détermine sa semaine 1 et les suivantes.</p>`;
  } else if (!saved) {
    const autres = Object.keys(getPlannings()).filter(k => k !== monthKey && /^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
    const copyOpts = autres.map(k => `<option value="${k}">semaine du ${esc(dateShortISO(k))}</option>`).join("");
    // Deux situations distinctes : la semaine a un programme de référence (S1, S2) et on montre
    // ce modèle en attendant, ou elle n'en a pas (semaine 3) et on le DIT au lieu de resservir
    // le programme de la semaine 1, ce qui laissait croire à un vrai planning.
    bandeau = modele
      ? `<p style="font-size:0.82rem; color:var(--teal-dark); font-weight:600; margin-bottom:${canEdit?"10px":"0"};">La <strong>semaine ${PLANNING_WEEK_IDX+1}</strong> (${esc(weekRangeLabel(monthKey))}) n'a pas encore de planning : c'est le <strong>programme de référence de la semaine ${PLANNING_WEEK_IDX+1}</strong> qui s'affiche.${canEdit ? " Crée-la pour pouvoir l'adapter." : ""}</p>`
      : `<p style="font-size:0.82rem; color:var(--teal-dark); font-weight:600; margin-bottom:${canEdit?"10px":"0"};">La <strong>semaine ${PLANNING_WEEK_IDX+1}</strong> (${esc(weekRangeLabel(monthKey))}) n'a <strong>pas encore de programme de référence</strong>, il n'y a donc rien à afficher.${canEdit ? " Crée-la vide, ou copie-la depuis une autre semaine." : ""}</p>`;
    bandeau += `
      ${canEdit ? `<div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        ${modele ? `<button class="btn btn-sm btn-accent" onclick="initPlanningWeek(${n.id}, '${monthKey}', '')">Créer depuis le modèle</button>` : ""}
        <button class="btn btn-sm btn-outline" onclick="initPlanningWeek(${n.id}, '${monthKey}', '__vide__')">Créer une semaine vide</button>
        ${autres.length ? `<span style="font-size:0.78rem; color:var(--teal-dark);">ou copier depuis</span>
          <select id="plan-copy-from" style="font-size:0.8rem; padding:5px 7px; border:1px solid var(--border); border-radius:7px;">${copyOpts}</select>
          <button class="btn btn-sm btn-outline" onclick="initPlanningWeek(${n.id}, '${monthKey}', document.getElementById('plan-copy-from').value)">Copier</button>` : ""}
      </div>` : ""}`;
  } else {
    bandeau = `<p style="font-size:0.82rem; color:var(--teal-dark); font-weight:600;"><strong>Semaine ${PLANNING_WEEK_IDX+1}</strong> du ${esc(weekRangeLabel(monthKey))}, ${days.length} jour${days.length>1?'s':''}. Partagée par tous les newcomers arrivés cette semaine-là ; les autres semaines ne sont pas touchées.${editing ? " <strong>Mode édition :</strong> chaque champ s'enregistre en quittant la case." : (dragOn ? " <strong>Glisse un créneau</strong> pour le déplacer, y compris d'un jour à l'autre, et <strong>tire son bord bas</strong> pour changer sa durée — par pas de 15 minutes. Un simple clic ouvre sa fiche." : "")}</p>`;
  }

  document.getElementById("app").innerHTML = detailHeader(n, "planning") + `
    ${weekKeys.length ? `<div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">${weekTabs}</div>` : ""}
    <div class="card" style="padding:16px 20px; margin-bottom:16px; background:var(--teal-light); border-color:var(--green-dark);">
      ${bandeau}
      ${ancrage}
      <p style="font-size:0.78rem; color:var(--teal-dark); margin-top:8px;">Échelle horaire commune ${esc(PLANNING_START)} → ${esc(PLANNING_END)}.</p>
    </div>
    <div class="card">
      <div class="phase-title" style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <span style="flex:1;">${monthKey ? `Semaine ${PLANNING_WEEK_IDX+1} · ${esc(weekRangeLabel(monthKey))}` : "Planning semaine 1"}</span>
        ${editing && modele ? `<button class="btn btn-sm btn-danger-ghost" style="white-space:nowrap; text-transform:none; letter-spacing:0;" onclick="resetPlanningWeek(${n.id}, '${monthKey}')">Réinitialiser au modèle</button>` : ""}
        ${saved && canEdit ? `<button class="btn btn-sm ${editing?'btn-primary':'btn-outline'}" style="white-space:nowrap; text-transform:none; letter-spacing:0;" onclick="togglePlanningEdit(${n.id})">${editing ? "Terminer l'édition" : "✎ Modifier"}</button>` : ""}
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;">${legendHtml}</div>
      ${!days.length ? `<p style="font-size:0.85rem; color:var(--text-muted); font-style:italic; padding:20px 0;">Aucun créneau à afficher pour cette semaine.</p>`
        : editing ? `<div style="overflow-x:auto;"><div style="min-width:900px;">${editHtml}</div></div>` : `<div style="overflow-x:auto;">
        <div id="plan-grid" style="display:grid; grid-template-columns:34px repeat(${days.length}, minmax(170px, 1fr)); gap:10px; min-width:940px;">
          <div><div style="visibility:hidden;">${dayHead("&nbsp;", "&nbsp;")}</div><div style="position:relative; height:${gridH + 10}px;">${hoursHtml}</div></div>
          ${daysHtml}
        </div>
      </div>`}
    </div>
    ${rsAddendumHtml}`;
  // Après écriture du DOM seulement : la délégation cible #plan-grid, qui n'existe pas avant.
  if (dragOn && !editing && days.length) bindPlanningDrag(n.id, monthKey, totalMin);
}

/* ============================================================
   VUE : VALIDATION DES JOURNÉES D'AUTOFORMATION   [merge Matt 25/08/2026]
   Même grille que le Livret, une seule colonne (auto-évaluation).
   Une journée = un cadre dépliant, replié par défaut : on ouvre celle qu'on valide.
   ============================================================ */
function autoRadioCol(n, itemKey, who) {
  const rows = AUTO_NIVEAUX.map(lvl => {
    const sel = getAutoNiveau(n, itemKey, who) === lvl.val;
    const box = sel
      ? `<span style="display:inline-flex; width:16px; height:16px; border-radius:4px; background:var(--green-dark); color:#fff; align-items:center; justify-content:center; font-size:11px; font-weight:700;">✓</span>`
      : `<span style="display:inline-block; width:16px; height:16px; border-radius:4px; border:2px solid var(--border);"></span>`;
    return `<div style="display:flex; align-items:center; gap:7px; padding:3px 0; cursor:pointer;"
      onclick="toggleAuto(${n.id}, '${itemKey}', '${who}', '${lvl.val}')">
      ${box}<span style="font-size:0.8rem; ${sel?'font-weight:700; color:var(--teal-dark);':'color:var(--text-muted);'}">${lvl.label}</span>
    </div>`;
  }).join("");
  const stamp = getAutoStamp(n, itemKey, who);
  const stampHtml = stamp ? `<div style="font-size:0.68rem; color:var(--green-dark); font-weight:600; margin-top:3px;">✓ ${esc(stamp)}</div>` : "";
  return rows + stampHtml;
}

function renderAutoformation(n) {
  const id = n.id;
  const total = autoTotalFor(n);                 // [atelier RS] total selon le profil ; barres par passe plus bas (Matt)

  // [atelier RS] journées visibles selon le PROFIL (déclencheur) : SME + section RS pour un reseller
  const daysHtml = autoDaysFor(n).map(day => {
    const collapsed = isCollapsed(day.key);
    const chevron = `<span style="display:inline-block; width:16px; transition:transform .15s; transform:rotate(${collapsed?-90:0}deg); color:var(--teal-mid);">▾</span>`;
    // Section RS : badge violet (marqueur profil), cohérent avec le code couleur RS de l'app.
    const badge = day.rs
      ? `<span style="display:inline-grid; place-items:center; min-width:30px; height:30px; border-radius:9px; background:#EDE7FB; color:#7C3AED; font-size:0.8rem; font-weight:800;">${esc(day.badge)}</span>`
      : `<span style="display:inline-grid; place-items:center; min-width:30px; height:30px; border-radius:9px; background:var(--teal-light); color:var(--teal-dark); font-size:0.8rem; font-weight:800;">${esc(day.badge)}</span>`;
    const dayCounts = `${autoDayDone(n, day, "auto")}/${day.items.length}`;

    const rows = day.items.map(rawIt => {
      const it = applyAutoItemProfil(rawIt, profilOf(n));   // [atelier RS] modif RS éventuelle (marqueur ~)
      // Champ de suivi, visible seulement quand le point est « À reprendre »
      const aReprendre = getAutoNiveau(n, it.key, "auto") === "non_maitrise";
      const sc = esc(getAutoItemComment(n, it.key));
      const suiviHtml = aReprendre ? `
        <div style="margin-top:8px; padding:8px 10px; border-left:3px solid #E09B2D; background:#FFFCF5; border-radius:0 8px 8px 0;">
          <label style="font-size:0.7rem; color:#8A6D2F; font-weight:800; text-transform:uppercase; letter-spacing:.4px;">Suivi du point</label>
          <textarea id="afic-${it.key}" placeholder="Ex. revu le 24/09 avec le mentor, c'est ok"
            oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px';"
            onblur="saveAutoItemCommentUI(${n.id}, '${it.key}', this.value)"
            style="width:100%; min-height:32px; margin-top:4px; font-size:0.78rem; color:var(--teal-dark); border:1px solid var(--border); border-radius:7px; padding:6px 8px; font-family:'Manrope',sans-serif; resize:none; background:#FFFFFF;">${sc}</textarea>
        </div>` : "";
      return `
      <div style="padding:11px 0; border-bottom:1px solid #EEF4F4;">
        <div style="display:grid; grid-template-columns:1fr 170px; gap:14px; align-items:center;">
          <div class="task-label">${itemDiffMarker(it)}${esc(it.label)}</div>
          ${AUTO_PASSES.map(p => `<div>${autoRadioCol(n, it.key, p.key)}</div>`).join("")}
        </div>
        ${suiviHtml}
      </div>`;
    }).join("");

    const cVal = esc(getAutoComment(n, day.key));
    const cLabel = day.commentLabel || "Questions ou points à clarifier";
    const commentHtml = `<div style="margin-top:16px;">
      <label style="font-size:0.72rem;">${esc(cLabel)}</label>
      <textarea id="afc-${day.key}" placeholder="Ce qui reste flou, à reprendre avec le mentor ou le formateur…"
        onblur="saveAutoCommentUI(${id}, '${day.key}', this.value)"
        style="width:100%; min-height:60px; font-size:0.8rem; color:var(--teal-dark); border:1px solid var(--border); border-radius:8px; padding:8px; font-family:'Manrope',sans-serif; resize:vertical; background:${cVal?'#FFFFFF':'#FAFDFD'};">${cVal}</textarea>
    </div>`;

    const body = collapsed ? "" : `
      <p style="font-size:0.8rem; color:var(--text-muted); font-weight:600; margin-bottom:10px;">${esc(day.intro)}</p>
      <div style="display:grid; grid-template-columns:1fr 170px; gap:14px; padding-bottom:8px; border-bottom:2px solid var(--teal-light); font-size:0.72rem; font-weight:800; color:var(--teal-mid); text-transform:uppercase; letter-spacing:.4px;">
        <span>Point de la journée</span>${AUTO_PASSES.map(p => `<span>${esc(p.label)}</span>`).join("")}
      </div>
      ${rows}
      ${commentHtml}`;

    return `<div class="card"${day.rs ? ' style="border-left:4px solid #7C3AED;"' : ''}>
      <div class="phase-title" style="margin-bottom:${collapsed?'0':'14px'}; padding-bottom:${collapsed?'0':'10px'}; border-bottom:${collapsed?'none':'2px solid var(--teal-light)'}; display:flex; align-items:center; gap:10px;">
        <span style="cursor:pointer; display:flex; align-items:center; gap:10px; flex:1;" onclick="toggleCollapse('${day.key}')">
          ${chevron}${badge}${day.rs ? profilTag(day) : ''}<span>${esc(day.title)}</span>
        </span>
        <span style="font-size:0.78rem; font-weight:600; color:var(--text-muted); text-transform:none; letter-spacing:0;">${esc(dayCounts)}</span>
      </div>
      ${body}
    </div>`;
  }).join("");

  const usageHtml = AUTOFORMATION_USAGE.map(u => `<li>${esc(u)}</li>`).join("");
  // [atelier RS] légende des marqueurs d'écart vs tronc commun — visible pour un profil RS
  const rsMarkLegend = (profilOf(n) === "RS") ? `<div style="margin-top:10px; padding-top:10px; border-top:1px solid var(--teal-mid); font-size:0.74rem; color:var(--teal-dark);">
      <strong>Repères Reseller vs tronc commun :</strong>
      <span title="Ajout Reseller" style="display:inline-block; margin:0 4px 0 8px; padding:0 5px; border-radius:4px; font-weight:800; font-size:0.68rem; color:#fff; background:${DIFF_TYPES.add.color};">${DIFF_TYPES.add.sign}</span> point ajouté pour le RS
      <span title="Modification Reseller" style="display:inline-block; margin:0 4px 0 12px; padding:0 5px; border-radius:4px; font-weight:800; font-size:0.68rem; color:#fff; background:${DIFF_TYPES.mod.color};">${DIFF_TYPES.mod.sign}</span> point adapté pour le RS
    </div>` : "";
  // Une barre par passe : on voit d'un coup où en est la semaine 1 et le jalon des 3 semaines
  const barsHtml = AUTO_PASSES.map(p => {
    const d = autoPassDone(n, p.key);
    const pct = total ? Math.round(d / total * 100) : 0;
    return `<div style="display:flex; align-items:center; gap:16px;">
      <span style="font-size:0.85rem; font-weight:700; white-space:nowrap; color:var(--teal-light); min-width:104px;">${esc(p.label)}</span>
      <div class="progress-bar-wrap" style="background:var(--teal-mid);"><div class="progress-bar-fill" style="width:${pct}%; background:var(--green);"></div></div>
      <span style="font-size:0.875rem; font-weight:800; white-space:nowrap; color:var(--green);">${d}/${total}</span>
    </div>`;
  }).join(`<div style="height:10px;"></div>`);

  document.getElementById("app").innerHTML = detailHeader(n, "autoformation") + `
    <div class="card" style="padding:16px 20px; margin-bottom:16px; background:var(--teal-light); border-color:var(--green-dark);">
      <p style="font-size:0.82rem; color:var(--teal-dark); font-weight:600; margin-bottom:8px;">Acquis de fin de journée, sur les 40 points du programme de la semaine 1. Niveaux : Acquis / En cours / À reprendre. Ce ne sont pas ceux du Livret, parce qu'on ne mesure pas la même chose : ici la compréhension d'une journée, là-bas la maîtrise professionnelle au jalon.</p>
      <p style="font-size:0.8rem; color:var(--teal-dark); margin-bottom:8px; padding:8px 10px; background:#FFFFFF; border-radius:8px; border:1px solid var(--green-dark);">
        <strong>Cette saisie ne compte pas dans l'évaluation du newcomer.</strong> Elle sert à repérer ce qui reste flou et à préparer les débriefs. Elle est visible du mentor et du TL, qui s'en servent pour cadrer l'accompagnement. L'évaluation, elle, se fait dans le Livret d'intégration.
      </p>
      <ul style="font-size:0.78rem; color:var(--teal-dark); margin:0; padding-left:20px; line-height:1.6;">${usageHtml}</ul>
      ${rsMarkLegend}
    </div>
    <div class="card" style="padding:20px; margin-bottom:20px; background:var(--teal-dark); border-color:var(--teal-mid);">
      ${barsHtml}
    </div>
    ${daysHtml}`;
}

function toggleAuto(id, itemKey, who, val) {
  if (!requirePerm("check_items")) return;
  setAutoNiveau(id, itemKey, who, val);
  renderAutoformation(getNewcomer(id));
}
function saveAutoCommentUI(id, dayKey, text) { saveAutoComment(id, dayKey, text); }
function saveAutoItemCommentUI(id, itemKey, text) { saveAutoItemComment(id, itemKey, text); }

/* ============================================================
   VUE : SUPPORTS D'EXERCICE (OB blancs) — [atelier RS]
   Vue custom (comme l'auto-évaluation). Le TL/mentor choisit une typologie
   d'OB puis dispose de : points importants, cadre société fictive (bloc
   complet), banque de questions, et une checklist d'évaluation 3-états
   (mêmes niveaux que l'auto-évaluation / le Livret : Maîtrisé / Points à
   revoir / Non maîtrisé) fusionnée avec la grille de posture, structurée
   comme la page Notion. PAS de compteur.
   État via setAutoNiveau/getAutoNiveau, clés « obc_ » (pas de collision af_).

/* ============================================================
   [atelier RS] TIMELINE RS — vue transverse data-driven
   Collecte toutes les tâches porteuses d'un `jalon` (à travers TOUS les cadres
   visibles pour le profil du newcomer), puis les regroupe par jalon et les rend
   filtrables par objectif et par qui. La coche réutilise itemDone/toggleItem —
   même source de vérité que les onglets classiques (pas de statut dupliqué).
   ============================================================ */
// État de filtre de la timeline (mémoire de session, non persisté).
let TIMELINE_FILTER = {objectif:null, qui:null};

// Rassemble {item, frameKey, tabKey} pour toutes les tâches à métadonnées visibles pour ce profil.
function collectTimelineItems(n) {
  const profil = profilOf(n);
  const voie = sousProfilOf(n);                          // [atelier RS] fourche voie (classique/technique)
  const out = [];
  const seen = new Set();
  visibleTabs(profil, voie).filter(t => t.frames && canAccessTab(t)).forEach(tab => {
    tabFrameKeys(tab, profil, voie).forEach(fk => {
      if (!frameVisibleForRole(frameDef(fk))) return;   // cadre restreint par rôle (ex. Avant-J1 masqué au newcomer)
      frameItems(fk, profil, voie).forEach(it => {
        if (it.heading) return;
        const m = itemMeta(it);
        if (!m.jalon) return;                 // seules les tâches datées entrent dans la timeline
        if (seen.has(it.key)) return;         // un item n'apparaît qu'une fois (dédup)
        seen.add(it.key);
        out.push({it, meta:m, frameKey:fk, tabKey:tab.key});
      });
    });
  });
  return out;
}

function setTimelineFilter(dim, val) {
  TIMELINE_FILTER[dim] = (TIMELINE_FILTER[dim] === val) ? null : val;
  renderDetail(curNewcomerId(), "rs_timeline");
}

// [atelier RS] Libellés des boutons d'action (modale Slack/Jira/OPS…). Module-level pour être
// partagé entre le rendu des cadres et itemLinksHtml (donc la timeline).
const ACTION_LABELS = {slack:"Préparer Slack", slack_rs:"Préparer Slack (OB + RS)", jira_connect:"Ticket Jira", jira_chift:"Ticket Jira", jira_metabase:"Ticket Jira", jira_tresorit:"Ticket Jira", swan:"Préparer DM Vincent", braga:"Préparer msg Braga", ops_chili:"Ticket OPS", ops_modjo:"Ticket OPS", ops_intercom:"Ticket OPS", rs_chloe:"Préparer DM Chloé", rs_zendesk:"Préparer msg #reseller-services", rs_annonce:"Prévenir l'équipe RS", rs_slack_mentor:"Préparer Slack mentor"};

// [atelier RS] Rend les boutons de liens d'un item (MO externes, "(à venir)", liens internes
// vers un bloc OB, + bouton d'action Slack/Jira/OPS). Factorisé pour être réutilisé par le
// rendu des cadres ET par la timeline (vue unique du parcours).
// `internalColor` = couleur des liens internes {tab,frame} : par défaut le violet RS, mais on
// passe le bleu OB quand le lien pointe vers un bloc du tronc commun OB (code couleur du profil cible).
function itemLinksHtml(it, nid) {
  let out = "";
  if (it.link) out += `<a href="${it.link}" target="_blank" class="task-link btn btn-sm btn-outline" style="white-space:nowrap;">${esc(it.linkLabel || "Ouvrir")}</a>`;
  if (Array.isArray(it.links)) it.links.forEach(l => {
    if (l.item) {                                              // lien interne vers une autre LIGNE du parcours (timeline)
      const col = l.color || "var(--rs-violet,#7C3AED)";
      const bg  = l.bg || "#F5F0FF";
      out += `<button class="btn btn-sm" style="white-space:nowrap; background:${bg}; color:${col}; border:1px dashed ${col};" title="Aller à l'étape liée du parcours" onclick="goItem(${nid}, '${l.item}')">↪ ${esc(l.label || "Voir l'étape liée")}</button>`;
    }
    else if (l.tab && l.frame) {
      const col = l.color || "var(--rs-violet,#7C3AED)";        // couleur = profil cible (OB bleu / RS violet)
      const bg  = l.bg || "#F5F0FF";
      const itemArg = l.frameItem ? ", '" + l.frameItem + "'" : "";  // item précis visé dans le cadre (facultatif)
      out += `<button class="btn btn-sm" style="white-space:nowrap; background:${bg}; color:${col}; border:1px dashed ${col};" title="Aller au bloc lié" onclick="goFrame(${nid}, '${l.tab}', '${l.frame}'${itemArg})">↪ ${esc(l.label || "Voir le bloc lié")}</button>`;
    }
    else if (l.support) {                                      // lien vers l'onglet « Mises en situation » + typologie
      const col = l.color || "var(--rs-violet,#7C3AED)";
      const bg  = l.bg || "#F5F0FF";
      out += `<button class="btn btn-sm" style="white-space:nowrap; background:${bg}; color:${col}; border:1px dashed ${col};" title="Ouvrir la mise en situation" onclick="goSupport(${nid}, '${l.support}')">↪ ${esc(l.label || "Mise en situation")}</button>`;
    }
    else if (l.url) out += `<a href="${l.url}" target="_blank" class="task-link btn btn-sm btn-outline" style="white-space:nowrap;">${esc(l.label || "Ouvrir")}</a>`;
    else out += `<span class="btn btn-sm" style="white-space:nowrap; background:#EEF2F2; color:var(--text-muted); cursor:default;" title="Lien à venir">${esc(l.label || "")} (à venir)</span>`;
  });
  if (it.action) out += `<button class="btn btn-sm btn-slack" style="white-space:nowrap;" onclick="openAction('${it.action}', ${nid})">${ACTION_LABELS[it.action] || "Action"}</button>`;
  return out;
}

function renderTimeline(n) {
  const all = collectTimelineItems(n);
  const f = TIMELINE_FILTER;
  const rows = all.filter(r =>
    (!f.objectif || r.meta.objectif === f.objectif) &&
    (!f.qui || (Array.isArray(r.meta.qui) ? r.meta.qui.includes(f.qui) : r.meta.qui === f.qui)));

  // Barre de filtres : objectifs et qui réellement présents dans les données.
  const usedObj = [...new Set(all.map(r => r.meta.objectif).filter(Boolean))];
  const usedQui = [...new Set(all.flatMap(r => Array.isArray(r.meta.qui) ? r.meta.qui : [r.meta.qui]).filter(Boolean))];
  const chip = (active, label, onclick) =>
    `<button onclick="${onclick}" style="padding:4px 11px; border-radius:16px; border:1px solid ${active?'var(--teal-mid)':'var(--border)'}; background:${active?'var(--teal-mid)':'#fff'}; color:${active?'#fff':'var(--text-muted)'}; font-family:'Manrope',sans-serif; font-size:0.75rem; font-weight:700; cursor:pointer; white-space:nowrap;">${label}</button>`;
  const objChips = usedObj.map(k => chip(f.objectif===k, "🎯 "+esc(OBJECTIFS[k]?OBJECTIFS[k].short:k), `setTimelineFilter('objectif','${k}')`)).join("");
  const quiChips = usedQui.map(k => chip(f.qui===k, (QUI[k]?QUI[k].icon+" ":"")+esc(QUI[k]?QUI[k].label:k), `setTimelineFilter('qui','${k}')`)).join("");
  const resetBtn = (f.objectif||f.qui) ? chip(false, "✕ Réinitialiser", "TIMELINE_FILTER={objectif:null,qui:null};renderDetail(curNewcomerId(),'rs_timeline')") : "";
  const filterBar = `
    <div class="card" style="padding:14px 16px; margin-bottom:20px;">
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:${quiChips?'10px':'0'};">
        <span style="font-size:0.72rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-right:4px;">Objectif</span>
        ${objChips || '<span style="font-size:0.78rem; color:var(--text-muted);">—</span>'}
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <span style="font-size:0.72rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-right:4px;">Qui</span>
        ${quiChips || '<span style="font-size:0.78rem; color:var(--text-muted);">—</span>'}
        ${resetBtn?`<span style="margin-left:auto;">${resetBtn}</span>`:""}
      </div>
    </div>`;

  // Regroupement par jalon, dans l'ordre de la taxonomie.
  const jalonKeys = Object.keys(JALONS).sort((a,b)=>JALONS[a].order-JALONS[b].order);
  const canCheck = hasPerm("check_items");
  const sections = jalonKeys.map(jk => {
    const inJalon = rows.filter(r => r.meta.jalon === jk);
    if (!inJalon.length) return "";
    const j = JALONS[jk];
    const doneN = inJalon.filter(r => itemDone(n, r.it.key)).length;
    const lines = inJalon.map(r => {
      const it = r.it, st = itemDone(n, it.key);
      const check = canCheck
        ? `<div class="task-check ${st?'done':''}" onclick="toggleItem(${n.id}, '${it.key}')">${st?'✓':''}</div>`
        : `<div class="task-check ${st?'done':''}" style="cursor:default;">${st?'✓':''}</div>`;
      const srcTab = TABS.find(t => t.key === r.tabKey);
      const srcLabel = srcTab ? esc(srcTab.label) : "";
      const descHtml = it.desc ? `<div style="font-size:0.75rem; color:var(--text-muted); margin-top:3px;">${esc(it.desc)}</div>` : "";
      const linksHtml = itemLinksHtml(it, n.id);
      const linksRow = linksHtml ? `<div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">${linksHtml}</div>` : "";
      return `<div class="task-row" id="tlrow-${it.key}" style="border-bottom:1px solid var(--border); align-items:flex-start;">
        ${check}
        <div style="flex:1;">
          <div class="task-label ${st?'done':''}">${itemDiffMarker(it)}${esc(it.label)}${itemMetaPills(it)}</div>
          ${descHtml}
          ${linksRow}
        </div>
      </div>`;
    }).join("");
    return `<div class="card" style="padding:0; margin-bottom:16px; overflow:hidden; border-left:4px solid ${j.color};">
      <div style="display:flex; align-items:center; gap:12px; padding:12px 16px; background:${j.color}12;">
        <span style="font-weight:800; color:${j.color}; font-size:0.95rem;">${esc(j.label)}</span>
        <span style="font-size:0.78rem; font-weight:700; color:var(--text-muted); margin-left:auto;">${doneN}/${inJalon.length}</span>
      </div>
      <div style="padding:4px 16px 8px;">${lines}</div>
    </div>`;
  }).join("");

  const empty = rows.length ? "" : `<div class="card" style="text-align:center; padding:48px; color:var(--text-muted);">
    <p style="font-size:0.9rem;">Aucune tâche ne correspond aux filtres.</p></div>`;
  const intro = `<div style="color:var(--text-muted); font-size:0.82rem; margin-bottom:16px;">
    Vue transverse : toutes les tâches datées du parcours, regroupées par jalon. ${all.length} tâche(s) au total.</div>`;

  document.getElementById("app").innerHTML = detailHeader(n, "rs_timeline") + intro + filterBar + (sections || empty);
}

function curTabKey() {
  const parts = location.hash.replace(/^#\//, "").split("/");
  return parts[2] && TABS.some(t => t.key === parts[2]) ? parts[2] : TABS[0].key;
}
// [atelier RS] id du newcomer courant depuis le hash (#/newcomer/<id>/<tab>)
function curNewcomerId() {
  const m = location.hash.match(/newcomer\/(\d+)/);
  return m ? parseInt(m[1]) : null;
}
// Repli/dépli des cadres — préférence d'affichage locale (par navigateur)
let COLLAPSED = {};
try { COLLAPSED = JSON.parse(localStorage.getItem("frame_collapsed")) || {}; } catch(e) { COLLAPSED = {}; }
function isCollapsed(frameKey) {
  if (frameKey in COLLAPSED) return !!COLLAPSED[frameKey]; // choix explicite de l'utilisateur
  if (AUTO_DAY_KEYS.has(frameKey)) return true;            // [merge Matt] journée d'autoformation : repliée par défaut
  const def = frameDef(frameKey);                          // sinon repli par défaut du cadre
  return !!(def && def.collapsedDefault);
}
function toggleCollapse(frameKey) {
  // [merge Matt] On part de l'état EFFECTIF (défaut inclus) : sinon le 1er clic sur un cadre replié
  // par défaut réécrivait la même valeur et ne faisait rien.
  COLLAPSED[frameKey] = !isCollapsed(frameKey);
  localStorage.setItem("frame_collapsed", JSON.stringify(COLLAPSED));
  renderDetail(parseInt(location.hash.match(/newcomer\/(\d+)/)[1]), curTabKey());
}

// Lignes custom — GLOBALES (référentiel partagé) via DATA.structure.customItems
function addCustomItem(frameKey) {
  if (!requirePerm("edit_structure")) return;
  const label = prompt("Intitulé de la nouvelle ligne :");
  if (!label || !label.trim()) return;
  const key = "c_" + frameKey + "_" + Date.now();
  saveStructure(s => {
    if (!s.customItems[frameKey]) s.customItems[frameKey] = [];
    s.customItems[frameKey].push({key, label: label.trim()});
  });
  renderDetail(parseInt(location.hash.match(/newcomer\/(\d+)/)[1]), curTabKey());
}
// Supprime une ligne : custom = suppression réelle ; base = masquage (réversible en interne)
function deleteLine(frameKey, key, isCustom) {
  if (!requirePerm("edit_structure")) return;
  if (!confirm("Supprimer cette ligne ?")) return;
  saveStructure(s => {
    if (isCustom) {
      if (s.customItems[frameKey]) s.customItems[frameKey] = s.customItems[frameKey].filter(it => it.key !== key);
    } else {
      if (!s.hiddenItems.includes(key)) s.hiddenItems.push(key);
    }
    if (s.itemOrder[frameKey]) s.itemOrder[frameKey] = s.itemOrder[frameKey].filter(k => k !== key);
  });
  renderDetail(parseInt(location.hash.match(/newcomer\/(\d+)/)[1]), curTabKey());
}
// Cadres custom — GLOBAUX
function addCustomFrame(tabKey) {
  if (!requirePerm("edit_structure")) return;
  const title = prompt("Nom du nouveau cadre :");
  if (!title || !title.trim()) return;
  const frameKey = "cf_" + tabKey + "_" + Date.now();
  saveStructure(s => {
    s.customFrames[frameKey] = {title: title.trim()};
    const tab = TABS.find(t => t.key === tabKey);
    const base = (s.frameOrder[tabKey] && s.frameOrder[tabKey].length) ? s.frameOrder[tabKey] : (tab.frames ? tab.frames.slice() : []);
    s.frameOrder[tabKey] = base.concat([frameKey]);
  });
  renderDetail(parseInt(location.hash.match(/newcomer\/(\d+)/)[1]), curTabKey());
}
function deleteCustomFrame(tabKey, frameKey) {
  if (!requirePerm("edit_structure")) return;
  if (!confirm("Supprimer ce cadre et ses lignes ?")) return;
  saveStructure(s => {
    delete s.customFrames[frameKey];
    delete s.customItems[frameKey];
    delete s.itemOrder[frameKey];
    if (s.frameOrder[tabKey]) s.frameOrder[tabKey] = s.frameOrder[tabKey].filter(k => k !== frameKey);
  });
  renderDetail(parseInt(location.hash.match(/newcomer\/(\d+)/)[1]), curTabKey());
}

function confirmDelete(id) {
  if (!requirePerm("delete_newcomer")) return;

    link = SLACK_LINKS.reseller_services; linkLabel = "Ouvrir #reseller-services dans Slack";
  }
  else if (action === "rs_slack_mentor") {
    title = "Message Slack au mentor — questions du midi";
    body = `<p style="font-size:0.875rem; color:var(--text-muted); margin-bottom:16px;">Regroupe tes questions du matin dans un message Slack pour le mentor :</p>`
      + blockCopy("Message", `Coucou 👋\n\nQuelques questions accumulées ce matin, quand tu as un moment (pas urgent) :\n- \n- \n\nMerci ! 🙏`, true);
    link = "https://pennylane-org.slack.com/"; linkLabel = "Ouvrir Slack";
  }
  else if (action === "rs_annonce") {
    const dateStr = n.arrival_date ? ` le ${n.arrival_date}` : "";
    title = "Message #reseller-services — Annoncer l'arrivée";
    body = blockCopy("Message", `Bonjour à tous 👋\n\nJ'ai le plaisir de vous annoncer l'arrivée de ${n.name}${roleStr} dans l'équipe Reseller Services${dateStr} ! 🎉\n\nJe compte sur vous pour lui réserver le meilleur accueil. Pensez à l'ajouter aux points d'équipe (weekly RS) et aux canaux.\n\nÀ très vite ! 🙌`, true);
    link = SLACK_LINKS.reseller_services; linkLabel = "Ouvrir #reseller-services dans Slack";
  }
  else if (action === "braga") {
    title = "Message canal #relances-rdv-ob-braga";
    body = blockCopy("Message", `Bonjour,\n\nVoici le lien Chilipiper de ${n.name}${roleStr}, nouvel(le) IC qui vient de rejoindre l'équipe Onboarding Banker.\n\nMerci de l'ajouter à vos tâches de relances :\n${chiliLink(n.name)}`, true);
    link = SLACK_LINKS.braga; linkLabel = "Ouvrir #relances-rdv-ob-braga dans Slack";
  }

  body += `<a href="${link}" target="_blank" class="btn btn-primary" style="width:100%; justify-content:center; margin-top:8px;" onclick="markDoneFromModal('${id}','${getActionTaskKey(action)}')">${linkLabel}</a>`;
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = body;
  document.getElementById("modal").classList.add("open");
}

function getActionTaskKey(action) {
  const map = {slack:"slack_access", slack_rs:"slack_access", jira_connect:"pennylane_connect_jira", jira_chift:"chift_jira", jira_metabase:"metabase_access", jira_tresorit:"tresorit_check", swan:"dash_swan", braga:"braga_chili", ops_chili:"salesforce_chili", ops_modjo:"modjo_check", ops_intercom:"intercom_check", rs_chloe:"rs_acces_chloe", rs_zendesk:"rs_acces_zendesk"};
  return map[action] || "";
}
function markDoneFromModal(id, key) {
  if (key) setItemStatus(parseInt(id), key, "done");
}
function closeModal() {
  document.getElementById("modal").classList.remove("open");
  pendingRemoteRender = false; // le re-render ci-dessous prend en compte l'état à jour
  const hash = location.hash.replace(/^#\//, "").split("/");
  if (hash[0] === "newcomer") renderDetail(parseInt(hash[1]), curTabKey());
}
document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

function copyEl(elId, btn) {
  const txt = document.getElementById(elId).textContent;
  navigator.clipboard.writeText(txt).then(() => {
    const o = btn.textContent; btn.textContent = "Copié !"; btn.style.background = "var(--green-dark)"; btn.style.color = "white";
    setTimeout(() => { btn.textContent = o; btn.style.background = ""; btn.style.color = ""; }, 1500);
  });
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2000);
}
</script>
</body>
</html>
