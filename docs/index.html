  <style>
    :root {
      --teal-dark:   #003D3D;
      --teal-mid:    #006666;
      --teal-light:  #DAFBF2;
      --green:       #00F872;
      --green-dark:  #00BD57;
      --green-light: #94FFB4;
      --white:       #FFFFFF;
      --text:        #003D3D;
      --text-muted:  #527070;
      --border:      #C8E8E8;
      --bg:          #F4FAFA;
      --radius:      12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; }
    a { color: var(--teal-mid); text-decoration: none; cursor: pointer; }
    a:hover { text-decoration: underline; }

    nav {
      background: var(--teal-dark);
      padding: 0 36px;
      display: flex; align-items: center; gap: 28px;
      height: 56px;
      border-bottom: 2px solid var(--teal-mid);
    }
    nav .brand {
      font-size: 1rem; font-weight: 800; color: var(--white);
      letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px;
    }
    nav .brand-dot { width: 8px; height: 8px; background: var(--green); border-radius: 50%; display: inline-block; }
    nav a.nav-link { color: #7FB8B8; font-size: 0.875rem; font-weight: 500; }
    nav a.nav-link:hover { color: var(--white); text-decoration: none; }
    nav .nav-cta {
      margin-left: auto;
      background: var(--green); color: var(--teal-dark);
      padding: 7px 16px; border-radius: 8px; font-weight: 700; font-size: 0.82rem;
    }
    nav .nav-cta:hover { background: var(--green-dark); color: var(--white); text-decoration: none; }

    .container { max-width: none; margin: 0 auto; padding: 36px 32px; }

    .flash { padding: 12px 16px; border-radius: var(--radius); margin-bottom: 20px; font-size: 0.875rem; font-weight: 500; }
    .flash.success { background: var(--teal-light); color: var(--teal-dark); border: 1px solid var(--green-dark); }
    .flash.error { background: #FFF0F0; color: #8B1A1A; border: 1px solid #FFB3B3; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 20px; border-radius: 8px; border: none;
      cursor: pointer; font-family: 'Manrope', sans-serif;
      font-size: 0.875rem; font-weight: 700; transition: all .15s; text-decoration: none;
    }
    .btn:hover { opacity: .88; text-decoration: none; }
    .btn-primary { background: var(--teal-mid); color: var(--white); }
    .btn-primary:hover { background: var(--teal-dark); opacity: 1; }
    .btn-accent { background: var(--green); color: var(--teal-dark); }
    .btn-accent:hover { background: var(--green-dark); color: var(--white); opacity: 1; }
    .btn-slack { background: #4A154B; color: white; }
    .btn-sm { padding: 5px 13px; font-size: 0.8rem; }
    .btn-outline { background: transparent; border: 1.5px solid var(--teal-mid); color: var(--teal-mid); }
    .btn-outline:hover { background: var(--teal-light); opacity: 1; }
    .btn-danger-ghost { background: transparent; border: none; color: #C53030; font-size: 0.8rem; }

    .card {
      background: var(--white); border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgba(0,61,61,.06);
      padding: 24px; margin-bottom: 16px;
    }

    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; }
    .badge-done { background: var(--teal-light); color: var(--teal-dark); }
    .badge-pending { background: #EEF2F2; color: var(--text-muted); }
    .badge-error { background: #FFF0F0; color: #8B1A1A; }
    .badge-copy { background: #E8F4FF; color: #004080; }

    .progress-bar-wrap { background: #D4EDED; border-radius: 20px; height: 7px; flex: 1; overflow: hidden; }
    .progress-bar-fill { height: 100%; border-radius: 20px; background: var(--green-dark); transition: width .3s; }

    .phase-title {
      font-size: 0.9rem; font-weight: 800; color: var(--teal-dark);
      margin-bottom: 14px; padding-bottom: 10px;
      border-bottom: 2px solid var(--teal-light);
      display: flex; align-items: center; gap: 10px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    .task-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EEF4F4; }
    .task-row:last-child { border-bottom: none; }
    .task-check {
      width: 20px; height: 20px; border-radius: 5px;
      border: 2px solid var(--border); cursor: pointer; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s; font-size: 11px; font-weight: 700;
    }
    .task-check.done { background: var(--green-dark); border-color: var(--green-dark); color: white; }
    .task-check.auto { cursor: pointer; }
    .task-label { flex: 1; font-size: 0.875rem; font-weight: 500; }
    .task-label.done { text-decoration: line-through; color: #8AABAB; }
    .task-link { font-size: 0.78rem; color: var(--teal-mid); }
    /* [atelier RS] pastilles de métadonnées data-driven (jalon · objectif · qui) */
    .meta-pills { display: inline-flex; flex-wrap: wrap; gap: 5px; margin-left: 8px; vertical-align: middle; }
    .meta-pill { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 0.66rem; font-weight: 700; line-height: 1.5; white-space: nowrap; }
    .task-label.done .meta-pills { opacity: 0.5; }
    /* Cadre compact (liste informative, ex: canaux Slack) */
    .compact-frame .task-row { padding: 4px 0; gap: 8px; }
    .compact-frame .task-label { font-size: 0.78rem; font-weight: 500; }
    .compact-frame .task-row div[style*="font-size:0.77rem"] { font-size: 0.7rem !important; }
    /* Colonnes de rôles */
    .role-cols-header { display: flex; gap: 0; margin-bottom: 2px; }
    .role-col-head {
      width: 72px; flex-shrink: 0; text-align: center;
      font-size: 0.67rem; font-weight: 800; color: var(--teal-mid);
      text-transform: uppercase; letter-spacing: .4px;
    }
    .role-cols { display: flex; gap: 0; align-items: center; }
    .role-col { width: 72px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .role-check {
      width: 22px; height: 22px; border-radius: 5px;
      border: 2px solid var(--border); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s; font-size: 11px; font-weight: 700; flex-shrink: 0;
    }
    .role-check.done { background: var(--green-dark); border-color: var(--green-dark); color: white; }
    .role-stamp { font-size: 0.62rem; color: var(--green-dark); font-weight: 600; text-align: center; line-height: 1.2; }

    input, textarea, select {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 0.875rem; font-family: 'Manrope', sans-serif;
      color: var(--teal-dark); outline: none;
    }
    input:focus, textarea:focus { border-color: var(--teal-mid); }
    label { font-size: 0.82rem; font-weight: 700; display: block; margin-bottom: 6px; color: var(--teal-dark); text-transform: uppercase; letter-spacing: 0.4px; }

    table { width: 100%; border-collapse: collapse; }
    th { padding: 14px 20px; text-align: left; font-weight: 700; }
    td { padding: 14px 20px; }

    /* Modale */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    /* max-height + scroll interne : sans ça, une modale plus haute que l'écran (créneau de
       planning en édition : lecture + formulaire + liens) débordait en haut ET en bas, et le
       bouton Enregistrer devenait inatteignable. Corrigé le 04/09/2026. */
    .modal { background: white; border-radius: var(--radius); max-width: 560px; width: 100%; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.2); max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain; }
    code, pre { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 0.875rem; font-family: 'Manrope', sans-serif; color: var(--teal-dark); }
    pre { white-space: pre-wrap; margin: 0; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--teal-dark); color: white; padding: 12px 22px; border-radius: 10px; font-size: 0.875rem; font-weight: 600; z-index: 2000; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<script>
/* ============================================================
   IDENTIFICATION — pas de mot de passe, juste un nom (localStorage)
   ============================================================ */
const USER_KEY = "newcomer_onboarding_user";
function getUser() { return localStorage.getItem(USER_KEY) || ""; }
function setUser(name) { localStorage.setItem(USER_KEY, name); }
function ensureUser() {
  let u = getUser();
  while (!u || !u.trim()) {
    u = prompt("Bienvenue ! Identifie-toi pour suivre tes actions (ton prénom) :");
    if (u && u.trim()) { setUser(u.trim()); break; }
  }
  return getUser();
}
function changeUser() {
  const cur = getUser();
  const u = prompt("Change d'utilisateur (ton prénom) :", cur);
  if (u && u.trim()) { setUser(u.trim()); renderUserBadge(); render(); }
}
function renderUserBadge() {
  const el = document.getElementById("nav-user");
  if (!el) return;
  el.innerHTML = `<span class="brand-dot" style="background:var(--green);"></span>${esc(getUser()||"—")}`;
  if (fbAuthActive && authUser) {
    // identité fournie par Google → clic = déconnexion
    el.onclick = signOutUser;
    el.title = "Se déconnecter";
  } else {
    el.onclick = changeUser;
    el.title = "Changer d'utilisateur";
  }
  // "+ Nouveau newcomer" et "Gestion des droits" — selon permissions
  const navNew = document.getElementById("nav-new");
  if (navNew) navNew.style.display = hasPerm("create_newcomer") ? "" : "none";
  const navDroits = document.getElementById("nav-droits");
  if (navDroits) navDroits.style.display = hasPerm("manage_rights") ? "" : "none";
  // [atelier RS] sélecteur "Voir comme" — seulement en mode local (pas de Firebase Auth)
  const navRole = document.getElementById("nav-roleview");
  if (navRole) {
    if (!fbAuthActive) {
      navRole.style.display = "flex";
      const cur = LOCAL_ROLE_VIEW || "admin";
      const opts = ["admin","tl","mentor","newcomer"]
        .map(r => `<option value="${r}" ${cur===r?"selected":""}>${ACCESS_ROLE_LABELS[r]}</option>`).join("");
      const simulated = LOCAL_ROLE_VIEW && LOCAL_ROLE_VIEW !== "admin";
      // 2e menu : si "Newcomer", choisir QUELLE fiche prévisualiser (découplé de l'utilisateur courant)
      let ncSelect = "";
      if (LOCAL_ROLE_VIEW === "newcomer") {
        const list = (loadData().newcomers || []).filter(n => !n.archived);
        const ncOpts = `<option value="">— choisir une fiche —</option>` + list.map(n =>
          `<option value="${n.id}" ${LOCAL_NEWCOMER_VIEW===n.id?"selected":""}>${esc(n.name)}</option>`).join("");
        ncSelect = `<select onchange="setLocalNewcomerView(this.value)" title="Fiche à prévisualiser"
          style="font-family:'Manrope',sans-serif; font-size:0.76rem; font-weight:700; padding:2px 6px; border-radius:6px; border:1px solid #FBBF24; background:#fff; color:var(--teal-dark); cursor:pointer; margin-left:6px;">${ncOpts}</select>`;
      }
      navRole.innerHTML = `<span style="color:${simulated?'#FBBF24':'var(--green-light)'};">👁 Voir comme</span>
        <select onchange="setLocalRoleView(this.value)" title="Prévisualiser les vues par rôle (mode local)"
          style="font-family:'Manrope',sans-serif; font-size:0.76rem; font-weight:700; padding:2px 6px; border-radius:6px; border:1px solid ${simulated?'#FBBF24':'var(--teal-mid)'}; background:${simulated?'#FBBF24':'#fff'}; color:var(--teal-dark); cursor:pointer;">${opts}</select>${ncSelect}`;
    } else {
      navRole.style.display = "none";
    }
  }
  // [tronc Matt 31/08] nav Fiche démo
  const navDemo = document.getElementById("nav-demo");
  if (navDemo) navDemo.style.display = demoNewcomer() ? "" : "none";
}

  // --- OB blanc : cadre Script de présentation & posture (en tête) ---
  ob_blanc_script: { title:"Script de présentation & posture", editableDesc:true, noCheck:true, items:[
    {key:"obs_script", label:"Script de présentation", desc:"• Enregistrer la réunion / proposer le replay\n• Se présenter : interlocuteur principal durant l'accompagnement\n• Réunion de cadrage suivie d'une période d'adoption (1 à 1,5 mois)\n• Dispo par chat sur la plateforme ou par mail (aide et support / envoyer un message / service onboarding)\n• Points de suivi + point de validation qui clôture l'accompagnement\n• Équipe dédiée qui prend le relais ensuite\n• Ce qu'on va faire aujourd'hui (slide validation des paramétrages)"},
    {key:"obg_tour_table", label:"Tour de table", desc:"• Présentation du client, rôles, profil comptable ou non ?\n• Questions sur leur organisation : qui fait la TVA (cabinet ou eux) ? facturation sur PL ou importée ?\n• Qui utilisera l'outil au quotidien (rôle, maturité digitale) ? combien d'utilisateurs actifs ?\n• Des utilisateurs employés avec accès limités à créer (NDF, consultation) ?\n• Secteur d'activité et nature des flux (B2B, B2C, e-commerce, restauration…)"},
    {key:"obs_posture", label:"Posture formateur", desc:"• Aisance\n• Suivre la méthode\n• Capacité à recadrer un client\n• Capacité à s'adapter au besoin du client"},
    {key:"obg_fin_rdv", label:"Fin du RDV : récap et prise de RDV"},
  ]},

  // --- OB blanc : attendus (contenu à compléter) ---
  ob_blanc_gestion: { title:"OB blanc — Gestion : attendus", editableDesc:true, items:[
    {key:"obg_replay", label:"Enregistrer la réunion / proposer le replay"},
    {key:"obg_presentation", label:"Présentation OB", desc:"• Déroulé du point\n• Interlocuteur principal durant l'accompagnement\n• Période d'adoption et durée / points de suivi et point de validation\n• Dispo par chat sur la plateforme ou par mail\n• Équipe support dédiée par la suite / réponse en 5 min"},
    // Prérequis à qualifier (base checklist post-cadrage) — dimensions absentes des attendus ci-dessus
    {key:"obg_pre_usage", label:"Prérequis — Usage général de l'outil", desc:"• Facturation sur Pennylane ou autre logiciel ?\n• Achats / dépenses fournisseurs sur Pennylane ?\n• Suivi de trésorerie ?\n• Module de pilotage / analytique ?\n• Notes de frais ?\n• Facturation électronique (PDP) ?\n• Compte Pro Pennylane ?"},
    {key:"obg_pre_reprise", label:"Prérequis — Reprise de la donnée", desc:"• Factures clients ouvertes à reprendre ?\n• Catalogue produits / services à importer ?\n• Liste clients et fournisseurs disponible ?\n• Devis en cours à basculer ?"},
    {key:"obg_pre_integrations", label:"Prérequis — Intégrations", desc:"• Outils métier à connecter (caisse, e-commerce, paie, facturation externe…) ?\n• Ces intégrations sont-elles disponibles sur Pennylane ?\n• Qui gère la configuration côté client ?"},
    {key:"obg_pre_pilotage", label:"Prérequis — Besoins en pilotage", desc:"• Suivi de trésorerie ?\n• Besoins en analytique (axes, centres de coût) ?\n• Prévisionnel à configurer ?"},

  // --- Méthode OB (déroulé détaillé) — BROUILLON admin, source Notion "Aide Déroulé OB" ---
  meth_avant: { title:"Avant la rencontre", editableDesc:true, noCheck:true, items:[
    {key:"meth_prep", label:"Préparation", desc:"• Email Welcome (lien affilié Pennylane Academy) pour l'encourager à paramétrer données entreprise, bancaires, importer transactions et factures\n• Type de client (Chat, SSU, CI, GA)\n• MRR (pour définir si OB poussé ou non)\n• Commentaires du Sales dans la fiche client\n• Googler le client / LinkedIn (profil, expérience, entreprise)"},
    {key:"meth_param_verif", label:"Paramètres société à vérifier", desc:"• Avis INSEE, logo entreprise\n• IBAN avec BIC (pas récupéré à la connexion des comptes, nécessaire à la déc. TVA)\n• Modèles de factures actuelles\n• Attention : compta de trésorerie ou d'engagement\n• Plan de facturation"},
  ]},
  meth_rencontre: { title:"Rencontre client — présentation", editableDesc:true, noCheck:true, items:[
    {key:"meth_script", label:"Script de présentation", desc:"• Enregistrer la réunion / proposer le replay\n• Interlocuteur principal durant l'accompagnement\n• Réunion de cadrage suivie d'une période d'adoption (1 à 1,5 mois)\n• Dispo par chat sur la plateforme ou par mail (aide et support / envoyer un message / service onboarding)\n• Points de suivi + point de validation qui clôture l'accompagnement\n• Équipe dédiée qui prend le relais ensuite\n• Présentation du client, rôles, profil comptable ou non ?\n• Organisation : qui fait la TVA (cabinet ou eux) ? facturation sur Pennylane ou importée ?"},
    {key:"meth_slide", label:"Présentation de la slide", desc:"Rencontre GA : info sur le déroulé de l'OB / Tour de table / besoins du client / formation outil côté gestion / Questions / Email récapitulatif\nRencontre CI : Tour de table / Présentation des paramètres / Transactions, Achats et Ventes / Pilotage de trésorerie / Questions"},
  ]},
  meth_param: { title:"1 — Paramètres", editableDesc:true, noCheck:true, items:[
    {key:"meth_p_intro", label:"Entrée dans le logiciel", desc:"Si le client part dans tous les sens, recadrer : « pour telle fonctionnalité on le verra après, finissons la partie param ». Roue crantée → le client complète les informations."},
    {key:"meth_p_entreprise", label:"Informations entreprise", desc:"En GA : pas besoin d'en parler si déjà rempli.\n• Général : coordonnées de l'entreprise\n• Tenue comptable : exercices à définir, à clôturer, possibilité de figer la compta pour les exercices non clos\n• Fiscal : régime fiscal et TVA\n• Répartition du capital\n• Actions : archivage, restauration, suppression multiple (remise à 0 = pas en visu chez le client)"},
    {key:"meth_p_banques", label:"Comptes bancaires", desc:"Permet d'importer les transactions bancaires. Banque non référencée → création manuelle → pas de transmission auto → import manuel des relevés.\n• Déconnexion 90 jours\n• Délai de 24h entre la banque et Pennylane\n• Liaison des banques (prestataire de connexion ou EBICS avec cabinet) + présentation du compte pro (et CB)"},
    {key:"meth_p_transmission", label:"Transmission des factures", desc:"Ne pas passer sur toutes ; demander au client s'il utilise Google Drive / Dropbox / Qonto, sinon on laisse.\n• Application mobile (photos + documents)\n• Adresse email dédiée (suppliers / customers)\n• Qonto (justificatifs d'achats rattachés au compte)\n• Google Drive / Dropbox entreprise\n• Connecteurs prestataires (EDF, SFR, Orange…)\n• Logiciels de facturation (Sellsy, Zoho, Axonaut, Chargebee, Harvest)"},
    {key:"meth_p_facturation", label:"Facturation client", desc:"Documents et modèle : type de docs, numérotation (ex. « F-(année)- »), personnalisation (logo, couleur, intitulés), info générale, pieds de page.\nPaiement : IBAN principal ; méthodes E-virement (facture payable directement par email), prélèvement SEPA, Stripe (CB).\nEmails : modèle programmé pour l'envoi des documents de vente.\nAnnexes : documents joints (CGV, contrats…).\nRelances d'impayés : « êtes-vous intéressé par la relance client ? » sinon on n'insiste pas ; séquences d'envoi (auto = pas envoyée si payée, sinon manuel)."},
    {key:"meth_p_equipe", label:"Gestion de l'équipe", desc:"Demander s'il y aura d'autres utilisateurs (si pas eu l'info en début de réunion).\n• Utilisateurs : ajout + attribution des rôles\n• Équipes : création d'équipes et circuit de validation (notes de frais, bientôt les achats)"},
    {key:"meth_p_categories", label:"Catégories", desc:"2 types :\n• Prévisionnelles (revenu / dépense) → analyse du plan de trésorerie. Conseil : ne pas toucher aux catégories virements internes et en attente de catégorisation.\n• Analytiques (comptabilité) → affecter des catégories indépendamment du type de mouvement (marge produit, secteur…).\nAjout de familles illimité."},
    {key:"meth_p_regles", label:"Centre de règles", desc:"Mettre en place les règles de transaction, fournisseurs et clients. À voir dans le module achat et transaction."},
    {key:"meth_p_ged", label:"Activation de la GED", desc:"Dans dossier client. En GA : c'est le comptable qui verra ça avec lui ?"},
  ]},
  meth_transactions: { title:"2 — Transactions", editableDesc:true, noCheck:true, items:[
    {key:"meth_t_intro", label:"Présentation", desc:"• Indicateurs / chiffres-clés\n• Cadres : solde des comptes bancaires, solde des demandes comptables, suggestions de rapprochements\n• Statuts des transactions (justifié ou non, demande comptable)\n• Filtres, raccourcis, affichage des colonnes"},
    {key:"meth_t_traitement", label:"Traitement d'une transaction", desc:"• Ajouter / modifier fournisseurs, clients\n• Rapprocher avec un justificatif (facture) ou définir comme facultatif / perdu\n• Rapprochement suggéré\n• Plusieurs catégories (même famille ou différente)\n• Commentaire + mention d'utilisateurs avec @nom\n• Détection des doublons\n• Traitement des transactions en masse"},
    {key:"meth_t_regles", label:"Paramètres — Centre de règles", desc:"Créer des règles de transactions bancaires pour automatiser l'ajout d'une catégorie ou l'obligation de justificatif ; la vérification peut être outrepassée ou obligatoire."},
  ]},
  meth_achats: { title:"3 — Gérer les achats", editableDesc:true, noCheck:true, items:[
    {key:"meth_a_factures", label:"Factures d'achat", desc:"• Statuts (boîte de réception, à payer, payée, toutes), filtres, raccourcis\n• Traitement : vérifier les données (montant, TVA, fournisseur, dates), marquer à payer/payée, rapprocher (loupe) avec une transaction, catégories, commentaire @\n• Paiement fournisseur : sélectionner les factures, payer par Qonto ou XML\n• Centre de règles : règles de facture ou de transaction"},
    {key:"meth_a_ndf", label:"Notes de frais", desc:"Remboursement des frais des collaborateurs :\n• Importer une dépense (fichier ou photo appli)\n• Corriger l'OCR si besoin, indiquer le motif\n• Soumettre au valideur → statut à rembourser\n• Payer comme une facture d'achat\nChoisir le collaborateur (met automatiquement l'équipe)."},
    {key:"meth_a_km", label:"Frais kilométriques (dans notes de frais)", desc:"• Type de véhicule + puissance fiscale\n• Raison du déplacement\n• Déclaration en itinéraire ou en km\n• Indemnité calculée automatiquement (barème fiscal)\n• Payé comme une note de frais"},
    {key:"meth_a_demande", label:"Demande d'achat", desc:"Demander un remboursement ou l'autorisation de dépense."},
    {key:"meth_a_fournisseur", label:"Fournisseur", desc:"Visibilité des fiches fournisseurs, modification si besoin."},
  ]},
  meth_ventes: { title:"4 — Gérer les ventes", editableDesc:true, noCheck:true, items:[
    {key:"meth_v_facture", label:"Facture de vente", desc:"Statuts (à venir, en retard, encaissé, brouillon, proforma…), filtres, raccourcis."},
    {key:"meth_v_devis", label:"Établir un devis", desc:"• Nouveau devis → client, dates échéance/émission, produit\n• Champs additionnels (titres, mentions, remise…)\n• Enregistrer, marquer accepté/refusé\n• Convertir en facture (acompte, intermédiaire, solde)"},
    {key:"meth_v_traitement", label:"Traitement d'une facture de vente", desc:"• Créer depuis un devis ou « nouvelle facture »\n• Enregistrer en brouillon (pas validé) puis finaliser → génération définitive + comptabilisation\n• Attention : une fois finalisée, non modifiable\n• Envoi au client par email automatique → classée dans « À venir »"},
    {key:"meth_v_abonnement", label:"Abonnement", desc:"Facturation périodique automatique. Import des abonnements possible."},
    {key:"meth_v_produits", label:"Produits", desc:"• Import de la liste via la plateforme\n• Nouveau produit : nom, description\n• Variables : {{mois}}, {{moisPrécédent}}, {{moisSuivant}}\n• Unité, prix, devise, TVA, prix TTC, type, référence, identifiant\n• Téléchargement de la liste possible"},
    {key:"meth_v_clients", label:"Clients", desc:"• Import de la liste via la plateforme\n• Nouveau client : particulier ou entreprise (SIREN/SIRET/raison sociale, accès base SIREN)\n• Compléter la fiche client\n• Téléchargement de la liste possible"},
    {key:"meth_v_relances", label:"Relance en attente", desc:"Relances clients : à valider avant envoi (si option validation cochée) ou automatiques (si option auto cochée dans la séquence)."},
  ]},
  meth_pilotage: { title:"5 — Pilotage et trésorerie", editableDesc:true, noCheck:true, items:[
    {key:"meth_pi_categories", label:"Catégories", desc:"Famille de catégorie = un titre. 2 types : prévisionnelles (revenu/dépense, plan de tréso) et analytiques (compta). Ajout de familles illimité."},
    {key:"meth_pi_parametrage", label:"Paramétrage des catégories", desc:"• Comptabilité analytique\n• Gérer un prévisionnel\nPlusieurs catégories possibles sur une transaction ou un achat (ventilation)."},
    {key:"meth_pi_treso_indic", label:"Plan de trésorerie — indicateurs", desc:"• Solde de trésorerie à date\n• Encaissements / décaissements sur 30 jours glissants\n• Encaissements = somme des règlements perçus ; Décaissements = somme des paiements\n• Si 3 derniers mois ENCAISSEMENT > DÉCAISSEMENT → Variation de trésorerie (moyenne de l'écart)\n• Si DÉCAISSEMENT > ENCAISSEMENT → Cashburn (perte mensuelle) et Runway (mois avant épuisement)"},
    {key:"meth_pi_treso_graph", label:"Plan de trésorerie — graphique & prévisionnel", desc:"• Histogramme : solde, décaissements, encaissements ; courbe = prévisionnel ; barre noire = objectif réalisé\n• 3 points sur la ligne grise → fenêtre à droite pour le prévisionnel des mois suivants\n• Programmer : somme sur 12 mois OU « faire évoluer ce montant » (+/-, % ou €, sur X mois)\n• Tableau bas (revenus/dépenses) : 1re ligne = réel, 2e ligne grise = prévisionnel\n• Pastilles : rouge (gros dépassement), orange (petit dépassement), verte (objectif atteint)"},
    {key:"meth_pi_rapport", label:"Rapport analytique", desc:""},
  ]},
  meth_ci: { title:"Spécifique CI — Saisie / Transactions / TVA", editableDesc:true, noCheck:true, items:[
    {key:"meth_ci_saisie", label:"Point saisie factures", desc:"• 2 statuts : À traiter et Pré-traité\n• Compte de charge par défaut 6288, ventilation possible (plusieurs comptes)\n• Taux multiples, réconciliation\n• Voir toutes les écritures liées (facture, transaction, OD de RT)\n• Onglet « activité » : actions et modifs\n• Paiement : génère un fichier XML, paiement en masse"},
    {key:"meth_ci_transactions", label:"Point transactions", desc:"• Quand les transac remontent, la contrepartie du 512 part en compte d'attente (sauf règles)\n• Réconciliation : pièces comptables, suggestions, création de règles (salaire, mutuelle), modif directe du champ contrepartie (ventilation via les 3 points)\n• Rapprochement bancaire : import du relevé PDF (justif), ajout de transactions manquantes, dé-rapprochement, une fois rapproché la ligne est verrouillée (logo, non archivable)"},
    {key:"meth_ci_tva", label:"Point TVA", desc:"• Reprises : lignes non exigibles en compte d'attente ; OD manuelles vers TVA exigible ; importance du lettrage des comptes de TVA\n• Transactions non justifiées : remplir les éléments manquants / juste ajouter le taux\n• Analyse compte clients : TVA théorique (attention aux imports)\n• Historique des déclarations : conseiller de resaisir pour le cadrage annuel\n• Cadrage annuel : colonne N/A → retrouver l'écriture pour corriger le taux\n• Déclaration : œil pour voir les comptes alimentant chaque champ ; préfixe « P » = exercice antérieur ; si modif du montant → modifier aussi l'OD de TVA"},
  ]},
  meth_fin: { title:"Fin de la réunion", editableDesc:true, noCheck:true, items:[
    {key:"meth_f_suivi", label:"Clôture", desc:"• Prévoir une date pour le point de suivi\n• Le client peut envoyer une liste de questions 3 jours avant\n• Prévoir le point de validation (si congés, +15j)\n• Envoyer le mail récapitulatif\n• Passer en adoption (Salesforce)"},
  ]},
  meth_posture: { title:"Posture & pièges (retours OB blanc)", editableDesc:true, noCheck:true, items:[
    {key:"meth_po_posture", label:"Posture", desc:"• Intro « top », dire « période d'adoption » (1 à 1,5 mois)\n• Ne pas lire la checklist à voix haute\n• Éviter « vite fait », « éléments basiques » → dire « éléments synthétiques »\n• Tenir sa méthodo, ne pas dévisser\n• Pas trop scolaire : se concentrer sur les questions et besoins du client, pas tout recracher\n• Tour de table : recadrer sur leur fonctionnement (pas la vie de l'entreprise)"},
    {key:"meth_po_pieges", label:"Réponses aux pièges", desc:"• « Je n'ai pas l'information, je la note et je vous l'envoie dans un mail récap »\n• « Je n'ai pas cette info, est-ce que toi [mentor] tu as une solution ? »\n• Dans la fiche client : indiquer le RIB souhaité pour être payé\n• Catégories analytiques : expliquer d'abord les 2 grandes familles, laisser le client dire ce qu'il veut puis montrer comment faire"},
  ]},

/* [atelier RS] MODIFICATIONS de points d'auto-évaluation SME pour un profil RS (marqueur "~").
   Même logique que ITEM_PROFIL_OVERRIDES (cadres) : on ne touche pas le point SME d'origine,
   on affiche une version adaptée pour le RS avec le libellé remplacé. La clé reste identique
   (compat des coches déjà posées). v1 à valider — banc d'essai Christopher.
   ÉTAPE 2 : alimentable via getStructure().autoItemProfilOverrides (prioritaire). */
const AUTO_ITEM_PROFIL_OVERRIDES = {
  af_j1_banque:          { RS: {diff:"mod", label:"Accompagner l'intégrateur sur la connexion bancaire (relation indirecte : on outille le consultant, jamais le client final)."} },
  af_j2_intercom_usages: { RS: {diff:"mod", label:"Comprendre les premiers usages d'Intercom ET de Zendesk (support intégrateur RS)."} },
  af_j2_intercom_info:   { RS: {diff:"mod", label:"Savoir où chercher l'information dans Intercom et dans Zendesk."} },
};
// Applique une éventuelle modification RS à un point d'auto-éval (structuré prioritaire, sinon table).
function applyAutoItemProfil(it, profil) {
  if (!profil || profil === PROFIL_DEFAUT) return it;   // OB = tronc pur
  const s = getStructure();
  const fromStruct = s.autoItemProfilOverrides && s.autoItemProfilOverrides[it.key] && s.autoItemProfilOverrides[it.key][profil];
  const ov = fromStruct || (AUTO_ITEM_PROFIL_OVERRIDES[it.key] && AUTO_ITEM_PROFIL_OVERRIDES[it.key][profil]);
  if (!ov) return it;
  const {diff, ...fields} = ov;                          // label/desc… remplacent le point SME
  return {...it, ...fields, _diff: diff || "mod"};
}
// Les journées sont repliées par défaut (on ouvre celle qu'on valide) — voir isCollapsed().
const AUTO_DAY_KEYS = new Set(AUTOFORMATION.concat(AUTOFORMATION_RS).map(d => d.key));

function itemVisibleForRole(it) {

/* --- Journalisation visuelle : badges & marqueurs (fonctions pures, esc() plus bas) --- */
// Pastille du profil d'un newcomer (couleur par profil).
function profilBadge(profilKey) {

// Petit liseré devant un onglet/cadre spécifique à un profil (rien si tronc commun).
// Combine les 2 dimensions : couleur du profil + signe du type de changement.
function profilTag(def) {
  if (!def || !def.profils || !def.profils.length) return "";
  // [atelier RS] un élément restreint au seul profil par défaut (OB) sans type de changement
  // = tronc commun du point de vue OB → aucun marqueur (évite une pastille parasite).
  if (!def.diff && def.profils.length === 1 && def.profils[0] === PROFIL_DEFAUT) return "";
  const p = PROFILS[def.profils[0]] || {};
  const d = DIFF_TYPES[def.diff] || null;
  const sign = d ? d.sign : "●";
  const col = d ? d.color : (p.color || "#888");
  const title = `${(p.label||def.profils.join(","))}${d ? " — "+d.label : ""}`;
  return `<span title="${esc(title)}" style="display:inline-block; margin-right:6px; padding:0 5px; border-radius:4px; font-weight:800; font-size:0.7rem; color:#fff; background:${col};">${sign}</span>`;
}
// Légende affichée en tête de fiche newcomer (rappel du code couleur).
function profilLegend(profilKey) {
  const p = PROFILS[profilKey] || PROFILS[PROFIL_DEFAUT];
  if (profilKey === PROFIL_DEFAUT) return ""; // OB = tronc pur, pas de divergence à signaler
  // Vue newcomer : on n'affiche que les écarts VISIBLES ici (ajout, modification).
  // Le "retrait" n'a rien à montrer dans cette vue (le bloc est absent) → il vit dans
  // la recette/journal pour Matt, pas dans la légende opérationnelle.
  const LEGENDE_VISIBLE = ["add", "mod"];
  const diffs = LEGENDE_VISIBLE.map(k => DIFF_TYPES[k])
    .map(d => `<span style="margin-right:12px;"><span style="display:inline-block; width:16px; text-align:center; border-radius:4px; color:#fff; font-weight:800; background:${d.color};">${d.sign}</span> ${d.label}</span>`)
    .join("");

    <strong style="color:${p.color};">Profil ${esc(p.label)}</strong> — écarts vs tronc commun :&nbsp; ${diffs}

}
// [atelier RS] onglets visibles pour un profil (+ voie si RS) : tronc commun + onglets du profil/voie.
function visibleTabs(profil, voie) {

/* ============================================================
   [atelier RS] OVERRIDES D'ITEMS PAR PROFIL — fourche A au niveau ITEM
   Permet de RETIRER ou MODIFIER un item du tronc commun pour un profil donné,
   SANS toucher l'item d'origine (qui reste intact pour OB).
   Forme : { itemKey: { RS: {diff:"remove"} | {diff:"mod", label?, desc?, link?, linkLabel?, action?} } }
   - "remove" : l'item disparaît de la vue du profil → AUCUN marqueur (règle option A :
     le retrait vit dans la recette Matt, pas dans la vue opérationnelle du newcomer).
   - "mod"    : l'item s'affiche avec les champs remplacés + marqueur "~".
   ⚠️ ÉTAPE 1 (modèle d'abord) : table codée en dur = preuve du mécanisme.
   ÉTAPE 2 : cette table sera alimentée par l'éditeur in-app (portée profil), via
   getStructure().itemProfilOverrides — déjà pris en compte ci-dessous (priorité au structuré).
   ============================================================ */
const ITEM_PROFIL_OVERRIDES = {

  braga_chili:    { RS: {diff:"remove"} },

  slack_access:   { RS: {diff:"mod",
    label:"Slack : canaux + groupes d'utilisateurs (OB + RS)",
    desc:"Ajouter l'IC au canal #professional-services, aux 2 groupes @cs.services et @ob, ET au canal #reseller-services (couche RS).",
    action:"slack_rs"} },

  tresorit_check: { RS: {diff:"mod",
    label:"Trésorit : vérif dossier Équipe Reseller + ticket Jira",

};
// Override applicable à un item pour un profil (structure éditable prioritaire, sinon table codée).
function itemProfilOverride(itemKey, profil) {
  if (!profil || profil === PROFIL_DEFAUT) return null; // OB = tronc pur, aucun écart
  const s = getStructure();
  const fromStruct = s.itemProfilOverrides && s.itemProfilOverrides[itemKey] && s.itemProfilOverrides[itemKey][profil];
  const fromCode = ITEM_PROFIL_OVERRIDES[itemKey] && ITEM_PROFIL_OVERRIDES[itemKey][profil];

// Applique l'override à un item : null si retiré, sinon l'item (copie avec champs remplacés + _diff si modifié).
function applyItemProfil(it, profil) {

}

function itemDiffMarker(it) {

/* ============================================================
   [atelier RS] MÉTADONNÉES D'ITEM (jalon · objectif · qui)
   Lecture avec priorité au structuré éditable (getStructure().itemMeta[itemKey]),
   sinon les champs codés en dur sur l'item (jalon/objectif/qui). Même logique de

   ============================================================ */
function itemMeta(it) {
  if (!it) return {};
  const s = getStructure();
  const fromStruct = (s.itemMeta && s.itemMeta[it.key]) || {};
  // Le structuré (édité in-app) prime sur le codé en dur ; on ne garde que les clés connues.
  const jalon    = fromStruct.jalon    != null ? fromStruct.jalon    : it.jalon;
  const objectif = fromStruct.objectif != null ? fromStruct.objectif : it.objectif;
  const qui      = fromStruct.qui      != null ? fromStruct.qui      : it.qui;
  return {jalon, objectif, qui};
}
// Pastilles compactes jalon · objectif · qui après l'intitulé (rien si aucune métadonnée).
function itemMetaPills(it) {
  const m = itemMeta(it);
  let out = "";
  if (m.jalon && JALONS[m.jalon]) {
    const j = JALONS[m.jalon];
    out += `<span class="meta-pill" title="Jalon : ${esc(j.label)}" style="background:${j.color}1A; color:${j.color}; border:1px solid ${j.color}40;">${esc(j.short)}</span>`;
  }
  if (m.objectif && OBJECTIFS[m.objectif]) {
    const o = OBJECTIFS[m.objectif];
    out += `<span class="meta-pill" title="Objectif : ${esc(o.label)}" style="background:#7C3AED14; color:#7C3AED; border:1px solid #7C3AED33;">🎯 ${esc(o.short)}</span>`;
  }
  if (m.qui) {
    // `qui` peut être une string OU un tableau (ex. tâche portée par 2 mentors) → une pastille par rôle.
    (Array.isArray(m.qui) ? m.qui : [m.qui]).forEach(k => {
      const q = QUI[k]; if (!q) return;
      out += `<span class="meta-pill" title="Qui : ${esc(q.label)}" style="background:#F1F5F9; color:#475569; border:1px solid #CBD5E1;">${q.icon} ${esc(q.label)}</span>`;
    });
  }
  return out ? `<span class="meta-pills">${out}</span>` : "";
}

// Tous les items cochables, tous cadres confondus (exclut les cadres noCheck → compteur global)

  if (fbRef) {

function encodeKey(k) { return String(k).replace(/\./g, ","); }
function decodeKey(k) { return String(k).replace(/,/g, "."); }
function encodeKeyedMap(m) { const o = {}; if (m) Object.keys(m).forEach(k => o[encodeKey(k)] = m[k]); return o; }

      if (sd.frameOrder) delete sd.frameOrder.ressources;

  if (!done.ressources_par_jour_202608e) {

      const ord = sd.frameOrder && sd.frameOrder.ressources;
      if (ord && ord.length) {
        const reste = ord.filter(k => !jours.includes(k));

  if (!done.ressources_socle_202609) {

  if (!done.observateur_sans_view_all_202609) {

      if (!sd.migrations) sd.migrations = {};
      sd.migrations.observateur_sans_view_all_202609 = true;

  if (!todo.length) return;
  saveStructure(sd => { todo.forEach(fn => fn(sd)); });
}
function getStructure() {

function frameDef(frameKey) {
  if (FRAMES[frameKey]) return FRAMES[frameKey];
  const cf = getStructure().customFrames[frameKey];
  if (cf) return {title: cf.title, editableDesc:true, items:[], custom:true};
  return null;
}
// Liste ordonnée des cadres d'un onglet (base + ajouts, selon frameOrder)
// [atelier RS] profil optionnel → filtre en plus les cadres taggés hors profil (fourche A).
function tabFrameKeys(tab, profil, voie) {
  if (!tab.frames) return [];
  const s = getStructure();
  const ordered = s.frameOrder[tab.key];
  let keys;
  if (ordered && ordered.length) {
    // garder ceux qui existent encore (base ou custom)
    const kept = ordered.filter(fk => FRAMES[fk] || s.customFrames[fk]);
    // Ajouter les cadres de base ajoutés au code APRÈS la sauvegarde de l'ordre (sinon invisibles).
    const missing = (tab.frames || []).filter(fk => !kept.includes(fk));
    keys = kept.concat(missing);
  } else {
    keys = tab.frames.slice();
  }
  if (profil) keys = keys.filter(fk => visibleForProfil(frameDef(fk), profil));
  if (voie) keys = keys.filter(fk => visibleForVoie(frameDef(fk), voie)); // [atelier RS] fourche voie (classique/technique)
  // [atelier RS] Priorité au profil : pour un profil non-défaut (ex. RS), les cadres
  // taggés POUR ce profil remontent en tête, tri STABLE (l'ordre relatif est préservé
  // à l'intérieur de chaque groupe). Objectif : un Reseller voit d'abord son contenu RS.
  if (profil && profil !== PROFIL_DEFAUT) {
    const tagged = fk => { const d = frameDef(fk); return !!(d && d.profils && d.profils.includes(profil)); };
    keys = keys.map((fk, i) => [fk, i]).sort((a, b) => (tagged(b[0]) - tagged(a[0])) || (a[1] - b[1])).map(p => p[0]);
  }
  return keys;
}
// Liste ordonnée des items d'un cadre (base + customItems, selon itemOrder, moins les masqués)
// [atelier RS] profil optionnel → applique les overrides par profil (retrait / modification d'items).
function frameItems(frameKey, profil, voie) {
  const def = frameDef(frameKey);
  const base = def ? (def.items || []) : [];
  const s = getStructure();
  const hidden = (s.hiddenItems || []);
  const customs = (s.customItems[frameKey] || []).map(c => ({...c, custom:true}));
  const all = base.concat(customs).filter(it => !hidden.includes(it.key));
  const order = s.itemOrder[frameKey];
  let list;
  if (order && order.length) {
    const byKey = {}; all.forEach(it => byKey[it.key] = it);
    const ordered = order.map(k => byKey[k]).filter(Boolean);
    // ajouter ceux absents de l'ordre (nouveaux) à la fin
    all.forEach(it => { if (!order.includes(it.key)) ordered.push(it); });
    list = ordered;
  } else {
    list = all;
  }
  // [atelier RS] fourche A au niveau ITEM — filtrage par tag `profils` :
  // un item SANS tag = tronc commun (visible pour tous, OB inchangé) ;
  // un item taggé `profils:[...]` n'apparaît que pour ces profils (ex. accès RS "add").
  list = list.filter(it => visibleForProfil(it, profil || PROFIL_DEFAUT));
  if (voie) list = list.filter(it => visibleForVoie(it, voie)); // [atelier RS] fourche voie au niveau item
  // fourche A au niveau item : retrait (null → exclu) / modification (champs + _diff).
  if (profil && profil !== PROFIL_DEFAUT) {
    list = list.map(it => applyItemProfil(it, profil)).filter(Boolean);
    // un item propre au profil qui déclare son propre `diff` (ex. "add") → marqueur affiché
    list = list.map(it => (it && it.profils && it.diff && !it._diff) ? {...it, _diff: it.diff} : it);
  }
  // [atelier RS] MOD par voie : item commun aux 2 voies mais libellé/desc spécifique (ex. volumétrie OB).
  if (voie) list = list.map(it => applyVoieItem(it, voie));
  // [atelier RS] filtrage STRICT par rôle newcomer (ne voit que ses tâches) — cf. itemVisibleForRole.
  list = list.filter(itemVisibleForRole);
  return list;
}

/* ============================================================
   PERSISTANCE — Firebase (partagé) avec repli localStorage
   - DATA : copie en mémoire, source de vérité pour le rendu synchrone.
   - Si Firebase configuré : push à chaque save + listener temps réel.
   - Sinon : localStorage (données locales au navigateur).
   ============================================================ */
const STORE_KEY = "newcomer_onboarding_v1";
let DATA = {newcomers:[], seq:0};
let fbRef = null;            // référence Realtime Database
let fbReady = false;         // true quand le 1er snapshot est reçu
let applyingRemote = false;  // évite la boucle save->listener->save

function firebaseEnabled() {
  return !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.databaseURL);
}

function loadLocal() {
  try { return normalizeData(JSON.parse(localStorage.getItem(STORE_KEY))); }
  catch(e) { return {newcomers:[], seq:0}; }
}

// Normalise l'état : Firebase peut renvoyer 'newcomers' en tableau avec trous (null) ou en objet indexé.
// On garantit un vrai tableau sans null, et un seq cohérent.
function normalizeData(val) {
  if (!val || typeof val !== "object") return {newcomers:[], seq:0};
  // Source prioritaire : newcomersById (nouveau format objet) ; sinon newcomers (ancien format)
  let ncs;
  if (val.newcomersById && typeof val.newcomersById === "object") {
    ncs = Object.values(val.newcomersById).filter(Boolean);
  } else {
    ncs = val.newcomers;
    if (Array.isArray(ncs)) ncs = ncs.filter(Boolean);        // retire les trous (null)
    else if (ncs && typeof ncs === "object") ncs = Object.values(ncs).filter(Boolean); // objet indexé → tableau
    else ncs = [];
  }
  ncs.sort((a,b) => (a.id||0) - (b.id||0));
  const maxId = ncs.reduce((m, n) => Math.max(m, n && n.id ? n.id : 0), 0);
  const seq = Math.max(val.seq || 0, maxId);
  const out = {...val, newcomers: ncs, seq};
  delete out.newcomersById; // en mémoire on ne garde que le tableau
  // Décodage des clés encodées pour Firebase (virgule → point) sur les maps par local-part.
  if (out.structure) {
    const st = {...out.structure};
    if (st.logins) st.logins = decodeKeyedMap(st.logins);
    if (st.accessRoles) st.accessRoles = decodeKeyedMap(st.accessRoles);
    out.structure = st;
  }
  return out;
}

// API conservée : loadData() renvoie la copie mémoire, saveData() persiste.
function loadData() { return DATA; }
let pendingLocalEcho = false;     // true entre notre écriture et la réception de son écho Firebase
let pendingRemoteRender = false;  // un changement distant est arrivé pendant qu'une modale était ouverte
function saveData(d) {
  DATA = d;
  localStorage.setItem(STORE_KEY, JSON.stringify(d)); // cache local toujours
  if (fbRef && !applyingRemote) {
    // 'newcomers' poussé comme OBJET indexé par id (évite les tableaux à trous quand les id ne partent pas de 0)
    const newcomersById = {};
    (d.newcomers || []).forEach(n => { if (n && n.id != null) newcomersById[n.id] = n; });
    // Structure à écrire — SANS 'logins' : le journal des connexions n'est JAMAIS réécrit par
    // l'enregistrement global (il serait écrasé par une copie locale périmée d'un autre client).
    // Seul recordLogin écrit logins, en chemin ciblé (structure/logins/<clé encodée>).
    const st = {...(d.structure || {})};
    delete st.logins;
    if (st.accessRoles) st.accessRoles = encodeKeyedMap(st.accessRoles); // clés RTDB sans point
    pendingLocalEcho = true;
    // update() cible chaque nœud sans remplacer tout le document → préserve structure/logins.
    Promise.all([
      fbRef.update({ seq: d.seq || 0, newcomersById, newcomers: null }),
      fbRef.child("structure").update(st),
    ])
      .then(() => { pendingLocalEcho = false; })
      .catch(e => { pendingLocalEcho = false; console.warn("Firebase save échoué :", e.message); });
  }
}

const ALLOWED_DOMAIN = "@pennylane.com";
let authUser = null;      // utilisateur Firebase connecté (ou null)
let dbStarted = false;    // listener DB déjà branché
let fbAuthActive = false; // true seulement si Firebase + Auth réellement dispo

// Initialise Firebase + authentification. Résout quand l'état d'auth est connu.
function initStorage() {
  return new Promise(resolve => {
    if (!firebaseEnabled() || typeof firebase === "undefined" || !firebase.auth) {
      DATA = loadLocal();   // SDK indisponible → repli local, pas d'auth exigée
      resolve();
      return;
    }
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      fbAuthActive = true;
      firebase.auth().onAuthStateChanged(user => {
        if (user && user.email && user.email.toLowerCase().endsWith(ALLOWED_DOMAIN)) {
          authUser = user;
          setUser(user.displayName || user.email.split("@")[0]);
          renderAuthGate();
          // Affichage instantané depuis le cache local, puis rafraîchissement DB en arrière-plan
          DATA = loadLocal();
          if (!fbReady) { fbReady = true; resolve(); }
          startDbListener(); // le listener re-render quand les données fraîches arrivent
        } else {
          if (user) { firebase.auth().signOut(); authUser = null; } // domaine non autorisé
          else authUser = null;
          renderAuthGate();
          if (!fbReady) { fbReady = true; resolve(); } // pas connecté : résoudre pour afficher le login
        }
      });
    } catch(e) {
      console.warn("Init Firebase échouée, repli localStorage :", e.message);
      fbAuthActive = false;
      DATA = loadLocal();
      resolve();
    }
    // Filet de sécurité : si l'auth ne répond pas en 8s, on ne bloque pas indéfiniment
    setTimeout(() => { if (!fbReady) { fbReady = true; resolve(); } }, 8000);
  });
}

// Branche le listener temps réel (uniquement une fois connecté)
// onFirstSnap : callback appelé au premier snapshot reçu (données prêtes)
function startDbListener(onFirstSnap) {
  if (dbStarted) { if (onFirstSnap) onFirstSnap(); return; }
  dbStarted = true;
  fbRef = firebase.database().ref("appData");
  let firstSnap = true;
  fbRef.on("value", snap => {
    const val = snap.val();
    if (firstSnap) {
      firstSnap = false;
      applyingRemote = true;
      DATA = normalizeData(val);
      localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
      applyingRemote = false;
      runMigrations();   // migrations one-shot (ex. reset ordre onglet Formation)
      recordLogin();
      if (onFirstSnap) onFirstSnap();
      render(); setSyncBadge(true);
      return;
    }
    setSyncBadge(true);
    // Si une écriture locale est en attente d'écho, on ignore les snapshots jusqu'à réception
    // du nôtre (évite qu'un snapshot en retard écrase notre modif). L'echo de notre écriture
    // porte le même contenu que DATA courant → on ne fait rien.
    const incomingNorm = JSON.stringify(normalizeData(val));
    if (incomingNorm === JSON.stringify(DATA)) { pendingLocalEcho = false; return; } // identique → rien à faire
    if (pendingLocalEcho) return; // snapshot en retard pendant qu'on attend notre écho → ignorer
    // Vrai changement distant : appliquer
    applyingRemote = true;
    DATA = normalizeData(val);
    localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
    applyingRemote = false;
    const modalOpen = document.getElementById("modal").classList.contains("open");
    if (modalOpen) { pendingRemoteRender = true; return; }
    render();
  }, err => {
    console.warn("Firebase DB inaccessible :", err.message);
    if (onFirstSnap) onFirstSnap(); // ne pas bloquer si la DB échoue
  });
}

function isAuthed() {
  return !fbAuthActive || !!authUser; // auth requise seulement si Firebase Auth actif
}
function signInGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  provider.setCustomParameters({ hd: "pennylane.com", prompt: "select_account" });
  firebase.auth().signInWithPopup(provider).catch(e => {
    alert("Connexion échouée : " + e.message);
  });
}
function signOutUser() {
  if (firebase && firebase.auth) firebase.auth().signOut().then(() => location.reload());
}

// Écran de connexion / garde d'accès
function renderAuthGate() {
  if (isAuthed()) { document.getElementById("auth-gate").style.display = "none"; return; }
  const gate = document.getElementById("auth-gate");
  gate.style.display = "flex";
  gate.innerHTML = `
    <div style="background:#fff; border-radius:var(--radius); border:1px solid var(--border); box-shadow:0 8px 30px rgba(0,61,61,.12); padding:40px; max-width:400px; text-align:center;">
      <div style="width:48px; height:48px; background:var(--teal-light); border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; font-size:1.4rem;">🔒</div>
      <h1 style="font-size:1.3rem; font-weight:800; color:var(--teal-dark); margin-bottom:8px;">Onboarding Newcomers</h1>
      <p style="font-size:0.875rem; color:var(--text-muted); margin-bottom:24px;">Accès réservé aux collaborateurs Pennylane. Connecte-toi avec ton compte <strong>@pennylane.com</strong>.</p>
      <button class="btn btn-accent" style="width:100%; justify-content:center;" onclick="signInGoogle()">Se connecter avec Google</button>
    </div>`;
}

function setSyncBadge(on) {
  const el = document.getElementById("nav-sync");
  if (!el) return;
  if (firebaseEnabled()) {
    el.textContent = "● synchronisé";
    el.style.color = "var(--green)";
    el.title = "Données partagées entre collègues (Firebase)";
  } else {
    el.textContent = "● local";
    el.style.color = "#E0A800";
    el.title = "Données locales à ce navigateur (Firebase non configuré)";
  }
}

function createNewcomer(fields) {
  const d = loadData();
  d.seq += 1;
  const nc = {id: d.seq, ...fields, status:{}, createdAt: new Date().toISOString()};
  d.newcomers.push(nc);
  saveData(d);
  return nc.id;
}
function getNewcomer(id) { return loadData().newcomers.find(n => n.id === id); }
function updateNewcomer(id, patch) {
  const d = loadData();
  const n = d.newcomers.find(x => x.id === id);
  if (!n) return;
  Object.assign(n, patch);
  saveData(d);
}
function deleteNewcomer(id) {
  const d = loadData();
  d.newcomers = d.newcomers.filter(n => n.id !== id);
  saveData(d);
}
function setArchived(id, archived) {
  updateNewcomer(id, {archived: archived});
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
function slugify(name) {
  return name.normalize("NFKD").replace(/[̀-ͯ]/g, "")
    .trim().toLowerCase().replace(/\s+/g, "-");
}
function chiliLink(name) {
  return `https://pennylane.chilipiper.com/shared/${slugify(name)}/link-60min`;
}
function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
// Statut unifié : lit n.status ET n.training (compat anciennes données), écrit dans n.status
function itemDone(n, key) {
  return (n.status||{})[key] === "done" || (n.training||{})[key] === "done";
}
// Statut par colonne de rôle (tl / newcomer / mentor)
function itemRoleDone(n, key, role) {
  return ((n.roleStatus||{})[key]||{})[role] === "done";
}
function setItemRoleStatus(id, key, role, done) {
  const d = loadData();
  const n = d.newcomers.find(x => x.id === id);
  if (!n) return;
  if (!n.roleStatus) n.roleStatus = {};
  if (!n.roleStatus[key]) n.roleStatus[key] = {};
  n.roleStatus[key][role] = done ? "done" : "pending";
  if (!n.roleDates) n.roleDates = {};
  if (!n.roleDates[key]) n.roleDates[key] = {};
  if (done) n.roleDates[key][role] = {at: new Date().toISOString(), by: getUser()};
  else delete n.roleDates[key][role];
  saveData(d);
}
function itemRoleStamp(n, key, role) {
  const raw = ((n.roleDates||{})[key]||{})[role];
  if (!raw) return null;
  const dt = new Date(raw.at);
  const j = String(dt.getDate()).padStart(2,"0");
  const m = String(dt.getMonth()+1).padStart(2,"0");
  return {date:`${j}/${m}/${dt.getFullYear()}`, by: raw.by||""};
}
function setItemStatus(id, key, status) {
  const d = loadData();
  const n = d.newcomers.find(x => x.id === id);
  if (!n) return;
  if (!n.status) n.status = {};
  n.status[key] = status;
  if (n.training && key in n.training) n.training[key] = status;
  if (!n.dates) n.dates = {};
  if (status === "done") n.dates[key] = {at: new Date().toISOString(), by: getUser()};
  else delete n.dates[key];
  saveData(d);
}
// Note libre par item (ex: "ce qu'on doit montrer") — éditable, partagée
function getItemNote(n, key) { return (n.itemNotes||{})[key] || ""; }
function saveItemNote(id, key, text) {
  const d = loadData();
  const n = d.newcomers.find(x => x.id === id);
  if (!n) return;
  if (!n.itemNotes) n.itemNotes = {};
  if (text && text.trim()) n.itemNotes[key] = text.trim();
  else delete n.itemNotes[key];
  saveData(d);
}
// Descriptions de référence (référentiel commun, partagé) — override global de it.desc
function getDesc(item) {
  const ov = (DATA.descOverrides || {})[item.key];
  return ov !== undefined ? ov : (item.desc || "");
}
function saveDesc(key, text) {
  const d = loadData();
  if (!d.descOverrides) d.descOverrides = {};
  d.descOverrides[key] = (text || "").trim();
  saveData(d);
}
// Libellés de référence (référentiel commun, partagé) — override global de it.label
function getLabel(item) {
  const ov = (DATA.labelOverrides || {})[item.key];
  return ov !== undefined && ov !== "" ? ov : (item.label || "");
}
function saveLabel(key, text) {
  const d = loadData();
  if (!d.labelOverrides) d.labelOverrides = {};
  d.labelOverrides[key] = (text || "").trim();
  saveData(d);
}

/* --- LIVRET D'INTÉGRATION : stockage par newcomer --- */
function livretOf(n) { return n.livret || {niveaux:{}, comments:{}, signatures:{}}; }
function getLivretNiveau(n, itemKey, who) {
  const lv = (n.livret && n.livret.niveaux && n.livret.niveaux[itemKey]) || {};
  return lv[who] || "";
}
function setLivretNiveau(id, itemKey, who, val) {
  const d = loadData();
  const n = d.newcomers.find(x => x.id === id);
  if (!n) return;
  if (!n.livret) n.livret = {niveaux:{}, comments:{}, signatures:{}};
  if (!n.livret.niveaux) n.livret.niveaux = {};
  if (!n.livret.niveaux[itemKey]) n.livret.niveaux[itemKey] = {};
  const cur = n.livret.niveaux[itemKey][who];
  if (cur === val) { // clic sur le niveau déjà sélectionné = désélection
    n.livret.niveaux[itemKey][who] = "";
    delete n.livret.niveaux[itemKey][who + "By"];
    delete n.livret.niveaux[itemKey][who + "At"];
  } else {
    n.livret.niveaux[itemKey][who] = val;
    n.livret.niveaux[itemKey][who + "By"] = getUser();
    n.livret.niveaux[itemKey][who + "At"] = new Date().toISOString();
  }
  saveData(d);
}
function getLivretStamp(n, itemKey, who) {
  const lv = (n.livret && n.livret.niveaux && n.livret.niveaux[itemKey]) || {};
  const iso = lv[who + "At"]; if (!iso) return "";
  const by = lv[who + "By"] || "";
  const dt = new Date(iso);
  const j = String(dt.getDate()).padStart(2,"0"), m = String(dt.getMonth()+1).padStart(2,"0");
  return `validé${by?" par "+by:""} le ${j}/${m}/${dt.getFullYear()}`;
}
// Commentaire par compétence (item) du livret
function getLivretItemComment(n, itemKey) {
  return (n.livret && n.livret.itemComments && n.livret.itemComments[itemKey]) || "";
}
function saveLivretItemComment(id, itemKey, text) {

  if (!n) return;
  if (!n.livret) n.livret = {niveaux:{}, comments:{}, signatures:{}};
  if (!n.livret.itemComments) n.livret.itemComments = {};
  if (text && text.trim()) n.livret.itemComments[itemKey] = text.trim();
  else delete n.livret.itemComments[itemKey];
  saveData(d);
}
function getLivretComment(n, sectionKey, who) {

}
function saveLivretComment(id, sectionKey, who, text) {

// Verrouillage du livret (fige coches/commentaires/signatures)
function isLivretLocked(n) { return !!(n.livret && n.livret.locked); }

/* --- ACQUIS : stockage par newcomer ---
   n.autoformation = { niveaux: {itemKey:{auto, autoBy, autoAt}}, comments: {dayKey} }
   Une passe sur les 40 points, sous la clé 'auto' (voir AUTO_PASSES). Une clé 's3' a existé
   quelques heures le 27/08/2026 pour une 2e passe à 3 semaines, retirée depuis : les données
   éventuellement saisies dessous sont conservées en base mais ne sont plus lues.
   Volontairement SÉPARÉ de n.livret : rien n'est propagé vers le Livret, et le verrouillage
   du Livret ne fige pas cette saisie. */
function getAutoNiveau(n, itemKey, who) {
  const lv = (n.autoformation && n.autoformation.niveaux && n.autoformation.niveaux[itemKey]) || {};
  return lv[who] || "";
}
function setAutoNiveau(id, itemKey, who, val) {
  const d = loadData();
  const n = d.newcomers.find(x => x.id === id);
  if (!n) return;
  if (!n.autoformation) n.autoformation = {niveaux:{}, comments:{}};
  if (!n.autoformation.niveaux) n.autoformation.niveaux = {};
  if (!n.autoformation.niveaux[itemKey]) n.autoformation.niveaux[itemKey] = {};
  const slot = n.autoformation.niveaux[itemKey];
  if (slot[who] === val) {          // clic sur le niveau déjà sélectionné = désélection
    slot[who] = ""; delete slot[who + "By"]; delete slot[who + "At"];
  } else {
    slot[who] = val; slot[who + "By"] = getUser(); slot[who + "At"] = new Date().toISOString();
  }
  saveData(d);
}
function getAutoStamp(n, itemKey, who) {
  const lv = (n.autoformation && n.autoformation.niveaux && n.autoformation.niveaux[itemKey]) || {};
  const iso = lv[who + "At"]; if (!iso) return "";
  const by = lv[who + "By"] || "";
  const dt = new Date(iso);
  const j = String(dt.getDate()).padStart(2,"0"), m = String(dt.getMonth()+1).padStart(2,"0");
  return `${by ? by + " · " : ""}${j}/${m}/${dt.getFullYear()}`;
}
// Suivi d'un point « À reprendre » : le mentor y note quand et comment le point a été revu.
// Conservé même si le niveau change ensuite, pour garder la trace.
function getAutoItemComment(n, itemKey) {

}
function saveAutoItemComment(id, itemKey, text) {

  if (!n.autoformation.itemComments) n.autoformation.itemComments = {};
  if (text && text.trim()) n.autoformation.itemComments[itemKey] = text.trim();
  else delete n.autoformation.itemComments[itemKey];

}
function getAutoComment(n, dayKey) {

}
function saveAutoComment(id, dayKey, text) {

// Compteurs : nombre de points positionnés (tous niveaux confondus), par passe
function autoDayDone(n, day, who) { return day.items.filter(it => getAutoNiveau(n, it.key, who)).length; }
// [atelier RS] compter sur les journées visibles pour le PROFIL du newcomer (SME + section RS le cas échéant)
function autoPassDone(n, who) { return autoDaysFor(n).reduce((s, d) => s + autoDayDone(n, d, who), 0); }
function autoAllDone(n) { return AUTO_PASSES.reduce((s, p) => s + autoPassDone(n, p.key), 0); }


// Renvoie {date, by} — compat ancien format (string ISO sans auteur)
function itemStamp(n, key) {
  const raw = (n.dates||{})[key];
  if (!raw) return null;
  const iso = typeof raw === "string" ? raw : raw.at;
  const by = typeof raw === "string" ? "" : (raw.by || "");
  const dt = new Date(iso);
  const j = String(dt.getDate()).padStart(2,"0");
  const m = String(dt.getMonth()+1).padStart(2,"0");
  return {date: `${j}/${m}/${dt.getFullYear()}`, by};
}
// Compteurs par cadre / onglet / global
function countFrame(n, frameKey) {
  const f = frameDef(frameKey); if (!f || f.noCheck) return {done:0,total:0};
  // [atelier RS] compter selon le profil du newcomer (items retirés = non comptés)
  const items = frameItems(frameKey, profilOf(n), sousProfilOf(n)).filter(it => !it.heading); // les sous-titres ne comptent pas
  // Checklist post-cadrage : on compte la colonne de CELUI QUI REGARDE. Avec la règle
  // « toutes les colonnes cochées » utilisée ailleurs, cocher une seule case ne faisait pas
  // bouger le compteur du cadre : la coche semblait ignorée alors qu'elle était bien
  // enregistrée. Le TL a son propre compteur, le newcomer le sien.
  if (f.checklist) {
    const own = checklistOwnCol();
    return {done: items.filter(it => itemRoleDone(n, it.key, own)).length, total: items.length};
  }
  const cols = frameColsFor(frameKey);
  const done = cols
    ? items.filter(it => cols.every(rc => itemRoleDone(n, it.key, rc.key))).length
    : items.filter(it => itemDone(n, it.key)).length;
  return {done, total:items.length};
}
// Compteur d'une colonne précise d'un cadre (sert au 2e compteur de la vue TL)
function countFrameCol(n, frameKey, roleCol) {
  const items = frameItems(frameKey).filter(it => !it.heading);
  return {done: items.filter(it => itemRoleDone(n, it.key, roleCol)).length, total: items.length};
}
function countTab(n, tab) {
  // Onglet Acquis : compteur sur les points positionnés (pas de cadres)
  // [atelier RS] total selon le profil (SME + section RS le cas échéant) × nb de passes (Matt)
  if (tab.autoformation) return {done: autoAllDone(n), total: autoTotalFor(n) * AUTO_PASSES.length};
  if (!tab.frames) return {done:0, total:0}; // onglet livret / planning : pas de cadres standard
  // [atelier RS] ne compter que les cadres visibles pour le profil du newcomer
  return tabFrameKeys(tab, profilOf(n), sousProfilOf(n)).reduce((acc,fk) => {
    const c = countFrame(n, fk); acc.done+=c.done; acc.total+=c.total; return acc;
  }, {done:0,total:0});
}
// [atelier RS] les clés d'items retirées pour un profil (exclues des compteurs globaux).
function removedKeysForProfil(profil) {
  if (!profil || profil === PROFIL_DEFAUT) return new Set();
  const s = getStructure();
  const out = new Set();
  Object.keys(FRAMES).forEach(fk => {
    (FRAMES[fk].items || []).forEach(it => {
      const ov = itemProfilOverride(it.key, profil);
      if (ov && ov.diff === "remove") out.add(it.key);
    });
  });
  return out;
}
function countAll(n) {
  const s = getStructure();
  const hidden = s.hiddenItems || [];
  const removed = removedKeysForProfil(profilOf(n)); // [atelier RS] items retirés pour ce profil
  const customKeys = Object.values(s.customItems || {}).flat().map(it => it.key);
  // [atelier RS] ne compter que les items visibles pour le profil (items taggés d'un autre profil exclus)
  const baseKeys = ALL_ITEMS.filter(it => visibleForProfil(it, profilOf(n))).map(it => it.key);
  const allKeys = baseKeys.concat(customKeys).filter(k => !hidden.includes(k) && !removed.has(k));
  // Clés comptées via colonnes (Formation Pennylane ou cadres à colonnes, ex. checklist de contrôle) ;
  // toutes les autres via la case unique. On mémorise les colonnes par clé.
  const colsByKey = {};
  // Checklist post-cadrage à part : comme countFrame, on compte la colonne de CELUI QUI REGARDE.
  // Sans ça la barre du dashboard exigeait les 2 colonnes pendant que le compteur de l'onglet
  // n'en comptait qu'une, et les deux chiffres se contredisaient à l'écran.
  const chkKeys = {};
  Object.keys(FRAMES).forEach(fk => {
    const f = FRAMES[fk];
    if (f && f.checklist) { frameItems(fk).forEach(it => { chkKeys[it.key] = true; }); return; }
    const cols = frameColsFor(fk);
    if (cols) frameItems(fk).forEach(it => { colsByKey[it.key] = cols; });
  });
  const own = checklistOwnCol();
  return allKeys.filter(k => {
    if (chkKeys[k]) return itemRoleDone(n, k, own);
    return colsByKey[k] ? colsByKey[k].every(rc => itemRoleDone(n, k, rc.key)) : itemDone(n, k);
  }).length;
}
function totalAll(n) {
  const s = getStructure();
  const hidden = s.hiddenItems || [];
  const removed = removedKeysForProfil(profilOf(n)); // [atelier RS] items retirés pour ce profil
  const customKeys = Object.values(s.customItems || {}).flat().map(it => it.key);
  // [atelier RS] total limité aux items visibles pour le profil
  const baseKeys = ALL_ITEMS.filter(it => visibleForProfil(it, profilOf(n))).map(it => it.key);
  return baseKeys.concat(customKeys).filter(k => !hidden.includes(k) && !removed.has(k)).length;
}

function go(route) { location.hash = "#/" + route; }

// [atelier RS] Navigation INTERNE vers un bloc d'un autre onglet (ex. renvoyer un item
// du parcours RS vers le bloc de formation OB correspondant). Bascule d'onglet, déplie le
// cadre cible si besoin, défile dessus et le met en surbrillance brièvement.
function goFrame(id, tabKey, frameKey, itemKey) {
  if (isCollapsed(frameKey)) {                       // déplier avant le rendu du nouvel onglet
    COLLAPSED[frameKey] = false;
    try { localStorage.setItem("frame_collapsed", JSON.stringify(COLLAPSED)); } catch(e) {}
  }
  go('newcomer/' + id + '/' + tabKey);               // déclenche le rendu de l'onglet cible
  setTimeout(() => {
    // Si un item précis est visé, on défile dessus et on le surligne ; sinon on vise le cadre.
    const itemEl = itemKey ? document.querySelector('[data-frameroot="' + frameKey + '"] [data-item="' + itemKey + '"], [data-item="' + itemKey + '"][data-frame="' + frameKey + '"]') : null;
    const el = itemEl || document.querySelector('[data-frameroot="' + frameKey + '"]');
    if (!el) return;
    el.scrollIntoView({behavior:"smooth", block:itemEl?"center":"start"});
    el.style.transition = "box-shadow .3s";
    el.style.boxShadow = itemEl ? "inset 0 0 0 2px var(--green)" : "0 0 0 3px var(--green)";
    setTimeout(() => { el.style.boxShadow = ""; }, 1600);
  }, 90);
}

// [atelier RS] Navigation vers l'onglet « Mises en situation » (custom, sans cadre) en
// sélectionnant la bonne typologie (Compta / Gestion / Welcome / Suivi).

// eux-mêmes). On reste dans la vue timeline ; on défile vers la ligne cible et on la surligne.

// Migration : anciennes lignes custom stockées par newcomer (n.custom) → structure globale
function migrateCustomItems() {
  const d = loadData();
  let changed = false;
  (d.newcomers || []).forEach(n => {
    if (n.custom && Object.keys(n.custom).length) {
      if (!d.structure) d.structure = {};
      const s = d.structure;
      if (!s.customItems) s.customItems = {};
      Object.entries(n.custom).forEach(([fk, items]) => {
        if (!s.customItems[fk]) s.customItems[fk] = [];
        items.forEach(it => {
          if (!s.customItems[fk].some(x => x.key === it.key)) s.customItems[fk].push(it);
        });
      });
      delete n.custom;
      changed = true;
    }
  });
  if (changed) saveData(d);
}
