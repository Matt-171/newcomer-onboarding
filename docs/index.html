/* ============================================================
   IDENTIFICATION — pas de mot de passe, juste un nom (localStorage)
   ============================================================ */
const USER_KEY = "newcomer_onboarding_user";
function getUser() { return localStorage.getItem(USER_KEY) || ""; }
function setUser(name) { localStorage.setItem(USER_KEY, name); }
function ensureUser() {
  let u = getUser();
  while (!u || !u.trim()) {
    u = prompt("Bienvenue ! Identifie-toi pour suivre tes actions (ton prénom) :");
    if (u && u.trim()) { setUser(u.trim()); break; }
  }
  return getUser();
}
function changeUser() {
  const cur = getUser();
  const u = prompt("Change d'utilisateur (ton prénom) :", cur);
  if (u && u.trim()) { setUser(u.trim()); renderUserBadge(); render(); }
}
function renderUserBadge() {
  const el = document.getElementById("nav-user");
  if (!el) return;
  el.innerHTML = `<span class="brand-dot" style="background:var(--green);"></span>${esc(getUser()||"—")}`;
  if (fbAuthActive && authUser) {
    // identité fournie par Google → clic = déconnexion
    el.onclick = signOutUser;
    el.title = "Se déconnecter";
  } else {
    el.onclick = changeUser;
    el.title = "Changer d'utilisateur";
  }
  // "+ Nouveau newcomer" et "Gestion des droits" — selon permissions
  const navNew = document.getElementById("nav-new");
  if (navNew) navNew.style.display = hasPerm("create_newcomer") ? "" : "none";
  const navDroits = document.getElementById("nav-droits");
  if (navDroits) navDroits.style.display = hasPerm("manage_rights") ? "" : "none";
  const navDemo = document.getElementById("nav-demo");
  if (navDemo) navDemo.style.display = demoNewcomer() ? "" : "none";
}

  // --- OB blanc : cadre Script de présentation & posture (en tête) ---
  ob_blanc_script: { title:"Script de présentation & posture", editableDesc:true, noCheck:true, items:[
    {key:"obs_script", label:"Script de présentation", desc:"• Enregistrer la réunion / proposer le replay\n• Se présenter : interlocuteur principal durant l'accompagnement\n• Réunion de cadrage suivie d'une période d'adoption (1 à 1,5 mois)\n• Dispo par chat sur la plateforme ou par mail (aide et support / envoyer un message / service onboarding)\n• Points de suivi + point de validation qui clôture l'accompagnement\n• Équipe dédiée qui prend le relais ensuite\n• Ce qu'on va faire aujourd'hui (slide validation des paramétrages)"},
    {key:"obg_tour_table", label:"Tour de table", desc:"• Présentation du client, rôles, profil comptable ou non ?\n• Questions sur leur organisation : qui fait la TVA (cabinet ou eux) ? facturation sur PL ou importée ?\n• Qui utilisera l'outil au quotidien (rôle, maturité digitale) ? combien d'utilisateurs actifs ?\n• Des utilisateurs employés avec accès limités à créer (NDF, consultation) ?\n• Secteur d'activité et nature des flux (B2B, B2C, e-commerce, restauration…)"},
    {key:"obs_posture", label:"Posture formateur", desc:"• Aisance\n• Suivre la méthode\n• Capacité à recadrer un client\n• Capacité à s'adapter au besoin du client"},
    {key:"obg_fin_rdv", label:"Fin du RDV : récap et prise de RDV"},
  ]},

  // --- OB blanc : attendus (contenu à compléter) ---
  ob_blanc_gestion: { title:"OB blanc — Gestion : attendus", editableDesc:true, items:[
    {key:"obg_replay", label:"Enregistrer la réunion / proposer le replay"},
    {key:"obg_presentation", label:"Présentation OB", desc:"• Déroulé du point\n• Interlocuteur principal durant l'accompagnement\n• Période d'adoption et durée / points de suivi et point de validation\n• Dispo par chat sur la plateforme ou par mail\n• Équipe support dédiée par la suite / réponse en 5 min"},
    // Prérequis à qualifier (base checklist post-cadrage) — dimensions absentes des attendus ci-dessus
    {key:"obg_pre_usage", label:"Prérequis — Usage général de l'outil", desc:"• Facturation sur Pennylane ou autre logiciel ?\n• Achats / dépenses fournisseurs sur Pennylane ?\n• Suivi de trésorerie ?\n• Module de pilotage / analytique ?\n• Notes de frais ?\n• Facturation électronique (PDP) ?\n• Compte Pro Pennylane ?"},
    {key:"obg_pre_reprise", label:"Prérequis — Reprise de la donnée", desc:"• Factures clients ouvertes à reprendre ?\n• Catalogue produits / services à importer ?\n• Liste clients et fournisseurs disponible ?\n• Devis en cours à basculer ?"},
    {key:"obg_pre_integrations", label:"Prérequis — Intégrations", desc:"• Outils métier à connecter (caisse, e-commerce, paie, facturation externe…) ?\n• Ces intégrations sont-elles disponibles sur Pennylane ?\n• Qui gère la configuration côté client ?"},
    {key:"obg_pre_pilotage", label:"Prérequis — Besoins en pilotage", desc:"• Suivi de trésorerie ?\n• Besoins en analytique (axes, centres de coût) ?\n• Prévisionnel à configurer ?"},
    {key:"obg_pre_planning", label:"Prérequis — Planning opérationnel", desc:"• Date de démarrage cible ?\n• Format d'onboarding retenu (durée, distanciel/présentiel) ?\n• Premiers cas d'usage à couvrir en priorité ?\n• KPIs d'activation clairs (1ère facture, banque connectée, 1er règlement fournisseur) ?"},
  ]},

  // --- Méthode OB (déroulé détaillé) — BROUILLON admin, source Notion "Aide Déroulé OB" ---
  meth_avant: { title:"Avant la rencontre", editableDesc:true, noCheck:true, items:[
    {key:"meth_prep", label:"Préparation", desc:"• Email Welcome (lien affilié Pennylane Academy) pour l'encourager à paramétrer données entreprise, bancaires, importer transactions et factures\n• Type de client (Chat, SSU, CI, GA)\n• MRR (pour définir si OB poussé ou non)\n• Commentaires du Sales dans la fiche client\n• Googler le client / LinkedIn (profil, expérience, entreprise)"},
    {key:"meth_param_verif", label:"Paramètres société à vérifier", desc:"• Avis INSEE, logo entreprise\n• IBAN avec BIC (pas récupéré à la connexion des comptes, nécessaire à la déc. TVA)\n• Modèles de factures actuelles\n• Attention : compta de trésorerie ou d'engagement\n• Plan de facturation"},
  ]},
  meth_rencontre: { title:"Rencontre client — présentation", editableDesc:true, noCheck:true, items:[
    {key:"meth_script", label:"Script de présentation", desc:"• Enregistrer la réunion / proposer le replay\n• Interlocuteur principal durant l'accompagnement\n• Réunion de cadrage suivie d'une période d'adoption (1 à 1,5 mois)\n• Dispo par chat sur la plateforme ou par mail (aide et support / envoyer un message / service onboarding)\n• Points de suivi + point de validation qui clôture l'accompagnement\n• Équipe dédiée qui prend le relais ensuite\n• Présentation du client, rôles, profil comptable ou non ?\n• Organisation : qui fait la TVA (cabinet ou eux) ? facturation sur Pennylane ou importée ?"},
    {key:"meth_slide", label:"Présentation de la slide", desc:"Rencontre GA : info sur le déroulé de l'OB / Tour de table / besoins du client / formation outil côté gestion / Questions / Email récapitulatif\nRencontre CI : Tour de table / Présentation des paramètres / Transactions, Achats et Ventes / Pilotage de trésorerie / Questions"},
  ]},
  meth_param: { title:"1 — Paramètres", editableDesc:true, noCheck:true, items:[
    {key:"meth_p_intro", label:"Entrée dans le logiciel", desc:"Si le client part dans tous les sens, recadrer : « pour telle fonctionnalité on le verra après, finissons la partie param ». Roue crantée → le client complète les informations."},
    {key:"meth_p_entreprise", label:"Informations entreprise", desc:"En GA : pas besoin d'en parler si déjà rempli.\n• Général : coordonnées de l'entreprise\n• Tenue comptable : exercices à définir, à clôturer, possibilité de figer la compta pour les exercices non clos\n• Fiscal : régime fiscal et TVA\n• Répartition du capital\n• Actions : archivage, restauration, suppression multiple (remise à 0 = pas en visu chez le client)"},
    {key:"meth_p_banques", label:"Comptes bancaires", desc:"Permet d'importer les transactions bancaires. Banque non référencée → création manuelle → pas de transmission auto → import manuel des relevés.\n• Déconnexion 90 jours\n• Délai de 24h entre la banque et Pennylane\n• Liaison des banques (prestataire de connexion ou EBICS avec cabinet) + présentation du compte pro (et CB)"},
    {key:"meth_p_transmission", label:"Transmission des factures", desc:"Ne pas passer sur toutes ; demander au client s'il utilise Google Drive / Dropbox / Qonto, sinon on laisse.\n• Application mobile (photos + documents)\n• Adresse email dédiée (suppliers / customers)\n• Qonto (justificatifs d'achats rattachés au compte)\n• Google Drive / Dropbox entreprise\n• Connecteurs prestataires (EDF, SFR, Orange…)\n• Logiciels de facturation (Sellsy, Zoho, Axonaut, Chargebee, Harvest)"},
    {key:"meth_p_facturation", label:"Facturation client", desc:"Documents et modèle : type de docs, numérotation (ex. « F-(année)- »), personnalisation (logo, couleur, intitulés), info générale, pieds de page.\nPaiement : IBAN principal ; méthodes E-virement (facture payable directement par email), prélèvement SEPA, Stripe (CB).\nEmails : modèle programmé pour l'envoi des documents de vente.\nAnnexes : documents joints (CGV, contrats…).\nRelances d'impayés : « êtes-vous intéressé par la relance client ? » sinon on n'insiste pas ; séquences d'envoi (auto = pas envoyée si payée, sinon manuel)."},
    {key:"meth_p_equipe", label:"Gestion de l'équipe", desc:"Demander s'il y aura d'autres utilisateurs (si pas eu l'info en début de réunion).\n• Utilisateurs : ajout + attribution des rôles\n• Équipes : création d'équipes et circuit de validation (notes de frais, bientôt les achats)"},
    {key:"meth_p_categories", label:"Catégories", desc:"2 types :\n• Prévisionnelles (revenu / dépense) → analyse du plan de trésorerie. Conseil : ne pas toucher aux catégories virements internes et en attente de catégorisation.\n• Analytiques (comptabilité) → affecter des catégories indépendamment du type de mouvement (marge produit, secteur…).\nAjout de familles illimité."},
    {key:"meth_p_regles", label:"Centre de règles", desc:"Mettre en place les règles de transaction, fournisseurs et clients. À voir dans le module achat et transaction."},
    {key:"meth_p_ged", label:"Activation de la GED", desc:"Dans dossier client. En GA : c'est le comptable qui verra ça avec lui ?"},
  ]},
  meth_transactions: { title:"2 — Transactions", editableDesc:true, noCheck:true, items:[
    {key:"meth_t_intro", label:"Présentation", desc:"• Indicateurs / chiffres-clés\n• Cadres : solde des comptes bancaires, solde des demandes comptables, suggestions de rapprochements\n• Statuts des transactions (justifié ou non, demande comptable)\n• Filtres, raccourcis, affichage des colonnes"},
    {key:"meth_t_traitement", label:"Traitement d'une transaction", desc:"• Ajouter / modifier fournisseurs, clients\n• Rapprocher avec un justificatif (facture) ou définir comme facultatif / perdu\n• Rapprochement suggéré\n• Plusieurs catégories (même famille ou différente)\n• Commentaire + mention d'utilisateurs avec @nom\n• Détection des doublons\n• Traitement des transactions en masse"},
    {key:"meth_t_regles", label:"Paramètres — Centre de règles", desc:"Créer des règles de transactions bancaires pour automatiser l'ajout d'une catégorie ou l'obligation de justificatif ; la vérification peut être outrepassée ou obligatoire."},
  ]},
  meth_achats: { title:"3 — Gérer les achats", editableDesc:true, noCheck:true, items:[
    {key:"meth_a_factures", label:"Factures d'achat", desc:"• Statuts (boîte de réception, à payer, payée, toutes), filtres, raccourcis\n• Traitement : vérifier les données (montant, TVA, fournisseur, dates), marquer à payer/payée, rapprocher (loupe) avec une transaction, catégories, commentaire @\n• Paiement fournisseur : sélectionner les factures, payer par Qonto ou XML\n• Centre de règles : règles de facture ou de transaction"},
    {key:"meth_a_ndf", label:"Notes de frais", desc:"Remboursement des frais des collaborateurs :\n• Importer une dépense (fichier ou photo appli)\n• Corriger l'OCR si besoin, indiquer le motif\n• Soumettre au valideur → statut à rembourser\n• Payer comme une facture d'achat\nChoisir le collaborateur (met automatiquement l'équipe)."},
    {key:"meth_a_km", label:"Frais kilométriques (dans notes de frais)", desc:"• Type de véhicule + puissance fiscale\n• Raison du déplacement\n• Déclaration en itinéraire ou en km\n• Indemnité calculée automatiquement (barème fiscal)\n• Payé comme une note de frais"},
    {key:"meth_a_demande", label:"Demande d'achat", desc:"Demander un remboursement ou l'autorisation de dépense."},
    {key:"meth_a_fournisseur", label:"Fournisseur", desc:"Visibilité des fiches fournisseurs, modification si besoin."},
  ]},
  meth_ventes: { title:"4 — Gérer les ventes", editableDesc:true, noCheck:true, items:[
    {key:"meth_v_facture", label:"Facture de vente", desc:"Statuts (à venir, en retard, encaissé, brouillon, proforma…), filtres, raccourcis."},
    {key:"meth_v_devis", label:"Établir un devis", desc:"• Nouveau devis → client, dates échéance/émission, produit\n• Champs additionnels (titres, mentions, remise…)\n• Enregistrer, marquer accepté/refusé\n• Convertir en facture (acompte, intermédiaire, solde)"},
    {key:"meth_v_traitement", label:"Traitement d'une facture de vente", desc:"• Créer depuis un devis ou « nouvelle facture »\n• Enregistrer en brouillon (pas validé) puis finaliser → génération définitive + comptabilisation\n• Attention : une fois finalisée, non modifiable\n• Envoi au client par email automatique → classée dans « À venir »"},
    {key:"meth_v_abonnement", label:"Abonnement", desc:"Facturation périodique automatique. Import des abonnements possible."},
    {key:"meth_v_produits", label:"Produits", desc:"• Import de la liste via la plateforme\n• Nouveau produit : nom, description\n• Variables : {{mois}}, {{moisPrécédent}}, {{moisSuivant}}\n• Unité, prix, devise, TVA, prix TTC, type, référence, identifiant\n• Téléchargement de la liste possible"},
    {key:"meth_v_clients", label:"Clients", desc:"• Import de la liste via la plateforme\n• Nouveau client : particulier ou entreprise (SIREN/SIRET/raison sociale, accès base SIREN)\n• Compléter la fiche client\n• Téléchargement de la liste possible"},
    {key:"meth_v_relances", label:"Relance en attente", desc:"Relances clients : à valider avant envoi (si option validation cochée) ou automatiques (si option auto cochée dans la séquence)."},
  ]},
  meth_pilotage: { title:"5 — Pilotage et trésorerie", editableDesc:true, noCheck:true, items:[
    {key:"meth_pi_categories", label:"Catégories", desc:"Famille de catégorie = un titre. 2 types : prévisionnelles (revenu/dépense, plan de tréso) et analytiques (compta). Ajout de familles illimité."},
    {key:"meth_pi_parametrage", label:"Paramétrage des catégories", desc:"• Comptabilité analytique\n• Gérer un prévisionnel\nPlusieurs catégories possibles sur une transaction ou un achat (ventilation)."},
    {key:"meth_pi_treso_indic", label:"Plan de trésorerie — indicateurs", desc:"• Solde de trésorerie à date\n• Encaissements / décaissements sur 30 jours glissants\n• Encaissements = somme des règlements perçus ; Décaissements = somme des paiements\n• Si 3 derniers mois ENCAISSEMENT > DÉCAISSEMENT → Variation de trésorerie (moyenne de l'écart)\n• Si DÉCAISSEMENT > ENCAISSEMENT → Cashburn (perte mensuelle) et Runway (mois avant épuisement)"},
    {key:"meth_pi_treso_graph", label:"Plan de trésorerie — graphique & prévisionnel", desc:"• Histogramme : solde, décaissements, encaissements ; courbe = prévisionnel ; barre noire = objectif réalisé\n• 3 points sur la ligne grise → fenêtre à droite pour le prévisionnel des mois suivants\n• Programmer : somme sur 12 mois OU « faire évoluer ce montant » (+/-, % ou €, sur X mois)\n• Tableau bas (revenus/dépenses) : 1re ligne = réel, 2e ligne grise = prévisionnel\n• Pastilles : rouge (gros dépassement), orange (petit dépassement), verte (objectif atteint)"},
    {key:"meth_pi_rapport", label:"Rapport analytique", desc:""},
  ]},
  meth_ci: { title:"Spécifique CI — Saisie / Transactions / TVA", editableDesc:true, noCheck:true, items:[
    {key:"meth_ci_saisie", label:"Point saisie factures", desc:"• 2 statuts : À traiter et Pré-traité\n• Compte de charge par défaut 6288, ventilation possible (plusieurs comptes)\n• Taux multiples, réconciliation\n• Voir toutes les écritures liées (facture, transaction, OD de RT)\n• Onglet « activité » : actions et modifs\n• Paiement : génère un fichier XML, paiement en masse"},
    {key:"meth_ci_transactions", label:"Point transactions", desc:"• Quand les transac remontent, la contrepartie du 512 part en compte d'attente (sauf règles)\n• Réconciliation : pièces comptables, suggestions, création de règles (salaire, mutuelle), modif directe du champ contrepartie (ventilation via les 3 points)\n• Rapprochement bancaire : import du relevé PDF (justif), ajout de transactions manquantes, dé-rapprochement, une fois rapproché la ligne est verrouillée (logo, non archivable)"},
    {key:"meth_ci_tva", label:"Point TVA", desc:"• Reprises : lignes non exigibles en compte d'attente ; OD manuelles vers TVA exigible ; importance du lettrage des comptes de TVA\n• Transactions non justifiées : remplir les éléments manquants / juste ajouter le taux\n• Analyse compte clients : TVA théorique (attention aux imports)\n• Historique des déclarations : conseiller de resaisir pour le cadrage annuel\n• Cadrage annuel : colonne N/A → retrouver l'écriture pour corriger le taux\n• Déclaration : œil pour voir les comptes alimentant chaque champ ; préfixe « P » = exercice antérieur ; si modif du montant → modifier aussi l'OD de TVA"},
  ]},
  meth_fin: { title:"Fin de la réunion", editableDesc:true, noCheck:true, items:[
    {key:"meth_f_suivi", label:"Clôture", desc:"• Prévoir une date pour le point de suivi\n• Le client peut envoyer une liste de questions 3 jours avant\n• Prévoir le point de validation (si congés, +15j)\n• Envoyer le mail récapitulatif\n• Passer en adoption (Salesforce)"},
  ]},
  meth_posture: { title:"Posture & pièges (retours OB blanc)", editableDesc:true, noCheck:true, items:[
    {key:"meth_po_posture", label:"Posture", desc:"• Intro « top », dire « période d'adoption » (1 à 1,5 mois)\n• Ne pas lire la checklist à voix haute\n• Éviter « vite fait », « éléments basiques » → dire « éléments synthétiques »\n• Tenir sa méthodo, ne pas dévisser\n• Pas trop scolaire : se concentrer sur les questions et besoins du client, pas tout recracher\n• Tour de table : recadrer sur leur fonctionnement (pas la vie de l'entreprise)"},
    {key:"meth_po_pieges", label:"Réponses aux pièges", desc:"• « Je n'ai pas l'information, je la note et je vous l'envoie dans un mail récap »\n• « Je n'ai pas cette info, est-ce que toi [mentor] tu as une solution ? »\n• Dans la fiche client : indiquer le RIB souhaité pour être payé\n• Catégories analytiques : expliquer d'abord les 2 grandes familles, laisser le client dire ce qu'il veut puis montrer comment faire"},
  ]},
};

/* ============================================================
   DROITS D'ACCÈS — rôles TL / MENTOR / NEWCOMER (par email @pennylane.com)
   Défaut = NEWCOMER. TL et MENTOR = listes ci-dessous, + overrides globaux (modifiables).
   Les onglets "Démarrage" et "Accès outils" sont réservés au rôle TL.
   ============================================================ */
const ACCESS_DEFAULTS = {
  admin: ["matthieu.tabareau"], // Admin = tous droits TL + prévisualisation (impersonation)
  tl: ["jonathan.knaus", "jezabel.legrand", "valentin.guilbert", "antonio.pereira"],

};
const TL_ONLY_TABS = new Set(["demarrage", "acces"]); // onglets réservés aux TL (et Admin)
function emailLocalPart(email) { return (email || "").toLowerCase().split("@")[0]; }
// Rôle d'un email : override global prioritaire, sinon listes par défaut, sinon newcomer
function roleForEmail(email) {
  const lp = emailLocalPart(email);
  if (!lp) return "newcomer";
  const ov = (getStructure().accessRoles || {})[lp];
  if (ov) return ov;
  if ((ACCESS_DEFAULTS.admin || []).includes(lp)) return "admin";
  if (ACCESS_DEFAULTS.tl.includes(lp)) return "tl";
  if (ACCESS_DEFAULTS.mentor.includes(lp)) return "mentor";
  return "newcomer";
}
// Impersonation (prévisualisation par le vrai TL) — LOCAL, non partagé
let impersonateEmail = null;
try { impersonateEmail = sessionStorage.getItem("impersonate") || null; } catch(e) { impersonateEmail = null; }
// Le vrai email de session (jamais impersoné) — sert à autoriser l'impersonation
function realEmail() {
  if (!fbAuthActive || !authUser) return null; // mode local dev
  return authUser.email;
}
// Le vrai rôle de session (jamais impersoné)
function realRole() {
  const e = realEmail();
  if (!e) return "admin"; // mode local dev = admin (tous droits)
  return roleForEmail(e);
}
/* Droit de prévisualiser. Évalué sur le VRAI rôle, jamais sur le rôle impersoné : sinon on
   pourrait prendre l'identité d'un admin pour s'octroyer des droits, et l'escalade serait
   ouverte. Avant le 31/08/2026 ces gardes étaient codées en dur sur realIsAdmin(), ce qui
   rendait la permission « Prévisualiser » décorative : la cocher pour un TL ou un mentor ne
   changeait rien, et le bouton restait invisible. */
function canImpersonate() { return roleHasPerm(realRole(), "impersonate"); }
/* On ne peut prévisualiser qu'un rôle STRICTEMENT moins doté que le sien. Sans cette borne, un
   mentor autorisé à prévisualiser pourrait prendre l'identité d'un admin : currentRole() suit
   la personne simulée, donc il en récupérerait tous les droits, gestion des droits comprise.
   Observateur et newcomer sont au même niveau, aucun des deux n'a de droit d'écriture. */
const IMPERSONATE_RANK = {newcomer:0, observateur:0, mentor:1, tl:2, admin:3};
function canImpersonateRole(targetRole) {
  if (!canImpersonate()) return false;
  const mine = IMPERSONATE_RANK[realRole()] ?? 0;
  const theirs = IMPERSONATE_RANK[targetRole] ?? 0;
  return theirs < mine;
}
// Email "effectif" : celui qu'on simule si impersonation active (réservé à l'admin), sinon le vrai
function effectiveEmail() {
  if (impersonateEmail && canImpersonate()) return impersonateEmail;
  return realEmail();
}
function setImpersonate(email) {
  if (!canImpersonate()) return; // selon la permission « Prévisualiser », pas selon le rôle
  impersonateEmail = email || null;
  try { email ? sessionStorage.setItem("impersonate", email) : sessionStorage.removeItem("impersonate"); } catch(e) {}
}
function currentRole() {
  const e = effectiveEmail();
  if (!e) return "admin"; // mode local (dev) = accès complet
  return roleForEmail(e);
}
// Admin a tous les droits TL. isTL() = TL ou Admin (sauf en impersonation d'un rôle inférieur).
function isAdmin() { return currentRole() === "admin"; }
function isTL() { return currentRole() === "tl" || currentRole() === "admin"; }
function isMentor() { return currentRole() === "mentor"; }
// Garde : bloque une action réservée aux TL/Admin (renvoie true si autorisé)
function requireTL() {
  if (isTL()) return true;
  toast("Action réservée aux TL");
  return false;
}
// Garde générique par permission (renvoie true si autorisé)
function requirePerm(permKey) {
  if (hasPerm(permKey)) return true;
  toast("Action non autorisée pour votre rôle");
  return false;
}
function isNewcomerRole() { return currentRole() === "newcomer"; }
/* --- ANNUAIRE DES ENCADRANTS ---
   Alimente les sélecteurs TL et Mentors. Sources, par ordre de qualité du nom affiché :
   1. structure.logins (les gens qui se sont connectés) → vrai nom Google
   2. ACCESS_DEFAULTS et les overrides de rôle → nom reconstruit depuis le local-part
   Un TL peut aussi être mentor, d'où sa présence dans les deux listes. */
function prettyNameFromLocalPart(lp) {
  return String(lp).split(/[.\-]/).filter(Boolean)
    .map(x => x.charAt(0).toUpperCase() + x.slice(1)).join(" ");
}
function knownPeople() {
  const s = getStructure();
  const logins = s.logins || {};
  const byLp = new Map();
  Object.keys(logins).forEach(lp => byLp.set(lp, {lp, name: logins[lp].name || prettyNameFromLocalPart(lp)}));
  const declared = (ACCESS_DEFAULTS.admin || [])
    .concat(ACCESS_DEFAULTS.tl || [], ACCESS_DEFAULTS.mentor || [], Object.keys(s.accessRoles || {}));
  declared.forEach(lp => { if (lp && !byLp.has(lp)) byLp.set(lp, {lp, name: prettyNameFromLocalPart(lp)}); });
  return [...byLp.values()]
    .map(p => ({...p, role: roleForEmail(p.lp + "@pennylane.com")}))
    .sort((a, b) => a.name.localeCompare(b.name, "fr"));
}
function tlCandidates()     { return knownPeople().filter(p => p.role === "tl" || p.role === "admin"); }
function mentorCandidates() { return knownPeople().filter(p => ["mentor", "tl", "admin"].includes(p.role)); }

/* Sélecteur TL : liste déroulante. La valeur déjà enregistrée est toujours proposée, même si la
   personne n'est plus TL — sinon éditer une fiche effacerait silencieusement l'information. */
function tlSelectHtml(id, current) {
  const cur = current || "";
  const noms = tlCandidates().map(p => p.name);
  if (cur && !noms.includes(cur)) noms.unshift(cur);
  return `<select id="${id}">
      <option value="">— aucun —</option>
      ${noms.map(x => `<option value="${esc(x)}" ${x === cur ? "selected" : ""}>${esc(x)}</option>`).join("")}
    </select>`;
}
/* Sélecteur Mentors : plusieurs choix possibles, en cases à cocher plutôt qu'un select multiple,
   qui impose un ctrl+clic que personne ne devine. */
function referentsPickerHtml(id, current) {
  const sel = Array.isArray(current) ? current : (current ? [current] : []);
  const noms = mentorCandidates().map(p => p.name);

  d.structure.logins[lp] = entry;
  localStorage.setItem(STORE_KEY, JSON.stringify(d));
  // Écriture Firebase CIBLÉE : les clés RTDB interdisent le point → on encode (tiphanie.sauret → tiphanie,sauret).
  // Écriture atomique par child (ne réécrit pas tout le document, évite d'écraser une connexion concurrente).
  if (fbRef) {
    fbRef.child("structure/logins/" + encodeKey(lp)).set(entry)
      .catch(e => console.warn("recordLogin échoué :", e.message));

// --- Clés Firebase : le point (et . $ # [ ] /) est interdit dans une clé RTDB.
// Les maps indexées par local-part d'email (logins, accessRoles) contiennent des points → on encode le point en virgule.
function encodeKey(k) { return String(k).replace(/\./g, ","); }
function decodeKey(k) { return String(k).replace(/,/g, "."); }
function encodeKeyedMap(m) { const o = {}; if (m) Object.keys(m).forEach(k => o[encodeKey(k)] = m[k]); return o; }
function decodeKeyedMap(m) { const o = {}; if (m) Object.keys(m).forEach(k => o[decodeKey(k)] = m[k]); return o; }

function getStructure() {
  if (!DATA.structure) DATA.structure = {};
  const s = DATA.structure;
  if (!s.frameOrder) s.frameOrder = {};
  if (!s.itemOrder) s.itemOrder = {};
  if (!s.customFrames) s.customFrames = {};
  if (!s.customItems) s.customItems = {};
  if (!s.hiddenItems) s.hiddenItems = [];
  if (!s.roles) s.roles = DEFAULT_ROLES.slice();
  return s;
}
function saveStructure(mutator) {
  const d = loadData();
  if (!d.structure) d.structure = {};
  const s = d.structure;
  if (!s.frameOrder) s.frameOrder = {};
  if (!s.itemOrder) s.itemOrder = {};
  if (!s.customFrames) s.customFrames = {};
  if (!s.customItems) s.customItems = {};
  if (!s.hiddenItems) s.hiddenItems = [];
  if (!s.roles) s.roles = DEFAULT_ROLES.slice();
  mutator(s);
  saveData(d);
}
// Définition d'un cadre (codé en dur OU custom)
function frameDef(frameKey) {
  if (FRAMES[frameKey]) return FRAMES[frameKey];
  const cf = getStructure().customFrames[frameKey];
  if (cf) return {title: cf.title, editableDesc:true, items:[], custom:true};
  return null;
}
// Liste ordonnée des cadres d'un onglet (base + ajouts, selon frameOrder)
function tabFrameKeys(tab) {
  if (!tab.frames) return [];
  const s = getStructure();
  const ordered = s.frameOrder[tab.key];
  if (ordered && ordered.length) {
    // garder ceux qui existent encore (base ou custom)
    const kept = ordered.filter(fk => FRAMES[fk] || s.customFrames[fk]);
    // Ajouter les cadres de base ajoutés au code APRÈS la sauvegarde de l'ordre (sinon invisibles).
    const missing = (tab.frames || []).filter(fk => !kept.includes(fk));
    return kept.concat(missing);
  }
  return tab.frames.slice();
}
// Liste ordonnée des items d'un cadre (base + customItems, selon itemOrder, moins les masqués)
function frameItems(frameKey) {
  const def = frameDef(frameKey);
  const base = def ? (def.items || []) : [];
  const s = getStructure();
  const hidden = (s.hiddenItems || []);
  const customs = (s.customItems[frameKey] || []).map(c => ({...c, custom:true}));
  const all = base.concat(customs).filter(it => !hidden.includes(it.key));
  const order = s.itemOrder[frameKey];
  if (order && order.length) {
    const byKey = {}; all.forEach(it => byKey[it.key] = it);
    const ordered = order.map(k => byKey[k]).filter(Boolean);
    // ajouter ceux absents de l'ordre (nouveaux) à la fin
    all.forEach(it => { if (!order.includes(it.key)) ordered.push(it); });
    return ordered;
  }
  return all;
}

/* ============================================================
   PERSISTANCE — Firebase (partagé) avec repli localStorage
   - DATA : copie en mémoire, source de vérité pour le rendu synchrone.
   - Si Firebase configuré : push à chaque save + listener temps réel.
   - Sinon : localStorage (données locales au navigateur).
   ============================================================ */
const STORE_KEY = "newcomer_onboarding_v1";
let DATA = {newcomers:[], seq:0};
let fbRef = null;            // référence Realtime Database
let fbReady = false;         // true quand le 1er snapshot est reçu
let applyingRemote = false;  // évite la boucle save->listener->save

function firebaseEnabled() {
  return !!(window.FIREBASE_CONFIG && window.FIREBASE_CONFIG.databaseURL);
}

function loadLocal() {
  try { return normalizeData(JSON.parse(localStorage.getItem(STORE_KEY))); }
  catch(e) { return {newcomers:[], seq:0}; }
}

// Normalise l'état : Firebase peut renvoyer 'newcomers' en tableau avec trous (null) ou en objet indexé.
// On garantit un vrai tableau sans null, et un seq cohérent.
function normalizeData(val) {
  if (!val || typeof val !== "object") return {newcomers:[], seq:0};
  // Source prioritaire : newcomersById (nouveau format objet) ; sinon newcomers (ancien format)
  let ncs;
  if (val.newcomersById && typeof val.newcomersById === "object") {
    ncs = Object.values(val.newcomersById).filter(Boolean);
  } else {
    ncs = val.newcomers;
    if (Array.isArray(ncs)) ncs = ncs.filter(Boolean);        // retire les trous (null)
    else if (ncs && typeof ncs === "object") ncs = Object.values(ncs).filter(Boolean); // objet indexé → tableau
    else ncs = [];
  }
  ncs.sort((a,b) => (a.id||0) - (b.id||0));
  const maxId = ncs.reduce((m, n) => Math.max(m, n && n.id ? n.id : 0), 0);
  const seq = Math.max(val.seq || 0, maxId);
  const out = {...val, newcomers: ncs, seq};
  delete out.newcomersById; // en mémoire on ne garde que le tableau
  // Décodage des clés encodées pour Firebase (virgule → point) sur les maps par local-part.
  if (out.structure) {
    const st = {...out.structure};
    if (st.logins) st.logins = decodeKeyedMap(st.logins);
    if (st.accessRoles) st.accessRoles = decodeKeyedMap(st.accessRoles);
    out.structure = st;
  }
  return out;
}

// API conservée : loadData() renvoie la copie mémoire, saveData() persiste.
function loadData() { return DATA; }
let pendingLocalEcho = false;     // true entre notre écriture et la réception de son écho Firebase
let pendingRemoteRender = false;  // un changement distant est arrivé pendant qu'une modale était ouverte
function saveData(d) {
  DATA = d;
  localStorage.setItem(STORE_KEY, JSON.stringify(d)); // cache local toujours
  if (fbRef && !applyingRemote) {
    // 'newcomers' poussé comme OBJET indexé par id (évite les tableaux à trous quand les id ne partent pas de 0)
    const newcomersById = {};
    (d.newcomers || []).forEach(n => { if (n && n.id != null) newcomersById[n.id] = n; });
    // Structure à écrire — SANS 'logins' : le journal des connexions n'est JAMAIS réécrit par
    // l'enregistrement global (il serait écrasé par une copie locale périmée d'un autre client).
    // Seul recordLogin écrit logins, en chemin ciblé (structure/logins/<clé encodée>).
    const st = {...(d.structure || {})};
    delete st.logins;
    if (st.accessRoles) st.accessRoles = encodeKeyedMap(st.accessRoles); // clés RTDB sans point
    pendingLocalEcho = true;
    // update() cible chaque nœud sans remplacer tout le document → préserve structure/logins.
    Promise.all([
      fbRef.update({ seq: d.seq || 0, newcomersById, newcomers: null }),
      fbRef.child("structure").update(st),
    ])
      .then(() => { pendingLocalEcho = false; })
      .catch(e => { pendingLocalEcho = false; console.warn("Firebase save échoué :", e.message); });
  }
}

const ALLOWED_DOMAIN = "@pennylane.com";
let authUser = null;      // utilisateur Firebase connecté (ou null)
let dbStarted = false;    // listener DB déjà branché
let fbAuthActive = false; // true seulement si Firebase + Auth réellement dispo

// Initialise Firebase + authentification. Résout quand l'état d'auth est connu.
function initStorage() {
  return new Promise(resolve => {
    if (!firebaseEnabled() || typeof firebase === "undefined" || !firebase.auth) {
      DATA = loadLocal();   // SDK indisponible → repli local, pas d'auth exigée
      resolve();
      return;
    }
    try {
      firebase.initializeApp(window.FIREBASE_CONFIG);
      fbAuthActive = true;
      firebase.auth().onAuthStateChanged(user => {
        if (user && user.email && user.email.toLowerCase().endsWith(ALLOWED_DOMAIN)) {
          authUser = user;
          setUser(user.displayName || user.email.split("@")[0]);
          renderAuthGate();
          // Affichage instantané depuis le cache local, puis rafraîchissement DB en arrière-plan
          DATA = loadLocal();
          if (!fbReady) { fbReady = true; resolve(); }
          startDbListener(); // le listener re-render quand les données fraîches arrivent
        } else {
          if (user) { firebase.auth().signOut(); authUser = null; } // domaine non autorisé
          else authUser = null;
          renderAuthGate();
          if (!fbReady) { fbReady = true; resolve(); } // pas connecté : résoudre pour afficher le login
        }
      });
    } catch(e) {
      console.warn("Init Firebase échouée, repli localStorage :", e.message);
      fbAuthActive = false;
      DATA = loadLocal();
      resolve();
    }
    // Filet de sécurité : si l'auth ne répond pas en 8s, on ne bloque pas indéfiniment
    setTimeout(() => { if (!fbReady) { fbReady = true; resolve(); } }, 8000);
  });
}

// Branche le listener temps réel (uniquement une fois connecté)
// onFirstSnap : callback appelé au premier snapshot reçu (données prêtes)
function startDbListener(onFirstSnap) {
  if (dbStarted) { if (onFirstSnap) onFirstSnap(); return; }
  dbStarted = true;
  fbRef = firebase.database().ref("appData");
  let firstSnap = true;
  fbRef.on("value", snap => {
    const val = snap.val();
    if (firstSnap) {
      firstSnap = false;
      applyingRemote = true;
      DATA = normalizeData(val);
      localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
      applyingRemote = false;
      runMigrations();   // migrations one-shot (ex. reset ordre onglet Formation)
      recordLogin();
      if (onFirstSnap) onFirstSnap();
      render(); setSyncBadge(true);
      return;
    }
    setSyncBadge(true);
    // Si une écriture locale est en attente d'écho, on ignore les snapshots jusqu'à réception
    // du nôtre (évite qu'un snapshot en retard écrase notre modif). L'echo de notre écriture
    // porte le même contenu que DATA courant → on ne fait rien.
    const incomingNorm = JSON.stringify(normalizeData(val));
    if (incomingNorm === JSON.stringify(DATA)) { pendingLocalEcho = false; return; } // identique → rien à faire
    if (pendingLocalEcho) return; // snapshot en retard pendant qu'on attend notre écho → ignorer
    // Vrai changement distant : appliquer
    applyingRemote = true;
    DATA = normalizeData(val);
    localStorage.setItem(STORE_KEY, JSON.stringify(DATA));
    applyingRemote = false;
    const modalOpen = document.getElementById("modal").classList.contains("open");
    if (modalOpen) { pendingRemoteRender = true; return; }
    render();
  }, err => {
    console.warn("Firebase DB inaccessible :", err.message);
    if (onFirstSnap) onFirstSnap(); // ne pas bloquer si la DB échoue
  });
}

  const f = frameDef(frameKey); if (!f || f.noCheck) return {done:0,total:0};
  const items = frameItems(frameKey).filter(it => !it.heading); // les sous-titres ne comptent pas
  const cols = frameColsFor(frameKey);
  const done = cols
    ? items.filter(it => cols.every(rc => itemRoleDone(n, it.key, rc.key))).length
    : items.filter(it => itemDone(n, it.key)).length;

  return tabFrameKeys(tab).reduce((acc,fk) => {

  // Clés comptées via colonnes (Formation Pennylane ou cadres à colonnes, ex. checklist de contrôle) ;
  // toutes les autres via la case unique. On mémorise les colonnes par clé.
  const colsByKey = {};

// Migration : anciennes lignes custom stockées par newcomer (n.custom) → structure globale
function migrateCustomItems() {
  const d = loadData();
  let changed = false;
  (d.newcomers || []).forEach(n => {
    if (n.custom && Object.keys(n.custom).length) {
      if (!d.structure) d.structure = {};
      const s = d.structure;
      if (!s.customItems) s.customItems = {};
      Object.entries(n.custom).forEach(([fk, items]) => {
        if (!s.customItems[fk]) s.customItems[fk] = [];
        items.forEach(it => {
          if (!s.customItems[fk].some(x => x.key === it.key)) s.customItems[fk].push(it);
        });
      });
      delete n.custom;
      changed = true;
    }
  });
  if (changed) saveData(d);
}

        ? `<button class="btn btn-sm btn-outline" style="margin-left:6px;" onclick="unarchive(${n.id})">Désarchiver</button>`
        : `<button class="btn btn-sm btn-outline" style="margin-left:6px;" onclick="archive(${n.id})">Archiver</button>`) : ""}
      ${hasPerm("delete_newcomer") ? `<button class="btn btn-sm btn-danger-ghost" style="margin-left:6px;" onclick="confirmDeleteFromDash(${n.id})">Supprimer</button>` : ""}
    </td>
  </tr>`;
}

function tableBlock(title, list, archived) {
  if (!list.length) return "";
  const rows = list.map(n => newcomerRow(n, archived)).join("");
  return `<h2 style="font-size:0.95rem; font-weight:800; color:var(--teal-dark); text-transform:uppercase; letter-spacing:.5px; margin:28px 0 12px;">${title} <span style="color:var(--text-muted); font-weight:600;">(${list.length})</span></h2>
    <div class="card" style="padding:0; overflow:hidden;"><table>
      <thead><tr style="background:var(--teal-light); font-size:0.78rem; color:var(--teal-mid); text-transform:uppercase; letter-spacing:.6px;">
        <th>Nom</th><th>Rôle</th><th>TL</th><th>Référent</th><th>Arrivée</th><th style="min-width:160px;">Progression</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function renderDashboard() {
  DEMO_CONTEXT = false;
  renderUserBadge();   // la fiche démo a pu être créée ou retirée → lien de nav à réévaluer
  const d = loadData();
  // Un newcomer ne voit que sa propre fiche → redirection directe dessus
  if (isNewcomerRole()) {
    const own = ownNewcomer();
    if (own) { go("newcomer/" + own.id + "/" + firstAllowedTabKey()); return; }
    document.getElementById("app").innerHTML = `<div class="card" style="text-align:center; padding:60px; color:var(--text-muted);">
      <div style="font-size:1.4rem; margin-bottom:12px;">👋</div>
      <p style="font-size:1rem; font-weight:600; color:var(--teal-dark);">Bienvenue !</p>
      <p style="font-size:0.875rem; margin-top:6px;">Ta fiche d'onboarding n'est pas encore disponible.<br>Ton TL va la créer prochainement.</p>
      <p style="font-size:0.82rem; margin-top:14px; color:var(--text-muted);">Tu n'es pas en cours d'onboarding et tu veux juste consulter les supports ?<br>Demande l'accès <strong>Observateur</strong> à ton TL.</p>
    </div>`;
    return;
  }
  const all = d.newcomers.slice().sort((a,b) => (b.arrival_date||"").localeCompare(a.arrival_date||""));
  // La ou les fiches démo sortent de « En cours » : ce ne sont pas de vrais onboardings et
  // elles ne comptent pas dans le nombre d'actifs.
  const demos = all.filter(n => n.demo && !n.archived);
  const active = all.filter(n => !n.archived && !n.demo);
  const archived = all.filter(n => n.archived);

  const empty = `<div class="card" style="text-align:center; padding:60px; color:var(--text-muted); border:2px dashed var(--border);">
      <div style="width:48px; height:48px; background:var(--teal-light); border-radius:50%; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:1.4rem;">👋</div>
      <p style="font-size:1rem; font-weight:600; color:var(--teal-dark); margin-bottom:6px;">Aucun newcomer pour l'instant</p>
      <p style="font-size:0.875rem; margin-bottom:24px;">Crée ton premier profil pour commencer le suivi de l'onboarding.</p>
      <a class="btn btn-accent" onclick="go('new')">+ Créer le premier newcomer</a>
    </div>`;

  document.getElementById("app").innerHTML = `
    <div style="margin-bottom:8px;">
      <h1 style="font-size:1.75rem; font-weight:800; color:var(--teal-dark); letter-spacing:-0.5px;">Onboarding Newcomers</h1>
      <p style="color:var(--text-muted); margin-top:6px; font-size:0.875rem; font-weight:500;">${active.length} actif(s) · ${archived.length} archivé(s)</p>
    </div>
    ${all.length ? tableBlock("En cours", active, false) + tableBlock("Démo", demos, false) + tableBlock("Archivés", archived, true) : empty}
  `;
}

function archive(id) { if(!requirePerm("archive_newcomer"))return; setArchived(id, true); renderDashboard(); toast("Newcomer archivé"); }
function unarchive(id) { if(!requirePerm("archive_newcomer"))return; setArchived(id, false); renderDashboard(); toast("Newcomer désarchivé"); }
function confirmDeleteFromDash(id) {
  if(!requirePerm("delete_newcomer"))return;
  const n = getNewcomer(id);
  if (confirm(`Supprimer définitivement ${n ? n.name : "ce newcomer"} ? Cette action est irréversible.`)) {
    deleteNewcomer(id); renderDashboard(); toast("Newcomer supprimé");
  }
}

  document.getElementById("app").innerHTML = `

          </div>
        </div>
        <div><label>Date d'arrivée</label><input name="arrival_date" type="date"></div>
        <div><label>TL</label>${tlSelectHtml("f-tl", "")}</div>
        <div><label>Référent(s)</label>${referentsPickerHtml("f-referent", [])}</div>
        <div><label>Notes</label><textarea name="notes" rows="3" placeholder="Contexte, particularités..."></textarea></div>
        <div style="display:flex; gap:12px; justify-content:flex-end;">
          <a class="btn btn-outline" onclick="go('')">Annuler</a>
          <button type="submit" class="btn btn-accent">Créer et lancer l'onboarding</button>
        </div>
      </form>
    </div>`;

  const nameEl = document.getElementById("f-name");

    if (!slackEl.dataset.touched && slug) slackEl.value = "@" + slug;
  });
  emailEl.addEventListener("input", () => { emailEl.dataset.touched = "1"; });
  slackEl.addEventListener("input", () => { slackEl.dataset.touched = "1"; });

    e.preventDefault();
